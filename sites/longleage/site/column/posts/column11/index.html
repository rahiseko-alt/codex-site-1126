main:".studio.site",studioPublishUrl:"https://storage.googleapis.com/studio-publish",studioPublishIndexUrl:"https://storage.googleapis.com/studio-publish-index",rssApiPath:"https://rss.studiodesignapp.com/rssConverter",embedSandboxDomain:".studioiframesandbox.com",apiProxyUrl:"https://studio-api-proxy-rajzgb4wwq-an.a.run.app",proxyApiBaseUrl:"https://api.studiodesignapp.com/data_proxy_api",isDev:false,fontsApiBaseUrl:"https://fonts.studio.design",selfHostedFontsBaseUrl:"https://fonts.studio.design/ts",studioFrontUrl:"https://app.studio.design",jwtCookieName:"jwt_token",chillnnCdnUrl:"https://cdn.chillnn.com"},app:{baseURL:"/",buildId:"8bbfe36d-66d8-47fe-bf08-e611b7ce14d4",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__" type="application/json">[["ShallowReactive",1],{"data":2,"state":126,"once":128,"_errors":129,"serverRendered":131,"path":132,"pinia":133},["ShallowReactive",3],{"dynamicDatacolumn\u002Fposts\u002Fcolumn11":4},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":9,"ScKXlWON":12,"sB0E_NRW":72,"body":47,"_meta":119,"_filter":125,"id":59},"column11","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_431bf801-2026-4a74-b2ba-2adeefcbe3d7.png","フレンチネイルという、究極のエレガンス ","フレンチネイルという、究極のエレガンス\u003Cbr>",{"id":10,"title":11},"eixet5FE","爪のこと",{"slug":13,"cover":14,"title":15,"OkocjktT":16,"S2EU8djY":17,"ScKXlWON":18,"sB0E_NRW":45,"body":60,"_meta":61,"_filter":68,"id":71},"column_10","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_57a5525f-5ed0-47db-b649-49c909370b79.png","誰でも手に入れられる”黄金比の爪” ","誰でも手に入れられる”黄金比の爪”\u003Cbr>",{"id":10,"title":11},{"slug":19,"cover":20,"title":21,"OkocjktT":22,"S2EU8djY":23,"body":26,"_meta":27,"_filter":40,"id":44},"column_09","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a791b174-8ab2-40fc-8be3-2dc1a60f60f6.png","指先から素肌まで、”整える”ということ ","指先から素肌まで、”整える”ということ",{"id":24,"title":25},"iQIXcYlc","ロングルアージュ","\u003Cp data-uid=\"WGlmZ_HS\" data-time=\"1753234581716\">ロングルアージュに、\u003Cstrong>スキンケアシリーズ\u003C\u002Fstrong>があることをご存知でしょうか。\u003C\u002Fp>\u003Cp data-uid=\"0z5VARyq\" data-time=\"1753234784666\">爪を美しく育てるために、私たちはずっと\u003Cstrong>「保湿の大切さ」\u003C\u002Fstrong>をお伝えしてきました。どんなに丁寧なケアや美しいカラーを施しても、土台である爪が乾燥していては、美しさは長くは続きません。\u003C\u002Fp>\u003Cp data-uid=\"DuA1r8EA\" data-time=\"1753234316137\">それは、お肌も同じこと。\u003C\u002Fp>\u003Cp data-uid=\"H8Md8MYE\" data-time=\"1753234790063\">どんな美容成分よりもまず先に、\u003Cstrong>”うるおい”\u003C\u002Fstrong>を与えること。私たちは、そう考えています。\u003C\u002Fp>\u003Cp data-uid=\"f6qzrJYV\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"H7ZLarB1\" data-time=\"1753234793133\">ロングルアージュのスキンケアが生まれたきっかけは、十数年前。ネイルの施術前に使える、肌にやさしい化粧水を探していたことが始まりでした。\u003C\u002Fp>\u003Cp data-uid=\"WjNk7_Qf\" data-time=\"1753234866427\">敏感肌でアルコールが使えないお客様や、手を何度も洗うスタッフの手肌を守りたい。\u003C\u002Fp>\u003Cp data-uid=\"6OlrA7E6\" data-time=\"1753234316137\">その想いから出会ったのが、イオン化された水をベースに開発された保湿化粧水でした。\u003C\u002Fp>\u003Cp data-uid=\"reKVe5tf\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"cCzVYvZz\" data-time=\"1753234558568\">以来、この化粧水は、私たちにとって、爪と肌の\u003Cstrong>”うるおいの原点”\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"2er5wf2T\" data-time=\"1753234800803\">目立つ成分や香りで飾るのではなく、余計なものをそぎ落とし、必要な水分だけをまっすぐに届ける。爪も肌も、その人本来の美しさを引き出すには、\u003Cstrong>シンプルで上質な保湿\u003C\u002Fstrong>が欠かせないのです。\u003C\u002Fp>\u003Cp data-uid=\"caBH_vYZ\" data-time=\"1753234804189\">お客様の爪がみずみずしさを取り戻し、ふとした瞬間に光をまとった指先へと変わっていく。その小さな変化を、私たちは何度も目にしてきました。\u003C\u002Fp>\u003Cp data-uid=\"9ILvlcfU\" data-time=\"1753234316137\">その感動を、今度はお肌にも。\u003C\u002Fp>\u003Cp data-uid=\"g67qBUCi\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ysBnSRO5\" data-time=\"1753234808227\">誰もが安心して使えるものを。赤ちゃんも、ご年配の方も、敏感肌の方にも。\u003C\u002Fp>\u003Cp data-uid=\"xn7BxnUM\" data-time=\"1753234727877\">\u003Cstrong>爪を知り尽くしたネイルサロンが、本気でつくったスキンケア\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":28,"publishedAt":30,"createdAt":31,"order":32,"publishType":33,"schema":34,"uid":38,"updatedAt":39},{"id":29},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-07-23T01:41:44.000Z"],["Date","2025-07-23T01:29:12.000Z"],-1,"change",{"id":35,"key":36,"postType":37},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","RoToLWf6",["Date","2025-08-12T02:20:32.000Z"],[41,42,43],"ScKXlWON:E_jW5YMS","S2EU8djY:iQIXcYlc","sB0E_NRW:KE1ulQ6e","JMjR0bEKEMZAGOl10C2Z",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":46,"body":47,"_meta":48,"_filter":55,"id":59},{"id":10,"title":11},"\u003Cp data-uid=\"TzO1_z99\" data-time=\"1758507567717\">爪のおしゃれの究極といえば、やはり「フレンチネイル」。\u003C\u002Fp>\u003Cp data-uid=\"1N1gu8uW\" data-time=\"1758507575630\">透明感のある淡いピンクをベースに、先端へ弧を描くように白をのせる。シンプルでありながら、洗練を極めたスタイルです。\u003C\u002Fp>\u003Cp data-uid=\"Hf2F22Ej\" data-time=\"1758507567718\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"hGm1TwCq\" data-time=\"1758507676081\">フレンチネイルは王道のデザインでありながら、その美しさを引き立てるためには、爪のカーブや長さのバランスが重要です。\u003C\u002Fp>\u003Cp data-uid=\"N0UFHuj6\" data-time=\"1758507676081\">理想的なバランスをもつ爪に施すと、その魅力は格別。まさに、”黄金比”に近い形を持つ爪だけに許された、特別なデザインといえるでしょう。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"gVH1JvlR\" data-time=\"1758507580457\">けれど、その黄金比に近づくのは、決して特別な人だけではありません。日々のお手入れで少しずつ整えていくことで、誰もがその美しさに近づくことができます。&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"C70ROQTU\" data-time=\"1758507581675\">\u003C\u002Fp>\u003Cp data-uid=\"NeE71i4W\" data-time=\"1758507732537\">完成したフレンチネイルは、服を選ばず、シーンを選ばず、指先に清らかな気品を添えてくれます。\u003C\u002Fp>\u003Cp data-uid=\"cEvtnBzy\" data-time=\"1758507732537\">そして何より、ふと視線を落としたときに目に映る美しい自分の爪が、心を弾ませ、毎日を少し特別にしてくれるはずです。\u003C\u002Fp>\u003Cp data-uid=\"H4GLXJa7\" data-time=\"1758507567718\">\u003Cstrong>&nbsp;\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"lLMbCRBT\" data-time=\"1758507764685\">それは、自爪を大切に育ててきた人へのご褒美であり、これから育てていく人にとっての希望の象徴。\u003C\u002Fp>\u003Cp data-uid=\"p2ULiQa7\" data-time=\"1758507764685\">フレンチネイルは、指先だけでなく心までも晴れやかにする、永遠のエレガンスなのです。\u003C\u002Fp>",{"project":49,"publishedAt":50,"createdAt":51,"order":32,"publishType":33,"schema":52,"uid":53,"updatedAt":54},{"id":29},["Date","2025-09-22T02:26:16.000Z"],["Date","2025-09-22T02:18:17.000Z"],{"id":35,"key":36,"postType":37},"tZpN0s0o",["Date","2025-10-09T08:07:19.000Z"],[56,57,58],"S2EU8djY:eixet5FE","ScKXlWON:KE1ulQ6e","sB0E_NRW:P9iiKp18","VxEFHOQHTF9Nj2yEBK8I","\u003Cp data-uid=\"a293VHbE\" data-time=\"1754964096670\">これまで数えきれないほどの指先を見てきた経験から、「美しい」と感じる爪には、確かな共通点があると感じてきました。\u003C\u002Fp>\u003Cp data-uid=\"_VDYtYQ6\" data-time=\"1754964096670\">けれど、その理由を言葉で説明するのは、意外と難しいものでした。\u003C\u002Fp>\u003Cp data-uid=\"6BKwDMbL\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"QAqkrohU\" data-time=\"1754964313411\">「もしかすると、何か法則のようなものがあるのではないか。」そう思い、ふと頭に浮かんだのが\u003Cstrong>「黄金比」\u003C\u002Fstrong>でした。\u003C\u002Fp>\u003Cp data-uid=\"x2Z5nAFV\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"kpl_tqKp\" data-time=\"1754964378266\">名刺やクレジットカード、パリの凱旋門やギリシャのパルテノン神殿、エジプトのピラミッドなど、さまざまな絵画や建築にも用いられる、\u003Cstrong>黄金比 1：1.6\u003C\u002Fstrong>という比率。古代から「美しい」と称えられてきた建造物の多くに、この比率が隠れています。\u003C\u002Fp>\u003Cp data-uid=\"8Y3x26U8\" data-time=\"1754964291742\">そして、実はこの黄金比が、\u003Cstrong>爪の美しさ\u003C\u002Fstrong>にも通じていたのです。\u003C\u002Fp>\u003Cp data-uid=\"IYipAC_B\" data-time=\"1754964129327\">\u003C\u002Fp>\u003Cp data-uid=\"TpTksEqu\" data-time=\"1754964461806\">長年サロンに通ってくださっているお客さまの中で、誰もが見惚れるほど美しい爪をお持ちの方々の指先を計測してみると、\u003Cstrong>爪の高さ（カーブ）と爪の幅\u003C\u002Fstrong>が、まさに\u003Cstrong>1：1.6\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"oJaKWgQ1\" data-time=\"1754963947362\">その中には、まるで黄金長方形が描かれているかのようでした。\u003C\u002Fp>\u003Cfigure data-uid=\"kZXWxUop\" data-time=\"1754964038732\" data-thread=\"\" style=\"text-align: \">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1200x800_v-fms_webp_b27b8685-4c8c-492d-a6a2-277955986822.png\" alt=\"\" width=\"370.98748779296875\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"vPZy2LGw\" data-time=\"1754964053217\">この\u003Cstrong>“爪の黄金比”\u003C\u002Fstrong>は、特別な人だけが持つものではありません。\u003C\u002Fp>\u003Cp data-uid=\"erNH27BV\" data-time=\"1754963947362\">日々の丁寧なお手入れによって、どなたの指先にもゆっくりと、確実に育まれていくものです。\u003C\u002Fp>\u003Cp data-uid=\"DmN7Jtt1\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ktbl36gb\" data-time=\"1754964493972\">爪の形は変えることができます。美しさは、日々の積み重ねの先に現れます。\u003C\u002Fp>\u003Cp data-uid=\"v3GbCQS3\" data-time=\"1754964504220\">そして今日のお手入れが、明日の指先の印象を変えていくのです。\u003C\u002Fp>",{"project":62,"publishedAt":63,"createdAt":64,"order":32,"publishType":33,"schema":65,"uid":66,"updatedAt":67},{"id":29},["Date","2025-08-12T02:20:23.000Z"],["Date","2025-08-12T01:58:20.000Z"],{"id":35,"key":36,"postType":37},"KE1ulQ6e",["Date","2025-09-22T02:26:25.000Z"],[56,69,70],"ScKXlWON:RoToLWf6","sB0E_NRW:tZpN0s0o","DX6Kmix35KCc1oD6MVfK",{"slug":73,"cover":74,"title":75,"OkocjktT":75,"S2EU8djY":76,"ScKXlWON":79,"sB0E_NRW":88,"body":106,"_meta":107,"_filter":114,"id":118},"column_12","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_3b015fa0-c19a-4ba4-ae09-20ace607741f.png","マニキュアを乾かす時間という、豊かな美の習慣",{"id":77,"title":78},"hm0DQq4I","美学",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":80,"body":47,"_meta":81,"_filter":87,"id":59},{"id":10,"title":11},{"project":82,"publishedAt":83,"createdAt":84,"order":32,"publishType":33,"schema":85,"uid":53,"updatedAt":86},{"id":29},["Date","2025-09-22T02:26:16.000Z"],["Date","2025-09-22T02:18:17.000Z"],{"id":35,"key":36,"postType":37},["Date","2025-10-09T08:07:19.000Z"],[56,57,58],{"slug":89,"cover":90,"title":91,"OkocjktT":92,"S2EU8djY":93,"body":94,"_meta":95,"_filter":102,"id":105},"column13","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_d1385d83-0352-4d6f-b98a-4a13e9b3f3e2.png","ロングルアージュで流れる、私だけのひととき","ロングルアージュで流れる、私だけのひととき\u003Cbr>",{"id":24,"title":25},"\u003Cp data-uid=\"pSontbV0\" data-time=\"1763344757987\">ロングルアージュのサロンには、一人ひとりに違う「過ごし方」があります。\u003C\u002Fp>\u003Cp data-uid=\"f8DK74FL\" data-time=\"1763344757987\">扉を開くと、それぞれの日常から少し離れた、自分だけの時間が静かに流れはじめます。\u003C\u002Fp>\u003Cp data-uid=\"WFMaGPCe\" data-time=\"1763344757987\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"x5VyD463\" data-time=\"1763344757987\">あるお客さまは、デジタルデトックスのひとときとして、マニキュアリストとのおしゃべりを存分に楽しんでくださいます。日々のあれこれを語り合うその時間は、まるで小さなコミュニティのよう。\u003C\u002Fp>\u003Cp data-uid=\"x750ZsDX\" data-time=\"1763344767956\">一方で、イヤホンから流れる好きな音楽に身をゆだね、静けさの中で心を整えながら施術を受ける方もいらっしゃいます。指先が整うにつれ、気持ちもすっと軽くなるようです。\u003C\u002Fp>\u003Cp data-uid=\"oEVPFLes\" data-time=\"1763344757987\">マニキュアとペディキュアに肩のマッサージを加え、深い呼吸とともにリラクゼーションに浸る方。\u003C\u002Fp>\u003Cp data-uid=\"wS4ioxlC\" data-time=\"1763344757987\">フットバスで足を温めながら、ハードカバーの本を片手にゆっくりと読書を楽しまれる方。\u003C\u002Fp>\u003Cp data-uid=\"GJCw0az_\" data-time=\"1763344757987\">お友達とご一緒に来店され、久しぶりの再会を満喫される方もいらっしゃいます。\u003C\u002Fp>\u003Cp data-uid=\"OaHrjZWb\" data-time=\"1763344757988\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"aQ5jt3CV\" data-time=\"1763344822799\">手や足を預けていただくという”無防備”な時間と空間。\u003C\u002Fp>\u003Cp data-uid=\"E4Ek8dv2\" data-time=\"1763344824901\">そこには、その方の生き方やお人柄がふと表れる瞬間があります。\u003C\u002Fp>\u003Cp data-uid=\"2rD_DsJV\" data-time=\"1763344824901\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"8Usf1jf7\" data-time=\"1763344838199\">自分のためだけに使う、ささやかだけれど豊かな時間。\u003C\u002Fp>\u003Cp data-uid=\"W8_9Eq0O\" data-time=\"1763344850208\">ここは爪を整える場所でありながら、日常の喧噪を忘れられる小さな隠れ家でもあります。\u003C\u002Fp>\u003Cp data-uid=\"c7XqOiec\" data-time=\"1763344850631\">\u003C\u002Fp>\u003Cp data-uid=\"QaXi4xE0\" data-time=\"1763344845651\">ロングルアージュは、誰にもとらわれず、肩の力を抜き、自然体の自分と向き合える場所。\u003C\u002Fp>\u003Cp data-uid=\"NyY9HZ4L\" data-time=\"1763344845651\">そんなやさしい時間が、いつでも皆さまをお待ちしています。\u003C\u002Fp>\u003Cp data-uid=\"mwR5IAuf\" data-time=\"1763344800485\">\u003C\u002Fp>\u003Cp data-uid=\"Gony00mN\" data-time=\"1763344757988\">そして、お帰りの際、ふっと口元に柔らかな笑みが広がる瞬間があります。\u003C\u002Fp>\u003Cp data-uid=\"kKPAQpGi\" data-time=\"1763344891600\">その表情に触れられることこそ、私たちマニキュアリストにとって何よりの喜びです。\u003C\u002Fp>",{"project":96,"publishedAt":97,"createdAt":98,"order":32,"publishType":33,"schema":99,"uid":100,"updatedAt":101},{"id":29},["Date","2025-11-17T02:01:37.000Z"],["Date","2025-11-17T01:58:30.000Z"],{"id":35,"key":36,"postType":37},"qL9TUepS",["Date","2025-12-02T08:53:40.000Z"],[42,103,104],"ScKXlWON:P9iiKp18","sB0E_NRW:AugkL2u5","P5SINRoyUUsIhBaztNQ7","\u003Cp data-uid=\"kk_FzwEN\" data-time=\"1759996803870\">マニキュアを塗ったあとの「乾かす時間」。\u003C\u002Fp>\u003Cp data-uid=\"w89bcjWa\" data-time=\"1759997098440\">多くの人が、手が使えないその時間を“もったいない” “面倒”と感じるかもしれません。\u003C\u002Fp>\u003Cp data-uid=\"iM3Bhjuq\" data-time=\"1759997108556\">けれどロングルアージュは、\u003Cstrong>その時間こそが、自分をより美しく整えるひととき\u003C\u002Fstrong>だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"1gZTwC5d\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"5WgWT345\" data-time=\"1759997117848\">\u003Cstrong>30分ほど、何も手を使わずに静かに過ごす。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"9DVkDrIO\" data-time=\"1759996803870\">それは、忙しい毎日の中ではむしろ贅沢なこと。\u003C\u002Fp>\u003Cp data-uid=\"ijBPZmDj\" data-time=\"1759997125731\">自分の呼吸や姿勢、指先の所作に意識を向けてみると、その時間が\u003Cstrong>「内面を整える時間」へと変わっていきます。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"y4cUP2GH\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"3tSXfYIz\" data-time=\"1759997154256\">乾くのを待つあいだに、心が静まり、所作が丁寧になり、やがて\u003Cstrong>“ゆっくり動くこと”の美しさ\u003C\u002Fstrong>に気づくでしょう。\u003C\u002Fp>\u003Cp data-uid=\"Lfmuank_\" data-time=\"1759996932021\">マニキュアが乾いたあとも、その感覚は残り、手の動き一つひとつに、品と落ち着きが宿ります。\u003C\u002Fp>\u003Cp data-uid=\"9gp8ZVNl\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wjfhB60N\" data-time=\"1759997168968\">\u003Cstrong>誰にも見られていない時間にこそ、真の美しさは育まれる。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"Kg39og1G\" data-time=\"1759997191939\">そんな小さな積み重ねが、ロングルアージュが大切にする\u003Cstrong>「長く続く美しさ」につながっていくのです。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"o1QZCaq_\" data-time=\"1759996803871\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"mH0Hm4rC\" data-time=\"1759996803871\">便利さよりも、美しさの本質を選ぶということ。\u003C\u002Fp>\u003Cp data-uid=\"yCdHfDnt\" data-time=\"1759997204966\">その選択こそが、\u003Cstrong>ロングルアージュの美学\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"boKUb1iX\" data-time=\"1759996803871\">\u003Cbr>\u003C\u002Fp>",{"project":108,"publishedAt":109,"createdAt":110,"order":32,"publishType":33,"schema":111,"uid":112,"updatedAt":113},{"id":29},["Date","2025-10-09T08:07:09.000Z"],["Date","2025-10-09T07:59:03.000Z"],{"id":35,"key":36,"postType":37},"P9iiKp18",["Date","2025-11-17T02:01:46.000Z"],[115,116,117],"S2EU8djY:hm0DQq4I","ScKXlWON:tZpN0s0o","sB0E_NRW:qL9TUepS","8ONvON4rPBAG7dU1khVo",{"project":120,"publishedAt":121,"createdAt":122,"order":32,"publishType":33,"schema":123,"uid":53,"updatedAt":124},{"id":29},["Date","2025-09-22T02:26:16.000Z"],["Date","2025-09-22T02:18:17.000Z"],{"id":35,"key":36,"postType":37},["Date","2025-10-09T08:07:19.000Z"],[56,57,58],["Reactive",127],{},["Set"],["ShallowReactive",130],{"dynamicDatacolumn\u002Fposts\u002Fcolumn11":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn11",["Reactive",134],{"cmsContentStore":135,"projectStore":139,"productStore":160,"pageHeadStore":703,"cmsStore":707,"useSnackBarStore":715},{"listContentsMap":136,"contentMap":137},["Map"],["Map",138,4],"SLmv5Xy5\u002Fcolumn11",{"siteHost":140,"customProxyDomain":141,"project":142},"longleage.co.jp","",{"id":143,"name":25,"customDomain":141,"iconImage":141,"coverImage":144,"displayBadge":145,"integrations":146,"snapshot_path":158,"snapshot_id":159,"recaptchaSiteKey":-1,"conversionEvents":-1},"xPORdZvpar","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F0f5840fe-8094-40fc-9ebe-de2bc0684702",false,[147,150,152,155],{"integration_name":148,"code":149},"custom-code","true",{"integration_name":151,
