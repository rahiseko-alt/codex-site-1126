udioDomain:".studio.site",studioPublishUrl:"https://storage.googleapis.com/studio-publish",studioPublishIndexUrl:"https://storage.googleapis.com/studio-publish-index",rssApiPath:"https://rss.studiodesignapp.com/rssConverter",embedSandboxDomain:".studioiframesandbox.com",apiProxyUrl:"https://studio-api-proxy-rajzgb4wwq-an.a.run.app",proxyApiBaseUrl:"https://api.studiodesignapp.com/data_proxy_api",isDev:false,fontsApiBaseUrl:"https://fonts.studio.design",selfHostedFontsBaseUrl:"https://fonts.studio.design/ts",studioFrontUrl:"https://app.studio.design",jwtCookieName:"jwt_token",chillnnCdnUrl:"https://cdn.chillnn.com"},app:{baseURL:"/",buildId:"8bbfe36d-66d8-47fe-bf08-e611b7ce14d4",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__" type="application/json">[["ShallowReactive",1],{"data":2,"state":129,"once":131,"_errors":132,"serverRendered":134,"path":135,"pinia":136},["ShallowReactive",3],{"dynamicDatacolumn\u002Fposts\u002Fcolumn16":4},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":9,"ScKXlWON":12,"sB0E_NRW":74,"body":48,"_meta":122,"_filter":128,"id":60},"column16","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_103d36ee-69ad-402e-81a2-d556f084dc80.png","ロングルアージュといえば、ネイルケア","ロングルアージュといえば、ネイルケア。",{"id":10,"title":11},"iQIXcYlc","ロングルアージュ",{"slug":13,"cover":14,"title":15,"OkocjktT":16,"S2EU8djY":17,"ScKXlWON":20,"sB0E_NRW":46,"body":61,"_meta":62,"_filter":69,"id":73},"column15","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_393ed447-c96d-43ca-8a07-1522f2263e48.png","どのネイルを選んでも、「自爪」はひとつ ","どのネイルを選んでも、「自爪」はひとつ ",{"id":18,"title":19},"hm0DQq4I","美学",{"slug":21,"cover":22,"title":23,"OkocjktT":23,"S2EU8djY":24,"body":27,"_meta":28,"_filter":41,"id":45},"column14","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_4be7455d-c3a1-4d2f-a025-a2afb7074321.png","“ラウンドスクエア”という、爪を育てるための形",{"id":25,"title":26},"eixet5FE","爪のこと","\u003Cp data-uid=\"i4uyTKE0\" data-time=\"1764665383555\">多くの方が「爪の形は生まれつき」と思いがちですが、実は日々の整え方によって、そのかたちはゆるやかに変わっていきます。\u003C\u002Fp>\u003Cp data-uid=\"tHFKRS5T\" data-time=\"1764665439977\">\u003C\u002Fp>\u003Cp data-uid=\"HxgsiySj\" data-time=\"1764665383555\">ロングルアージュが長年大切にしているのが、独自の“ラウンドスクエア”という形です。\u003C\u002Fp>\u003Cp data-uid=\"J1Oa9DvW\" data-time=\"1764665383555\">\u003Cstrong>ラウンドスクエアは、側面をまっすぐに整え、先端の角だけをやわらかく落としたフォルム。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"jmZ8syWw\" data-time=\"1764665383555\">指先から1～2mmという適切な長さでこの形を保つことで、ストレスポイントに負荷がかかりにくくなり、折れにくく、ほどよい巻きを帯びた“しなやかで美しいライン”が育まれます。\u003C\u002Fp>\u003Cp data-uid=\"3D4aCOhO\" data-time=\"1764665447742\">\u003C\u002Fp>\u003Cp data-uid=\"BuQfeYsk\" data-time=\"1764665383555\">丸すぎても、四角すぎても、爪は弱くなりがち。\u003C\u002Fp>\u003Cp data-uid=\"oTFeNjdL\" data-time=\"1764665383555\">そのどちらにも寄らない絶妙なバランスこそが、ラウンドスクエアの魅力です。\u003C\u002Fp>\u003Cp data-uid=\"WjZiSq2f\" data-time=\"1764665383555\">爪のサイドをしっかり支え、先端にほど良い丸みを持たせることで、健康的な爪を育てる理想的な形が生まれます。\u003C\u002Fp>\u003Cfigure data-uid=\"vK_uWxPc\" data-time=\"1764665552841\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1500x1000_v-fms_webp_2f7ebffa-4125-4874-8fd2-01d05e00e18e.png\" alt=\"\" width=\"345.98748779296875\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"HuAS1sUN\" data-time=\"1764665552841\">\u003C\u002Fp>\u003Cp data-uid=\"IGKPTHZF\" data-time=\"1764665383555\">継続して整えていくと、サイドの支えが安定し、爪はブリッジのように美しい弧を描きはじめます。\u003C\u002Fp>\u003Cp data-uid=\"YJ8ZEPKS\" data-time=\"1764665383555\">カーブのある爪は立体感が生まれ、見た目がぐっと洗練されるだけでなく、ラウンドスクエアとの相乗効果で、手全体をすっきりと細く魅せる視覚効果も期待できます。\u003C\u002Fp>\u003Cp data-uid=\"zCIJzokg\" data-time=\"1764665383555\">平らで丸い爪はどうしても幼く、やや幅広に見えがち。\u003C\u002Fp>\u003Cp data-uid=\"G2P3IGBs\" data-time=\"1764665383555\">カーブが生まれることで、衝撃によるダメージが伝わりにくくなるため、爪そのものの強度も高まります。\u003C\u002Fp>\u003Cp data-uid=\"ga1HnBAR\" data-time=\"1764665500270\">つまり、ラウンドスクエアは\u003Cstrong>「強くて美しく育つ爪」\u003C\u002Fstrong>をつくるための最良の形なのです。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"yxh8VvF4\" data-time=\"1764665476961\">\u003C\u002Fp>\u003Cp data-uid=\"rNq3D7QA\" data-time=\"1764665383555\">日々のネイルケアによって、爪は必ず変わります。\u003C\u002Fp>\u003Cp data-uid=\"mfGvU7Mr\" data-time=\"1764665383555\">「生まれつきだから…」と諦めていた形も、丁寧なケアを重ねることで、もっと美しく、もっと扱いやすく。\u003C\u002Fp>\u003Cp data-uid=\"vHdOAFHD\" data-time=\"1764665383556\">ロングルアージュのネイルケアは、その変化を支え、未来の指先を育てていきます。\u003C\u002Fp>",{"project":29,"publishedAt":31,"createdAt":32,"order":33,"publishType":34,"schema":35,"uid":39,"updatedAt":40},{"id":30},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-12-02T08:52:42.000Z"],["Date","2025-12-02T08:49:19.000Z"],-1,"change",{"id":36,"key":37,"postType":38},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","AugkL2u5",["Date","2025-12-25T07:28:12.000Z"],[42,43,44],"S2EU8djY:eixet5FE","ScKXlWON:qL9TUepS","sB0E_NRW:1PC4AdM5","NAZVeGImOE1VrKQnfjyP",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":47,"body":48,"_meta":49,"_filter":56,"id":60},{"id":10,"title":11},"\u003Cp data-uid=\"pue95c51\" data-time=\"1767754539500\">ネイルケアをすると、何が変わるのでしょうか。色がつくことでも、飾りが増えることでもありません。\u003C\u002Fp>\u003Cp data-uid=\"poVO2zTH\" data-time=\"1767755089705\">\u003C\u002Fp>\u003Cp data-uid=\"CSmLTyB1\" data-time=\"1767755070201\">ふと手元を見たとき、\u003Cstrong>「きれいだな」と静かに思えること。\u003C\u002Fstrong>誰かと名刺を交わす、人と向き合うその一瞬に、\u003Cstrong>自然と自信をもって差し出せること。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"6x2tBq1L\" data-time=\"1767755070201\">ネイルケアは、\u003Cstrong>清潔感や信頼感を、言葉にせずに伝えてくれるもの\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"45eZkHfA\" data-time=\"1767754796464\">\u003C\u002Fp>\u003Cp data-uid=\"5Ovz_HlD\" data-time=\"1767754858322\">ロングルアージュは創業以来、「自爪を整えること」を大切にしてきました。流行が変わり、ネイルの選択肢が増えた今も、その考えは変わりません。\u003C\u002Fp>\u003Cp data-uid=\"ly2KROGU\" data-time=\"1767754887458\">ジェルネイルを楽しむ人もいれば、マニキュアを選ぶ人、何もしないという選択をする人もいます。\u003Cstrong>どれも、間違いではありません。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"xeVpsZpm\" data-time=\"1767754161896\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wzovwaPX\" data-time=\"1767754890718\">けれど、どの選択の先にもあるのは\u003Cstrong>「自爪」\u003C\u002Fstrong>。土台が整っているからこそ、ネイルは美しく映り、長く楽しむことができます。\u003C\u002Fp>\u003Cp data-uid=\"B_UKHzx3\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"NYjGjIU9\" data-time=\"1767754894728\">ネイルケアは、誰かに見せるためだけのものではありません。流されず、自分の基準で美しさを選ぶということ。\u003C\u002Fp>\u003Cp data-uid=\"sc3qndyw\" data-time=\"1767754980314\">派手でなくてもいい。目立たなくてもいい。けれど、\u003Cstrong>手元に自信があるという感覚は、日常のふるまいに、確かに現れます。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"rYxTGIj3\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"vb9FC3Dc\" data-time=\"1767754496851\">ロングルアージュが目指しているのは、\u003Cstrong>「ネイルをする人」\u003C\u002Fstrong>ではなく、\u003Cstrong>「ネイルケアを知っている人」\u003C\u002Fstrong>を増やすこと。\u003C\u002Fp>\u003Cp data-uid=\"7jOow6lr\" data-time=\"1767754502538\">それは、年齢や立場を問わず、\u003Cstrong>すべての人にとって必要な美しさ\u003C\u002Fstrong>だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"51tYUBZ4\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"NmGJnbbW\" data-time=\"1767754996062\">\u003Cstrong>2026年。\u003C\u002Fstrong>ロングルアージュは、あらためてここに立ち返ります。\u003C\u002Fp>\u003Cp data-uid=\"bHB7XzrX\" data-time=\"1767754161897\">ロングルアージュといえば、ネイルケア。\u003C\u002Fp>\u003Cp data-uid=\"lLeG3zVN\" data-time=\"1767755001393\">それは、\u003Cstrong>飾る前に整える\u003C\u002Fstrong>ということ。\u003Cstrong>自分を大切にする姿勢を、指先から伝える\u003C\u002Fstrong>ということ。\u003C\u002Fp>\u003Cp data-uid=\"zvlo3nvm\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"4DVyilkK\" data-time=\"1767755005917\">私たちはこれからも、ネイルケアの価値を、丁寧に、まっすぐに伝えていきます。\u003C\u002Fp>",{"project":50,"publishedAt":51,"createdAt":52,"order":33,"publishType":34,"schema":53,"uid":54,"updatedAt":55},{"id":30},["Date","2026-01-07T03:07:17.000Z"],["Date","2026-01-07T02:49:11.000Z"],{"id":36,"key":37,"postType":38},"L_W7Okje",["Date","2026-02-12T08:34:20.000Z"],[57,58,59],"S2EU8djY:iQIXcYlc","ScKXlWON:1PC4AdM5","sB0E_NRW:LinvCeG7","dgZ9fGyIYS4xlddxdkpe","\u003Cp data-uid=\"tKOSZDKp\" data-time=\"1766647178038\">ネイルサロンに通う理由は、人それぞれです。\u003C\u002Fp>\u003Cp data-uid=\"BwfHRoC_\" data-time=\"1766647178038\">指先をきれいに見せたい、気分を上げたい、身だしなみとして整えたい。\u003Cstrong>ネイルの楽しみ方は、時代とともに大きく広がってきました。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"T_G2Keqs\" data-time=\"1766646666208\">\u003C\u002Fp>\u003Cp data-uid=\"0FjRvXpi\" data-time=\"1766647036848\">ロングルアージュが創業して以来、ネイル業界の流れも大きく変化しています。マニキュアが主流だった時代から、スカルプチュア、ジェルネイルへ。そしてコロナ禍をきっかけに、\u003Cstrong>セルフネイルという選択肢も、再び身近なもの\u003C\u002Fstrong>になりました。\u003C\u002Fp>\u003Cp data-uid=\"CcpnuJaq\" data-time=\"1766646711218\">今では多くの人が、自分のライフスタイルや価値観に合わせて\u003Cstrong>「どんなネイルを楽しむか」を自由に選べる時代\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"5HCdecPN\" data-time=\"1766646714623\">\u003C\u002Fp>\u003Cp data-uid=\"l03lJorV\" data-time=\"1766647130206\">ロングルアージュでは、施術者のことを\u003Cstrong>マニキュアリスト\u003C\u002Fstrong>と呼んでいます。それは、ただ色を塗る人ではないから。\u003C\u002Fp>\u003Cp data-uid=\"jHy2QOhZ\" data-time=\"1766647130206\">\u003Cstrong>自爪の成長を考え、爪そのものだけでなく、手全体が美しく見えること\u003C\u002Fstrong>を大切にした施術を行う存在だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"tJ6qsqoy\" data-time=\"1766646805681\">\u003C\u002Fp>\u003Cp data-uid=\"0WagTUFA\" data-time=\"1766647063282\">たくさんのネイルサロンがあり、それぞれの個性があることは、とても素敵なこと。ジェルネイルを選ぶ方もいれば、あえて何もしない、という選択もあるでしょう。\u003C\u002Fp>\u003Cp data-uid=\"juubB1yK\" data-time=\"1766647149482\">けれど、どのネイルを選んだとしても、\u003Cstrong>その土台にあるのは、いつも「自爪」です。\u003C\u002Fstrong>自爪があってこそ、ネイルは成り立ちます。\u003Cstrong>土台が整っていなければ、本当の美しさは長く続きません。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"QzbYmftX\" data-time=\"1766646878056\">\u003C\u002Fp>\u003Cp data-uid=\"5euYTHzY\" data-time=\"1766646890567\">自爪の健康は、\u003Cstrong>特別な人だけのものではなく、ネイルを楽しむすべての人にとって必要なこと。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"EqzkGZlf\" data-time=\"1766647162163\">ロングルアージュは、これからも変わらず、「自爪を整えることの大切さ」を伝え続けていきます。それは流行ではなく、\u003Cstrong>美しさの本質\u003C\u002Fstrong>だと、私たちは信じているからです。\u003C\u002Fp>",{"project":63,"publishedAt":64,"createdAt":65,"order":33,"publishType":34,"schema":66,"uid":67,"updatedAt":68},{"id":30},["Date","2025-12-30T01:00:00.000Z"],["Date","2025-12-25T07:06:55.000Z"],{"id":36,"key":37,"postType":38},"1PC4AdM5",["Date","2026-01-07T03:07:30.000Z"],[70,71,72],"S2EU8djY:hm0DQq4I","ScKXlWON:AugkL2u5","sB0E_NRW:L_W7Okje","8dIphMSApiqjK2HlaqxE",{"slug":75,"cover":76,"title":77,"OkocjktT":78,"S2EU8djY":79,"ScKXlWON":80,"sB0E_NRW":89,"body":110,"_meta":111,"_filter":118,"id":121},"column17","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_daf9d8b1-33bf-46b2-a750-6122af3a9feb.png","ネイルカラーを塗ってこそ、ネイルケアは仕上がる ","ネイルカラーを塗ってこそ、ネイルケアは仕上がる",{"id":10,"title":11},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":81,"body":48,"_meta":82,"_filter":88,"id":60},{"id":10,"title":11},{"project":83,"publishedAt":84,"createdAt":85,"order":33,"publishType":34,"schema":86,"uid":54,"updatedAt":87},{"id":30},["Date","2026-01-07T03:07:17.000Z"],["Date","2026-01-07T02:49:11.000Z"],{"id":36,"key":37,"postType":38},["Date","2026-02-12T08:34:20.000Z"],[57,58,59],{"slug":90,"cover":91,"title":92,"OkocjktT":93,"S2EU8djY":94,"body":97,"_meta":98,"_filter":105,"id":109},"column18","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_9f494d39-862b-424b-a088-d01781b50e0b.png","なぜ、私たちは商品を作るのか　Vol.1 ネイルケアとスキンケア、その原点","なぜ、私たちは商品を作るのか\u003Cbr>Vol.1 ネイルケアとスキンケア、その原点",{"id":95,"title":96},"skaeleJ7","プロダクト","\u003Cp data-uid=\"Z4HLZbSA\" data-time=\"1778832462660\">ネイルケアは、おしゃれのためだけのものだと思われがちです。\u003C\u002Fp>\u003Cp data-uid=\"UvSlrIds\" data-time=\"1778832462660\">けれどロングルアージュが考えるネイルケアは、もっと日常に近いもの。\u003C\u002Fp>\u003Cp data-uid=\"vNDk1GRI\" data-time=\"1778832493762\">身だしなみの一部でありながら、ふとした瞬間に、自分に少しの自信や余裕を与えてくれるものだと考えています。\u003C\u002Fp>\u003Cp data-uid=\"5ml7evQL\" data-time=\"1778832496915\">\u003C\u002Fp>\u003Cp data-uid=\"9tzZ75DE\" data-time=\"1778832496142\">私たちは、ネイルケアをしていない爪に、色を塗ることはありません。\u003C\u002Fp>\u003Cp data-uid=\"5NRAu0Pc\" data-time=\"1778832514784\">どんな色もどんなデザインも、土台が整っていてこそ、美しく、心地よく楽しめる。\u003C\u002Fp>\u003Cp data-uid=\"_ut9eNZ5\" data-time=\"1778831233104\">それが、長く爪と向き合ってきた私たちの結論です。\u003C\u002Fp>\u003Cp data-uid=\"aQj3B3q0\" data-time=\"1778832524896\">\u003C\u002Fp>\u003Cp data-uid=\"3S7YVkoN\" data-time=\"1778832535002\">そしてこの\u003Cstrong>「土台を整える」\u003C\u002Fstrong>という考え方は、ネイルケアだけでなく、スキンケアにも共通するものでした。\u003C\u002Fp>",{"project":99,"publishedAt":100,"createdAt":101,"order":33,"publishType":34,"schema":102,"uid":103,"updatedAt":104},{"id":30},["Date","2026-05-15T08:10:48.000Z"],["Date","2026-05-15T07:47:13.000Z"],{"id":36,"key":37,"postType":38},"zdyVNTZ3",["Date","2026-05-29T07:21:28.000Z"],[106,107,108],"S2EU8djY:skaeleJ7","ScKXlWON:LinvCeG7","sB0E_NRW:_b6L6F13","b1RxrxFdcOILKT1887i1","\u003Cp data-uid=\"GvGYpeQ5\" data-time=\"1770884181722\">ロングルアージュのネイルケアは、丁寧に整えた爪にネイルカラーをのせることで完成します。\u003C\u002Fp>\u003Cp data-uid=\"6hKsoXJT\" data-time=\"1770884185014\">\u003C\u002Fp>\u003Cp data-uid=\"TGu3FYw3\" data-time=\"1770884346338\">ベースコート、ネイルカラーを2度塗り、トップコート\u003Cstrong>。\u003C\u002Fstrong>そして、\u003Cstrong>3日に一度トップコートを重ねること。\u003C\u002Fstrong>\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"5gOzYA4F\" data-time=\"1770884397256\">ネイルカラーをまとうことで、爪にはほどよい厚みと安定感が生まれます。私たちが理想とするのは、なめらかなカーブを描く、しなやかな爪。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"qTTQR683\" data-time=\"1770884427291\">カラーを含めた4層のコーティングは、爪を補強し、日常の小さな衝撃から守る役割も果たしてくれます。\u003C\u002Fp>\u003Chr data-uid=\"hIRI_L2j\" data-time=\"1770884819819\">\u003Cp data-uid=\"440sRFYK\" data-time=\"1770884452886\">そして、もうひとつの楽しみが\u003Cstrong>「色を選ぶ時間」\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"ENw_2r0j\" data-time=\"1770884471839\">サロンの棚に並ぶ、数えきれないほどのネイルカラー。眺めているだけで、心がふっと弾む瞬間です。\u003C\u002Fp>\u003Cp data-uid=\"SQiUGpIO\" data-time=\"1770884477648\">\u003C\u002Fp>\u003Cp data-uid=\"LaCcSlaO\" data-time=\"1770884540971\">日常のカラー選びで大切にしているのは、ベージュや淡いピンクなど、肌になじむ色を選ぶこと。\u003C\u002Fp>\u003Cp data-uid=\"DJnQTVFu\" data-time=\"1770884528748\">ロングルアージュでは、\u003Cstrong>爪は主張しすぎないほうが、手全体がきれいに見える\u003C\u002Fstrong>と考えています。\u003C\u002Fp>\u003Cp data-uid=\"0Xj_2mRc\" data-time=\"1770883896411\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"iH1b54LJ\" data-time=\"1770884592260\">一見すると、何も塗っていないようで、近くで見ると、きちんと整えられた指先にさりげなくツヤと色が宿っている。\u003C\u002Fp>\u003Cp data-uid=\"U4g6rK2N\" data-time=\"1770884632019\">その\u003Cstrong>さりげなさと清潔感\u003C\u002Fstrong>こそが、大人の手元をいちばん美しく魅せてくれるのだと思っています。\u003C\u002Fp>\u003Chr data-uid=\"9oGbevQU\" data-time=\"1770884629713\">\u003Cp data-uid=\"fusCrO9w\" data-time=\"1770884725831\">サロンでは、マニキュアリストがお好みやライフスタイルを伺いながら、実際に試し塗りをして色を決めていきます。\u003C\u002Fp>\u003Cp data-uid=\"UmX7psua\" data-time=\"1770883896411\">ボトルで見たときは理想的でも、爪にのせると印象が変わったり、肌が暗く見えることも。\u003C\u002Fp>\u003Cp data-uid=\"dFtfrv87\" data-time=\"1770884753215\">反対に、「これは意外」と思った色が、驚くほど自然になじむこともあります。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"MDSa4fDi\" data-time=\"1770884757379\">ぜひロングルアージュで、\u003C\u002Fp>\u003Cp data-uid=\"qmO8snVx\" data-time=\"1770884819819\">\u003Cstrong>長く付き合える定番の一本\u003C\u002Fstrong>を見つけてみてください。\u003C\u002Fp>",{"project":112,"publishedAt":113,"createdAt":114,"order":33,"publishType":34,"schema":115,"uid":116,"updatedAt":117},{"id":30},["Date","2026-02-12T08:32:16.000Z"],["Date","2026-02-12T08:11:18.000Z"],{"id":36,"key":37,"postType":38},"LinvCeG7",["Date","2026-05-20T07:36:15.000Z"],[57,119,120],"ScKXlWON:L_W7Okje","sB0E_NRW:zdyVNTZ3","xnar9rt68Fjjpwlga0Ew",{"project":123,"publishedAt":124,"createdAt":125,"order":33,"publishType":34,"schema":126,"uid":54,"updatedAt":127},{"id":30},["Date","2026-01-07T03:07:17.000Z"],["Date","2026-01-07T02:49:11.000Z"],{"id":36,"key":37,"postType":38},["Date","2026-02-12T08:34:20.000Z"],[57,58,59],["Reactive",130],{},["Set"],["ShallowReactive",133],{"dynamicDatacolumn\u002Fposts\u002Fcolumn16":-1},true,"\u002Fcolumn\u002Fposts\u002Fco
