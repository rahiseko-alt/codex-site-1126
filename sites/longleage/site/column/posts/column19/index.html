rebaseUseEmulator:false,studioDomain:".studio.site",studioPublishUrl:"https://storage.googleapis.com/studio-publish",studioPublishIndexUrl:"https://storage.googleapis.com/studio-publish-index",rssApiPath:"https://rss.studiodesignapp.com/rssConverter",embedSandboxDomain:".studioiframesandbox.com",apiProxyUrl:"https://studio-api-proxy-rajzgb4wwq-an.a.run.app",proxyApiBaseUrl:"https://api.studiodesignapp.com/data_proxy_api",isDev:false,fontsApiBaseUrl:"https://fonts.studio.design",selfHostedFontsBaseUrl:"https://fonts.studio.design/ts",studioFrontUrl:"https://app.studio.design",jwtCookieName:"jwt_token",chillnnCdnUrl:"https://cdn.chillnn.com"},app:{baseURL:"/",buildId:"8bbfe36d-66d8-47fe-bf08-e611b7ce14d4",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__" type="application/json">[["ShallowReactive",1],{"data":2,"state":122,"once":124,"_errors":125,"serverRendered":127,"path":128,"pinia":129},["ShallowReactive",3],{"dynamicDatacolumn\u002Fposts\u002Fcolumn19":4},{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":8,"ScKXlWON":11,"sB0E_NRW":71,"body":46,"_meta":115,"_filter":121,"id":58},"column19","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a9d40853-ca3b-461f-ab01-2b58d964e2b0.png","Vol.2 すべての始まりは、ネイルの施術から",{"id":9,"title":10},"skaeleJ7","プロダクト",{"slug":12,"cover":13,"title":14,"OkocjktT":15,"S2EU8djY":16,"ScKXlWON":17,"sB0E_NRW":44,"body":59,"_meta":60,"_filter":67,"id":70},"column18","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_9f494d39-862b-424b-a088-d01781b50e0b.png","なぜ、私たちは商品を作るのか　Vol.1 ネイルケアとスキンケア、その原点","なぜ、私たちは商品を作るのか\u003Cbr>Vol.1 ネイルケアとスキンケア、その原点",{"id":9,"title":10},{"slug":18,"cover":19,"title":20,"OkocjktT":21,"S2EU8djY":22,"body":25,"_meta":26,"_filter":39,"id":43},"column17","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_daf9d8b1-33bf-46b2-a750-6122af3a9feb.png","ネイルカラーを塗ってこそ、ネイルケアは仕上がる ","ネイルカラーを塗ってこそ、ネイルケアは仕上がる",{"id":23,"title":24},"iQIXcYlc","ロングルアージュ","\u003Cp data-uid=\"GvGYpeQ5\" data-time=\"1770884181722\">ロングルアージュのネイルケアは、丁寧に整えた爪にネイルカラーをのせることで完成します。\u003C\u002Fp>\u003Cp data-uid=\"6hKsoXJT\" data-time=\"1770884185014\">\u003C\u002Fp>\u003Cp data-uid=\"TGu3FYw3\" data-time=\"1770884346338\">ベースコート、ネイルカラーを2度塗り、トップコート\u003Cstrong>。\u003C\u002Fstrong>そして、\u003Cstrong>3日に一度トップコートを重ねること。\u003C\u002Fstrong>\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"5gOzYA4F\" data-time=\"1770884397256\">ネイルカラーをまとうことで、爪にはほどよい厚みと安定感が生まれます。私たちが理想とするのは、なめらかなカーブを描く、しなやかな爪。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"qTTQR683\" data-time=\"1770884427291\">カラーを含めた4層のコーティングは、爪を補強し、日常の小さな衝撃から守る役割も果たしてくれます。\u003C\u002Fp>\u003Chr data-uid=\"hIRI_L2j\" data-time=\"1770884819819\">\u003Cp data-uid=\"440sRFYK\" data-time=\"1770884452886\">そして、もうひとつの楽しみが\u003Cstrong>「色を選ぶ時間」\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"ENw_2r0j\" data-time=\"1770884471839\">サロンの棚に並ぶ、数えきれないほどのネイルカラー。眺めているだけで、心がふっと弾む瞬間です。\u003C\u002Fp>\u003Cp data-uid=\"SQiUGpIO\" data-time=\"1770884477648\">\u003C\u002Fp>\u003Cp data-uid=\"LaCcSlaO\" data-time=\"1770884540971\">日常のカラー選びで大切にしているのは、ベージュや淡いピンクなど、肌になじむ色を選ぶこと。\u003C\u002Fp>\u003Cp data-uid=\"DJnQTVFu\" data-time=\"1770884528748\">ロングルアージュでは、\u003Cstrong>爪は主張しすぎないほうが、手全体がきれいに見える\u003C\u002Fstrong>と考えています。\u003C\u002Fp>\u003Cp data-uid=\"0Xj_2mRc\" data-time=\"1770883896411\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"iH1b54LJ\" data-time=\"1770884592260\">一見すると、何も塗っていないようで、近くで見ると、きちんと整えられた指先にさりげなくツヤと色が宿っている。\u003C\u002Fp>\u003Cp data-uid=\"U4g6rK2N\" data-time=\"1770884632019\">その\u003Cstrong>さりげなさと清潔感\u003C\u002Fstrong>こそが、大人の手元をいちばん美しく魅せてくれるのだと思っています。\u003C\u002Fp>\u003Chr data-uid=\"9oGbevQU\" data-time=\"1770884629713\">\u003Cp data-uid=\"fusCrO9w\" data-time=\"1770884725831\">サロンでは、マニキュアリストがお好みやライフスタイルを伺いながら、実際に試し塗りをして色を決めていきます。\u003C\u002Fp>\u003Cp data-uid=\"UmX7psua\" data-time=\"1770883896411\">ボトルで見たときは理想的でも、爪にのせると印象が変わったり、肌が暗く見えることも。\u003C\u002Fp>\u003Cp data-uid=\"dFtfrv87\" data-time=\"1770884753215\">反対に、「これは意外」と思った色が、驚くほど自然になじむこともあります。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"MDSa4fDi\" data-time=\"1770884757379\">ぜひロングルアージュで、\u003C\u002Fp>\u003Cp data-uid=\"qmO8snVx\" data-time=\"1770884819819\">\u003Cstrong>長く付き合える定番の一本\u003C\u002Fstrong>を見つけてみてください。\u003C\u002Fp>",{"project":27,"publishedAt":29,"createdAt":30,"order":31,"publishType":32,"schema":33,"uid":37,"updatedAt":38},{"id":28},"xhNigFsLJyPJZwwHDZ5N",["Date","2026-02-12T08:32:16.000Z"],["Date","2026-02-12T08:11:18.000Z"],-1,"change",{"id":34,"key":35,"postType":36},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","LinvCeG7",["Date","2026-05-20T07:36:15.000Z"],[40,41,42],"S2EU8djY:iQIXcYlc","ScKXlWON:L_W7Okje","sB0E_NRW:zdyVNTZ3","xnar9rt68Fjjpwlga0Ew",{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":45,"body":46,"_meta":47,"_filter":54,"id":58},{"id":9,"title":10},"\u003Cp data-uid=\"djnP4H8Y\" data-time=\"1779261901582\">ロングルアージュは、日々のサロンワークの中で、数えきれないほどのお客様の手に触れてきました。\u003C\u002Fp>\u003Cp data-uid=\"3dxgaIyP\" data-time=\"1779262023380\">ネイル施術に欠かせない工程のひとつが、\u003Cstrong>手指消毒\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"rHQz4S3p\" data-time=\"1779261912939\">\u003C\u002Fp>\u003Cp data-uid=\"4oKp46Jg\" data-time=\"1779262225995\">衛生を守るために必要不可欠なもの。けれど同時に、アルコールによる刺激や乾燥に悩まれるお客様、そして、日に何度も手指消毒を繰り返すスタッフの手荒れも、長年見過ごせない課題としてありました。\u003C\u002Fp>\u003Cp data-uid=\"Tp4sRZOD\" data-time=\"1779262246872\">「肌が弱い方にも、もっとやさしい方法はないだろうか」「清潔を保ちながら、うるおいを守ることはできないだろうか」\u003C\u002Fp>\u003Cp data-uid=\"mwCM8O9A\" data-time=\"1779262017476\">その問いから探し始めたのが、\u003Cstrong>“肌のための水\u003C\u002Fstrong>”でした。\u003C\u002Fp>\u003Cp data-uid=\"UUIbeCLR\" data-time=\"1779262014387\">\u003C\u002Fp>\u003Cp data-uid=\"SYzKrgAY\" data-time=\"1779262093987\">さらりとして、べたつかないこと。\u003C\u002Fp>\u003Cp data-uid=\"8qN0xN2e\" data-time=\"1779262119012\">施術の邪魔にならず、毎日心地よく使えること。\u003C\u002Fp>\u003Cp data-uid=\"HHYcrSDq\" data-time=\"1779262141726\">そして、乾燥しやすい手肌に、やさしく寄り添えること。\u003C\u002Fp>\u003Cp data-uid=\"iv_8gEZt\" data-time=\"1779262144754\">\u003C\u002Fp>\u003Cp data-uid=\"WLe689xm\" data-time=\"1779262285232\">ネイルケアを真剣に考え続ける中で、自然とたどり着いたのが、\u003Cstrong>スキンケア\u003C\u002Fstrong>という存在でした。\u003C\u002Fp>\u003Cp data-uid=\"IpzltWU8\" data-time=\"1779262290005\">こうして生まれたのが、プロトンイオン水をベースにした、\u003Cstrong>ロングルアージュの化粧水\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":48,"publishedAt":49,"createdAt":50,"order":31,"publishType":32,"schema":51,"uid":52,"updatedAt":53},{"id":28},["Date","2026-06-05T01:00:00.000Z"],["Date","2026-05-20T07:22:56.000Z"],{"id":34,"key":35,"postType":36},"_b6L6F13",["Date","2026-06-25T06:22:51.000Z"],[55,56,57],"ScKXlWON:zdyVNTZ3","S2EU8djY:skaeleJ7","sB0E_NRW:iLFHIDmy","4SVDfRuOn5v7G1rWvNza","\u003Cp data-uid=\"Z4HLZbSA\" data-time=\"1778832462660\">ネイルケアは、おしゃれのためだけのものだと思われがちです。\u003C\u002Fp>\u003Cp data-uid=\"UvSlrIds\" data-time=\"1778832462660\">けれどロングルアージュが考えるネイルケアは、もっと日常に近いもの。\u003C\u002Fp>\u003Cp data-uid=\"vNDk1GRI\" data-time=\"1778832493762\">身だしなみの一部でありながら、ふとした瞬間に、自分に少しの自信や余裕を与えてくれるものだと考えています。\u003C\u002Fp>\u003Cp data-uid=\"5ml7evQL\" data-time=\"1778832496915\">\u003C\u002Fp>\u003Cp data-uid=\"9tzZ75DE\" data-time=\"1778832496142\">私たちは、ネイルケアをしていない爪に、色を塗ることはありません。\u003C\u002Fp>\u003Cp data-uid=\"5NRAu0Pc\" data-time=\"1778832514784\">どんな色もどんなデザインも、土台が整っていてこそ、美しく、心地よく楽しめる。\u003C\u002Fp>\u003Cp data-uid=\"_ut9eNZ5\" data-time=\"1778831233104\">それが、長く爪と向き合ってきた私たちの結論です。\u003C\u002Fp>\u003Cp data-uid=\"aQj3B3q0\" data-time=\"1778832524896\">\u003C\u002Fp>\u003Cp data-uid=\"3S7YVkoN\" data-time=\"1778832535002\">そしてこの\u003Cstrong>「土台を整える」\u003C\u002Fstrong>という考え方は、ネイルケアだけでなく、スキンケアにも共通するものでした。\u003C\u002Fp>",{"project":61,"publishedAt":62,"createdAt":63,"order":31,"publishType":32,"schema":64,"uid":65,"updatedAt":66},{"id":28},["Date","2026-05-15T08:10:48.000Z"],["Date","2026-05-15T07:47:13.000Z"],{"id":34,"key":35,"postType":36},"zdyVNTZ3",["Date","2026-05-29T07:21:28.000Z"],[56,68,69],"ScKXlWON:LinvCeG7","sB0E_NRW:_b6L6F13","b1RxrxFdcOILKT1887i1",{"slug":72,"cover":73,"title":74,"OkocjktT":75,"S2EU8djY":76,"ScKXlWON":77,"sB0E_NRW":86,"body":103,"_meta":104,"_filter":111,"id":114},"column20","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_9c28e2b4-752c-400d-811e-bda10605e562.png","Vol.3 ネイルサロンだからこそ生まれた、スキンケア ","Vol.3 ネイルサロンだからこそ生まれた、スキンケア",{"id":9,"title":10},{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":78,"body":46,"_meta":79,"_filter":85,"id":58},{"id":9,"title":10},{"project":80,"publishedAt":81,"createdAt":82,"order":31,"publishType":32,"schema":83,"uid":52,"updatedAt":84},{"id":28},["Date","2026-06-05T01:00:00.000Z"],["Date","2026-05-20T07:22:56.000Z"],{"id":34,"key":35,"postType":36},["Date","2026-06-25T06:22:51.000Z"],[55,56,57],{"slug":87,"cover":88,"title":89,"OkocjktT":89,"S2EU8djY":90,"body":91,"_meta":92,"_filter":99,"id":102},"column21","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_eef9ef6d-e3b5-4386-bca8-ac6ed6d1bd25.png","Vol.4 爪も、肌も、「主役」はその人自身",{"id":9,"title":10},"\u003Cp data-uid=\"eHGkeZqi\" data-time=\"1784096603662\">薄い爪、割れやすい爪。乾燥、ささくれ。\u003C\u002Fp>\u003Cp data-uid=\"mWovjmRp\" data-time=\"1780040280943\">多くの方が、手元や肌に何かしらの悩みを抱えています。\u003C\u002Fp>\u003Cp data-uid=\"3PY0blt2\" data-time=\"1784096618106\">けれどロングルアージュが目指しているのは、悩みを隠すことでも、飾り立てることでもありません。\u003C\u002Fp>\u003Cp data-uid=\"1K53fbo5\" data-time=\"1780039978437\">\u003C\u002Fp>\u003Cp data-uid=\"XOUeGGbP\" data-time=\"1780040188111\">私たちが大切にしているのは、「\u003Cstrong>爪は、あくまで脇役。主役は、その人自身である。」\u003C\u002Fstrong>という考え方です。\u003C\u002Fp>\u003Cp data-uid=\"rkLAfbOS\" data-time=\"1780039960118\">\u003C\u002Fp>\u003Cp data-uid=\"pK8Cf7bs\" data-time=\"1780040206161\">だからこそ、目立たせることよりも、清潔感やその人らしい自然な美しさを大切にしてきました。それはネイルケアだけでなく、スキンケアにも共通する価値観です。\u003C\u002Fp>\u003Cp data-uid=\"uIqMy5EW\" data-time=\"1784096699080\">強い変化を与えることよりも、肌や爪が本来持つ力を妨げず、健やかな状態を支えること。\u003C\u002Fp>\u003Cp data-uid=\"XgoyURxG\" data-time=\"1780040072564\">\u003C\u002Fp>\u003Cp data-uid=\"2DVefVnY\" data-time=\"1784096677535\">爪も、肌も。\u003C\u002Fp>\u003Cp data-uid=\"qV7NrsX3\" data-time=\"1784096686588\">何かを足した状態ではなく、\u003Cstrong>整っていることそのものが美しい。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"CH2Q3eyh\" data-time=\"1780040113691\">私たちは、そう考えています。\u003C\u002Fp>",{"project":93,"publishedAt":94,"createdAt":95,"order":31,"publishType":32,"schema":96,"uid":97,"updatedAt":98},{"id":28},["Date","2026-07-16T15:00:00.000Z"],["Date","2026-05-29T07:30:35.000Z"],{"id":34,"key":35,"postType":36},"WiGiFnC8",["Date","2026-08-14T02:07:10.000Z"],[56,100,101],"ScKXlWON:iLFHIDmy","sB0E_NRW:g3_cDfG5","1InBGfJmA6KU0YExDAqh","\u003Cp data-uid=\"R0BV1pA9\" data-time=\"1779263072330\">化粧水は、顔のためだけのものではありません。\u003C\u002Fp>\u003Cp data-uid=\"waRtiGLg\" data-time=\"1779263877536\">手指、腕、ボディ。ネイルサロンは、誰よりも「肌」に触れる場所です。\u003C\u002Fp>\u003Cp data-uid=\"KFxPo4EE\" data-time=\"1779263244808\">施術中、私たちは常に乾燥した手肌や、敏感に揺らぎやすい肌と向き合ってきました。\u003C\u002Fp>\u003Cp data-uid=\"9G7N_tNX\" data-time=\"1779263891857\">\u003C\u002Fp>\u003Cp data-uid=\"yG_Il_KJ\" data-time=\"1779263938952\">だからこそ求めたのは、さらりと水のように\u003Cstrong>軽やかで、べたつかない\u003C\u002Fstrong>こと。\u003C\u002Fp>\u003Cp data-uid=\"JiunAwrv\" data-time=\"1779263933522\">施術の邪魔にならず、\u003Cstrong>毎日心地よく\u003C\u002Fstrong>使えること。\u003C\u002Fp>\u003Cp data-uid=\"lVaHIryE\" data-time=\"1779263930943\">そして、華やかさよりも\u003Cstrong>安心して使い続けられる\u003C\u002Fstrong>ことでした。\u003C\u002Fp>\u003Cp data-uid=\"vUc_2S6f\" data-time=\"1779263310250\">\u003C\u002Fp>\u003Cp data-uid=\"WeqNvgtL\" data-time=\"1779263340307\">肌に必要なものだけを、まっすぐ届ける。\u003C\u002Fp>\u003Cp data-uid=\"XqUa6Ex1\" data-time=\"1779263964975\">その考えをを突き詰めた結果、ロングルアージュのスキンケアは、極めて\u003Cstrong>シンプルな処方\u003C\u002Fstrong>に行き着きました。\u003C\u002Fp>\u003Cp data-uid=\"qAtzDyTU\" data-time=\"1779263951882\">このスキンケアは、「ネイルサロンが化粧水を作った」のではなく、\u003Cstrong>ネイルケアを真剣に考え続けた結果、自然と必要になったもの\u003C\u002Fstrong>だったのです。\u003C\u002Fp>",{"project":105,"publishedAt":106,"createdAt":107,"order":31,"publishType":32,"schema":108,"uid":109,"updatedAt":110},{"id":28},["Date","2026-06-26T01:00:00.000Z"],["Date","2026-05-20T07:43:20.000Z"],{"id":34,"key":35,"postType":36},"iLFHIDmy",["Date","2026-07-15T06:48:30.000Z"],[56,112,113],"ScKXlWON:_b6L6F13","sB0E_NRW:WiGiFnC8","MvbD7a5n0NCDfVcnqehW",{"project":116,"publishedAt":117,"createdAt":118,"order":31,"publishType":32,"schema":119,"uid":52,"updatedAt":120},{"id":28},["Date","2026-06-05T01:00:00.000Z"],["Date","2026-05-20T07:22:56.000Z"],{"id":34,"key":35,"postType":36},["Date","2026-06-25T06:22:51.000Z"],[55,56,57],["Reactive",123],{},["Set"],["ShallowReactive",126],{"dynamicDatacolumn\u002Fposts\u002Fcolumn19":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn19",["Reactive",130],{"cmsContentStore":131,"projectStore":135,"productStore":156,"pageHeadStore":699,"cmsStore":703,"useSnackBarStore":711},{"listContentsMap":132,"contentMap":133},["Map"],["Map",134,4],"SLmv5Xy5\u002Fcolumn19",{"siteHost":136,"customProxyDomain":137,"project":138},"longleage.co.jp","",{"id":139,"name":24,"customDomain":137,"iconImage":137,"coverImage":140,"displayBadge":141,"integrations":142,"snapshot_path":154,"snapshot_id":155,"recaptchaSiteKey":-1,"conversionEvents":-1},"xPORdZvpar","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F0f5840fe-8094-40fc-9ebe-de2bc0684702",false,[143,146,148,151],{"integration_name":144,"code":145},"custom-code","true",{"integration_name":147,"code":137},"google-analytics",{"integration_name":149,"code":150},"google-tag-manager","GTM-N9Q3BWHZ",{"integration_name":152,"code":153},"search-console","NsumBMx5xUst03kk1dvnTIb55odGQA_RpkV5BWfMX2g","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-publish\u002Fprojects\u002FxPORdZvpar\u002F3qb3zNXNaJ\u002F","3qb3zNXNaJ",{"product":157
