">ロングルアージュの考える「美しい爪」。 \u003Cbr>それは長さやデザインではなく、自爪そのものが健康な状態にあることです。\u003C\u002Fh1>\u003Cp data-uid=\"mtJM8sSd\" data-time=\"1740656563460\">最適な周期、ロングルアージュスタイルで爪の長さを整え、甘皮や爪表面のお手入れをする。そのうえで毎日、爪の根元に栄養補給と保湿のためのものを塗る。\u003C\u002Fp>\u003Cp data-uid=\"dJdxDog1\" data-time=\"1740238578066\">この、正しいネイルケアを続けることによって、「爪の質」が上がり、健康で美しい爪に生まれ変わります。\u003C\u002Fp>\u003Cp data-uid=\"gCsF6HYb\" data-time=\"1740238356650\">私たちは飾ることよりも、土台の自爪をまず健康な状態に導くこと。\u003Cbr>自分本来の美しさを引き出すことを大切にしています。\u003C\u002Fp>\u003Cp data-uid=\"mCuCMpqR\" data-time=\"1740658006359\">指先に意識を向ければ、おのずと仕草にも磨きがかかります。 \u003Cbr>指先ひとつにその人の「品格」が宿るように思っています。\u003C\u002Fp>",{"project":24,"publishedAt":26,"createdAt":27,"order":28,"publishType":29,"schema":30,"uid":34,"updatedAt":35},{"id":25},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-03-04T15:05:00.000Z"],["Date","2025-02-16T06:13:49.000Z"],2,"change",{"id":31,"key":32,"postType":33},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","WyIwpQHW",["Date","2025-03-04T15:18:25.000Z"],[37,38],"S2EU8djY:hm0DQq4I","sB0E_NRW:albNgbIj","HfjnYXwqvlxJZkjIVbiF",{"slug":41,"cover":42,"title":43,"OkocjktT":44,"S2EU8djY":45,"body":46,"_meta":47,"_filter":55,"id":59},"column_03","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1360x1360_98dab5a5-b705-4b69-b340-52c6d882c0d9.webp","ロングルアージュが大切にする「ラウンドスクエア」「キューティクルケア」の話","ロングルアージュが大切にする\u003Cbr>「ラウンドスクエア」「キューティクルケア」の話",{"id":18,"title":19},"\u003Ch2 data-uid=\"mSy4OZTo\" data-time=\"1740663451220\" id=\"index_mSy4OZTo\">ネイルケアといっても爪の整え方には様々なスタイルがあります。\u003C\u002Fh2>\u003Cp data-uid=\"ynUedhwW\" data-time=\"1740663563134\">爪の形は\u003Cstrong>「ラウンドスクエア」\u003C\u002Fstrong>というロングルアージュだけの形をお客様に提案し続けてきました。 これは角の取れた長方形のような形で、この形状に爪を整え続けることで、いつしか爪がアーチを描き、 立体的で美しい状態になっていきます。\u003C\u002Fp>\u003Ch2 data-uid=\"bbNVhx6g\" data-time=\"1740663688344\" id=\"index_bbNVhx6g\">そして、健康で美しい爪に育てるうえで欠かせないもの、それは\u003Cstrong>「キューティクル（甘皮）ケア」\u003C\u002Fstrong>です。\u003C\u002Fh2>\u003Cp data-uid=\"cYGwynij\" data-time=\"1740237372923\">週に一度のペースで甘皮を押し上げて、爪から離してあげることを大切にしています。 ささくれが防げるだけでなく、爪をつくる爪母へ栄養成分や保湿成分が浸透しやすくなります。\u003C\u002Fp>\u003Ch3 data-uid=\"hrtEBEJH\" data-time=\"1740665179049\" id=\"index_hrtEBEJH\">ラウンドスクエアに整え続けることでプロポーションの良い強くてしなやかな自爪を手に入れ、 甘皮のお手入れをすることで爪の質が上がり、「健康で美しい爪」が完成します。\u003C\u002Fh3>",{"project":48,"publishedAt":49,"createdAt":50,"order":51,"publishType":29,"schema":52,"uid":53,"updatedAt":54},{"id":25},["Date","2025-03-04T15:15:00.000Z"],["Date","2025-02-22T15:15:05.000Z"],1,{"id":31,"key":32,"postType":33},"OhHjKylG",["Date","2025-03-31T09:15:31.000Z"],[56,57,58],"S2EU8djY:eixet5FE","ScKXlWON:albNgbIj","sB0E_NRW:_IMDqL0M","dEzn3fJO9csWGNpNOrDp","\u003Ch2 data-uid=\"4K89i2Rj\" data-time=\"1740664728817\" id=\"index_4K89i2Rj\">爪は1日に幾度となく自分の視野に入るものです。\u003C\u002Fh2>\u003Cp data-uid=\"4Rl870js\" data-time=\"1739964508403\">このとき、爪がきちんと手入れされていれば、自分自身の心も満たされた気分になります。しかし、ささくれができていたり、乾燥が目立つ状態であれば、どこか気持ちも後ろ向きになりがちなもの。\u003C\u002Fp>\u003Ch2 data-uid=\"AcDRWeiX\" data-time=\"1740663860392\" id=\"index_AcDRWeiX\">見た目だけでなく、心の状態までも左右する。爪にはそんな力があります。\u003C\u002Fh2>\u003Cp data-uid=\"S2RzufzO\" data-time=\"1740663867336\">ロングルアージュが提案する美しい爪は、 指を長く見せ、折れにくくする形「ラウンドスクエア」と 甘皮を整え、爪の育成を促す「キューティクルケア」によって作ることができます。\u003C\u002Fp>\u003Cp data-uid=\"4PvSkdmZ\" data-time=\"1739965375652\">時間をかけて丁寧に手入れすることで、誰でも爪の形やカーブは美しく変えられ、きれいな手元を作ることができます。&nbsp;\u003C\u002Fp>",{"project":62,"publishedAt":63,"createdAt":64,"order":65,"publishType":29,"schema":66,"uid":67,"updatedAt":68},{"id":25},["Date","2025-03-04T15:10:00.000Z"],["Date","2025-01-25T13:09:06.000Z"],-1,{"id":31,"key":32,"postType":33},"albNgbIj",["Date","2025-03-04T15:19:02.000Z"],[56,70,71],"sB0E_NRW:OhHjKylG","ScKXlWON:WyIwpQHW","9kkVNH61zc1duNTVHrvT",{"project":74,"publishedAt":75,"createdAt":76,"order":28,"publishType":29,"schema":77,"uid":34,"updatedAt":78},{"id":25},["Date","2025-03-04T15:05:00.000Z"],["Date","2025-02-16T06:13:49.000Z"],{"id":31,"key":32,"postType":33},["Date","2025-03-04T15:18:25.000Z"],[37,38],["Reactive",81],{},["Set"],["Shall
