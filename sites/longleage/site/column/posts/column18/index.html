":40,"id":44},"column16","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_103d36ee-69ad-402e-81a2-d556f084dc80.png","ロングルアージュといえば、ネイルケア","ロングルアージュといえば、ネイルケア。",{"id":18,"title":19},"\u003Cp data-uid=\"pue95c51\" data-time=\"1767754539500\">ネイルケアをすると、何が変わるのでしょうか。色がつくことでも、飾りが増えることでもありません。\u003C\u002Fp>\u003Cp data-uid=\"poVO2zTH\" data-time=\"1767755089705\">\u003C\u002Fp>\u003Cp data-uid=\"CSmLTyB1\" data-time=\"1767755070201\">ふと手元を見たとき、\u003Cstrong>「きれいだな」と静かに思えること。\u003C\u002Fstrong>誰かと名刺を交わす、人と向き合うその一瞬に、\u003Cstrong>自然と自信をもって差し出せること。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"6x2tBq1L\" data-time=\"1767755070201\">ネイルケアは、\u003Cstrong>清潔感や信頼感を、言葉にせずに伝えてくれるもの\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"45eZkHfA\" data-time=\"1767754796464\">\u003C\u002Fp>\u003Cp data-uid=\"5Ovz_HlD\" data-time=\"1767754858322\">ロングルアージュは創業以来、「自爪を整えること」を大切にしてきました。流行が変わり、ネイルの選択肢が増えた今も、その考えは変わりません。\u003C\u002Fp>\u003Cp data-uid=\"ly2KROGU\" data-time=\"1767754887458\">ジェルネイルを楽しむ人もいれば、マニキュアを選ぶ人、何もしないという選択をする人もいます。\u003Cstrong>どれも、間違いではありません。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"xeVpsZpm\" data-time=\"1767754161896\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wzovwaPX\" data-time=\"1767754890718\">けれど、どの選択の先にもあるのは\u003Cstrong>「自爪」\u003C\u002Fstrong>。土台が整っているからこそ、ネイルは美しく映り、長く楽しむことができます。\u003C\u002Fp>\u003Cp data-uid=\"B_UKHzx3\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"NYjGjIU9\" data-time=\"1767754894728\">ネイルケアは、誰かに見せるためだけのものではありません。流されず、自分の基準で美しさを選ぶということ。\u003C\u002Fp>\u003Cp data-uid=\"sc3qndyw\" data-time=\"1767754980314\">派手でなくてもいい。目立たなくてもいい。けれど、\u003Cstrong>手元に自信があるという感覚は、日常のふるまいに、確かに現れます。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"rYxTGIj3\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"vb9FC3Dc\" data-time=\"1767754496851\">ロングルアージュが目指しているのは、\u003Cstrong>「ネイルをする人」\u003C\u002Fstrong>ではなく、\u003Cstrong>「ネイルケアを知っている人」\u003C\u002Fstrong>を増やすこと。\u003C\u002Fp>\u003Cp data-uid=\"7jOow6lr\" data-time=\"1767754502538\">それは、年齢や立場を問わず、\u003Cstrong>すべての人にとって必要な美しさ\u003C\u002Fstrong>だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"51tYUBZ4\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"NmGJnbbW\" data-time=\"1767754996062\">\u003Cstrong>2026年。\u003C\u002Fstrong>ロングルアージュは、あらためてここに立ち返ります。\u003C\u002Fp>\u003Cp data-uid=\"bHB7XzrX\" data-time=\"1767754161897\">ロングルアージュといえば、ネイルケア。\u003C\u002Fp>\u003Cp data-uid=\"lLeG3zVN\" data-time=\"1767755001393\">それは、\u003Cstrong>飾る前に整える\u003C\u002Fstrong>ということ。\u003Cstrong>自分を大切にする姿勢を、指先から伝える\u003C\u002Fstrong>ということ。\u003C\u002Fp>\u003Cp data-uid=\"zvlo3nvm\" data-time=\"1767754161897\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"4DVyilkK\" data-time=\"1767755005917\">私たちはこれからも、ネイルケアの価値を、丁寧に、まっすぐに伝えていきます。\u003C\u002Fp>",{"project":28,"publishedAt":30,"createdAt":31,"order":32,"publishType":33,"schema":34,"uid":38,"updatedAt":39},{"id":29},"xhNigFsLJyPJZwwHDZ5N",["Date","2026-01-07T03:07:17.000Z"],["Date","2026-01-07T02:49:11.000Z"],-1,"change",{"id":35,"key":36,"postType":37},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","L_W7Okje",["Date","2026-02-12T08:34:20.000Z"],[41,42,43],"S2EU8djY:iQIXcYlc","ScKXlWON:1PC4AdM5","sB0E_NRW:LinvCeG7","dgZ9fGyIYS4xlddxdkpe",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":46,"body":47,"_meta":48,"_filter":55,"id":59},{"id":10,"title":11},"\u003Cp data-uid=\"Z4HLZbSA\" data-time=\"1778832462660\">ネイルケアは、おしゃれのためだけのものだと思われがちです。\u003C\u002Fp>\u003Cp data-uid=\"UvSlrIds\" data-time=\"1778832462660\">けれどロングルアージュが考えるネイルケアは、もっと日常に近いもの。\u003C\u002Fp>\u003Cp data-uid=\"vNDk1GRI\" data-time=\"1778832493762\">身だしなみの一部でありながら、ふとした瞬間に、自分に少しの自信や余裕を与えてくれるものだと考えています。\u003C\u002Fp>\u003Cp data-uid=\"5ml7evQL\" data-time=\"1778832496915\">\u003C\u002Fp>\u003Cp data-uid=\"9tzZ75DE\" data-time=\"1778832496142\">私たちは、ネイルケアをしていない爪に、色を塗ることはありません。\u003C\u002Fp>\u003Cp data-uid=\"5NRAu0Pc\" data-time=\"1778832514784\">どんな色もどんなデザインも、土台が整っていてこそ、美しく、心地よく楽しめる。\u003C\u002Fp>\u003Cp data-uid=\"_ut9eNZ5\" data-time=\"1778831233104\">それが、長く爪と向き合ってきた私たちの結論です。\u003C\u002Fp>\u003Cp data-uid=\"aQj3B3q0\" data-time=\"1778832524896\">\u003C\u002Fp>\u003Cp data-uid=\"3S7YVkoN\" data-time=\"1778832535002\">そしてこの\u003Cstrong>「土台を整える」\u003C\u002Fstrong>という考え方は、ネイルケアだけでなく、スキンケアにも共通するものでした。\u003C\u002Fp>",{"project":49,"publishedAt":50,"createdAt":51,"order":32,"publishType":33,"schema":52,"uid":53,"updatedAt":54},{"id":29},["Date","2026-05-15T08:10:48.000Z"],["Date","2026-05-15T07:47:13.000Z"],{"id":35,"key":36,"postType":37},"zdyVNTZ3",["Date","2026-05-29T07:21:28.000Z"],[56,57,58],"S2EU8djY:skaeleJ7","ScKXlWON:LinvCeG7","sB0E_NRW:_b6L6F13","b1RxrxFdcOILKT1887i1","\u003Cp data-uid=\"GvGYpeQ5\" data-time=\"1770884181722\">ロングルアージュのネイルケアは、丁寧に整えた爪にネイルカラーをのせることで完成します。\u003C\u002Fp>\u003Cp data-uid=\"6hKsoXJT\" data-time=\"1770884185014\">\u003C\u002Fp>\u003Cp data-uid=\"TGu3FYw3\" data-time=\"1770884346338\">ベースコート、ネイルカラーを2度塗り、トップコート\u003Cstrong>。\u003C\u002Fstrong>そして、\u003Cstrong>3日に一度トップコートを重ねること。\u003C\u002Fstrong>\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"5gOzYA4F\" data-time=\"1770884397256\">ネイルカラーをまとうことで、爪にはほどよい厚みと安定感が生まれます。私たちが理想とするのは、なめらかなカーブを描く、しなやかな爪。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"qTTQR683\" data-time=\"1770884427291\">カラーを含めた4層のコーティングは、爪を補強し、日常の小さな衝撃から守る役割も果たしてくれます。\u003C\u002Fp>\u003Chr data-uid=\"hIRI_L2j\" data-time=\"1770884819819\">\u003Cp data-uid=\"440sRFYK\" data-time=\"1770884452886\">そして、もうひとつの楽しみが\u003Cstrong>「色を選ぶ時間」\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"ENw_2r0j\" data-time=\"1770884471839\">サロンの棚に並ぶ、数えきれないほどのネイルカラー。眺めているだけで、心がふっと弾む瞬間です。\u003C\u002Fp>\u003Cp data-uid=\"SQiUGpIO\" data-time=\"1770884477648\">\u003C\u002Fp>\u003Cp data-uid=\"LaCcSlaO\" data-time=\"1770884540971\">日常のカラー選びで大切にしているのは、ベージュや淡いピンクなど、肌になじむ色を選ぶこと。\u003C\u002Fp>\u003Cp data-uid=\"DJnQTVFu\" data-time=\"1770884528748\">ロングルアージュでは、\u003Cstrong>爪は主張しすぎないほうが、手全体がきれいに見える\u003C\u002Fstrong>と考えています。\u003C\u002Fp>\u003Cp data-uid=\"0Xj_2mRc\" data-time=\"1770883896411\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"iH1b54LJ\" data-time=\"1770884592260\">一見すると、何も塗っていないようで、近くで見ると、きちんと整えられた指先にさりげなくツヤと色が宿っている。\u003C\u002Fp>\u003Cp data-uid=\"U4g6rK2N\" data-time=\"1770884632019\">その\u003Cstrong>さりげなさと清潔感\u003C\u002Fstrong>こそが、大人の手元をいちばん美しく魅せてくれるのだと思っています。\u003C\u002Fp>\u003Chr data-uid=\"9oGbevQU\" data-time=\"1770884629713\">\u003Cp data-uid=\"fusCrO9w\" data-time=\"1770884725831\">サロンでは、マニキュアリストがお好みやライフスタイルを伺いながら、実際に試し塗りをして色を決めていきます。\u003C\u002Fp>\u003Cp data-uid=\"UmX7psua\" data-time=\"1770883896411\">ボトルで見たときは理想的でも、爪にのせると印象が変わったり、肌が暗く見えることも。\u003C\u002Fp>\u003Cp data-uid=\"dFtfrv87\" data-time=\"1770884753215\">反対に、「これは意外」と思った色が、驚くほど自然になじむこともあります。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"MDSa4fDi\" data-time=\"1770884757379\">ぜひロングルアージュで、\u003C\u002Fp>\u003Cp data-uid=\"qmO8snVx\" data-time=\"1770884819819\">\u003Cstrong>長く付き合える定番の一本\u003C\u002Fstrong>を見つけてみてください。\u003C\u002Fp>",{"project":62,"publishedAt":63,"createdAt":64,"order":32,"publishType":33,"schema":65,"uid":66,"updatedAt":67},{"id":29},["Date","2026-02-12T08:32:16.000Z"],["Date","2026-02-12T08:11:18.000Z"],{"id":35,"key":36,"postType":37},"LinvCeG7",["Date","2026-05-20T07:36:15.000Z"],[41,69,70],"ScKXlWON:L_W7Okje","sB0E_NRW:zdyVNTZ3","xnar9rt68Fjjpwlga0Ew",{"slug":73,"cover":74,"title":75,"OkocjktT":75,"S2EU8djY":76,"ScKXlWON":77,"sB0E_NRW":86,"body":104,"_meta":105,"_filter":112,"id":115},"column19","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a9d40853-ca3b-461f-ab01-2b58d964e2b0.png","Vol.2 すべての始まりは、ネイルの施術から",{"id":10,"title":11},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":78,"body":47,"_meta":79,"_filter":85,"id":59},{"id":10,"title":11},{"project":80,"publishedAt":81,"createdAt":82,"order":32,"publishType":33,"schema":83,"uid":53,"updatedAt":84},{"id":29},["Date","2026-05-15T08:10:48.000Z"],["Date","2026-05-15T07:47:13.000Z"],{"id":35,"key":36,"postType":37},["Date","2026-05-29T07:21:28.000Z"],[56,57,58],{"slug":87,"cover":88,"title":89,"OkocjktT":90,"S2EU8djY":91,"body":92,"_meta":93,"_filter":100,"id":103},"column20","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_9c28e2b4-752c-400d-811e-bda10605e562.png","Vol.3 ネイルサロンだからこそ生まれた、スキンケア ","Vol.3 ネイルサロンだからこそ生まれた、スキンケア",{"id":10,"title":11},"\u003Cp data-uid=\"R0BV1pA9\" data-time=\"1779263072330\">化粧水は、顔のためだけのものではありません。\u003C\u002Fp>\u003Cp data-uid=\"waRtiGLg\" data-time=\"1779263877536\">手指、腕、ボディ。ネイルサロンは、誰よりも「肌」に触れる場所です。\u003C\u002Fp>\u003Cp data-uid=\"KFxPo4EE\" data-time=\"1779263244808\">施術中、私たちは常に乾燥した手肌や、敏感に揺らぎやすい肌と向き合ってきました。\u003C\u002Fp>\u003Cp data-uid=\"9G7N_tNX\" data-time=\"1779263891857\">\u003C\u002Fp>\u003Cp data-uid=\"yG_Il_KJ\" data-time=\"1779263938952\">だからこそ求めたのは、さらりと水のように\u003Cstrong>軽やかで、べたつかない\u003C\u002Fstrong>こと。\u003C\u002Fp>\u003Cp data-uid=\"JiunAwrv\" data-time=\"1779263933522\">施術の邪魔にならず、\u003Cstrong>毎日心地よく\u003C\u002Fstrong>使えること。\u003C\u002Fp>\u003Cp data-uid=\"lVaHIryE\" data-time=\"1779263930943\">そして、華やかさよりも\u003Cstrong>安心して使い続けられる\u003C\u002Fstrong>ことでした。\u003C\u002Fp>\u003Cp data-uid=\"vUc_2S6f\" data-time=\"1779263310250\">\u003C\u002Fp>\u003Cp data-uid=\"WeqNvgtL\" data-time=\"1779263340307\">肌に必要なものだけを、まっすぐ届ける。\u003C\u002Fp>\u003Cp data-uid=\"XqUa6Ex1\" data-time=\"1779263964975\">その考えをを突き詰めた結果、ロングルアージュのスキンケアは、極めて\u003Cstrong>シンプルな処方\u003C\u002Fstrong>に行き着きました。\u003C\u002Fp>\u003Cp data-uid=\"qAtzDyTU\" data-time=\"1779263951882\">このスキンケアは、「ネイルサロンが化粧水を作った」のではなく、\u003Cstrong>ネイルケアを真剣に考え続けた結果、自然と必要になったもの\u003C\u002Fstrong>だったのです。\u003C\u002Fp>",{"project":94,"publishedAt":95,"createdAt":96,"order":32,"publishType":33,"schema":97,"uid":98,"updatedAt":99},{"id":29},["Date","2026-06-26T01:00:00.000Z"],["Date","2026-05-20T07:43:20.000Z"],{"id":35,"key":36,"postType":37},"iLFHIDmy",["Date","2026-07-15T06:48:30.000Z"],[56,101,102],"ScKXlWON:_b6L6F13","sB0E_NRW:WiGiFnC8","MvbD7a5n0NCDfVcnqehW","\u003Cp data-uid=\"djnP4H8Y\" data-time=\"1779261901582\">ロングルアージュは、日々のサロンワークの中で、数えきれないほどのお客様の手に触れてきました。\u003C\u002Fp>\u003Cp data-uid=\"3dxgaIyP\" data-time=\"1779262023380\">ネイル施術に欠かせない工程のひとつが、\u003Cstrong>手指消毒\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"rHQz4S3p\" data-time=\"1779261912939\">\u003C\u002Fp>\u003Cp data-uid=\"4oKp46Jg\" data-time=\"1779262225995\">衛生を守るために必要不可欠なもの。けれど同時に、アルコールによる刺激や乾燥に悩まれるお客様、そして、日に何度も手指消毒を繰り返すスタッフの手荒れも、長年見過ごせない課題としてありました。\u003C\u002Fp>\u003Cp data-uid=\"Tp4sRZOD\" data-time=\"1779262246872\">「肌が弱い方にも、もっとやさしい方法はないだろうか」「清潔を保ちながら、うるおいを守ることはできないだろうか」\u003C\u002Fp>\u003Cp data-uid=\"mwCM8O9A\" data-time=\"1779262017476\">その問いから探し始めたのが、\u003Cstrong>“肌のための水\u003C\u002Fstrong>”でした。\u003C\u002Fp>\u003Cp data-uid=\"UUIbeCLR\" data-time=\"1779262014387\">\u003C\u002Fp>\u003Cp data-uid=\"SYzKrgAY\" data-time=\"1779262093987\">さらりとして、べたつかないこと。\u003C\u002Fp>\u003Cp data-uid=\"8qN0xN2e\" data-time=\"1779262119012\">施術の邪魔にならず、毎日心地よく使えること。\u003C\u002Fp>\u003Cp data-uid=\"HHYcrSDq\" data-time=\"1779262141726\">そして、乾燥しやすい手肌に、やさしく寄り添えること。\u003C\u002Fp>\u003Cp data-uid=\"iv_8gEZt\" data-time=\"1779262144754\">\u003C\u002Fp>\u003Cp data-uid=\"WLe689xm\" data-time=\"1779262285232\">ネイルケアを真剣に考え続ける中で、自然とたどり着いたのが、\u003Cstrong>スキンケア\u003C\u002Fstrong>という存在でした。\u003C\u002Fp>\u003Cp data-uid=\"IpzltWU8\" data-time=\"1779262290005\">こうして生まれたのが、プロトンイオン水をベースにした、\u003Cstrong>ロングルアージュの化粧水\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":106,"publishedAt":107,"createdAt":108,"order":32,"publishType":33,"schema":109,"uid":110,"updatedAt":111},{"id":29},["Date","2026-06-05T01:00:00.000Z"],["Date","2026-05-20T07:22:56.000Z"],{"id":35,"key":36,"postType":37},"_b6L6F13",["Date","2026-06-25T06:22:51.000Z"],[113,56,114],"ScKXlWON:zdyVNTZ3","sB0E_NRW:iLFHIDmy","4SVDfRuOn5v7G1rWvNza",{"project":117,"publishedAt":118,"createdAt":119,"order":32,"publishType":33,"schema":120,"uid":53,"updated
