se,studioDomain:".studio.site",studioPublishUrl:"https://storage.googleapis.com/studio-publish",studioPublishIndexUrl:"https://storage.googleapis.com/studio-publish-index",rssApiPath:"https://rss.studiodesignapp.com/rssConverter",embedSandboxDomain:".studioiframesandbox.com",apiProxyUrl:"https://studio-api-proxy-rajzgb4wwq-an.a.run.app",proxyApiBaseUrl:"https://api.studiodesignapp.com/data_proxy_api",isDev:false,fontsApiBaseUrl:"https://fonts.studio.design",selfHostedFontsBaseUrl:"https://fonts.studio.design/ts",studioFrontUrl:"https://app.studio.design",jwtCookieName:"jwt_token",chillnnCdnUrl:"https://cdn.chillnn.com"},app:{baseURL:"/",buildId:"8bbfe36d-66d8-47fe-bf08-e611b7ce14d4",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__" type="application/json">[["ShallowReactive",1],{"data":2,"state":126,"once":128,"_errors":129,"serverRendered":131,"path":132,"pinia":133},["ShallowReactive",3],{"dynamicDatacolumn\u002Fposts\u002Fcolumn_09":4},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":9,"ScKXlWON":12,"sB0E_NRW":74,"body":48,"_meta":119,"_filter":125,"id":60},"column_09","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a791b174-8ab2-40fc-8be3-2dc1a60f60f6.png","指先から素肌まで、”整える”ということ ","指先から素肌まで、”整える”ということ",{"id":10,"title":11},"iQIXcYlc","ロングルアージュ",{"slug":13,"cover":14,"title":15,"OkocjktT":15,"S2EU8djY":16,"ScKXlWON":19,"sB0E_NRW":46,"body":61,"_meta":62,"_filter":69,"id":73},"column_08","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_0b99a133-a76d-4425-bc85-056c710bd669.jpg","爪のしくみ、知っていますか",{"id":17,"title":18},"eixet5FE","爪のこと",{"slug":20,"cover":21,"title":22,"OkocjktT":23,"S2EU8djY":24,"body":27,"_meta":28,"_filter":41,"id":45},"column_07","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_485b6be0-a0a7-4c06-9653-8b8d4e3b8718.png","ネイルはもっと“ケア”でいい。 ","ネイルはもっと“ケア”でいい。 ",{"id":25,"title":26},"hm0DQq4I","美学","\u003Cp data-uid=\"yMtUJXjS\" data-time=\"1750837026196\">ネイル＝カラーやデザイン。そう思っている方は、まだまだ多いかもしれません。でも、ロングルアージュが何より大切にしているのは、「\u003Cstrong>爪そのもの」\u003C\u002Fstrong>を美しく育てること。\u003C\u002Fp>\u003Cp data-uid=\"DddnsyNx\" data-time=\"1748412937655\">私たちは、爪は髪や肌と同じように&nbsp;\u003Cstrong>自分自身の一部\u003C\u002Fstrong>として、もっと丁寧に、もっと日常的にケアされるべき存在だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"UlVv5llf\" data-time=\"1750837031180\">\u003C\u002Fp>\u003Ch1 data-uid=\"1YeuPFkJ\" data-time=\"1748412937655\" id=\"index_1YeuPFkJ\">\u003Cstrong>「健康な自爪」という土台があるからこそ、色も輝く。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"S1mVKymn\" data-time=\"1748411849130\">&nbsp;爪が乾燥していたり、薄く割れやすくなっていたり。そんな状態では、どんなに美しいカラーを重ねても持ちが悪く、せっかくのおしゃれも台無しに。\u003C\u002Fp>\u003Cp data-uid=\"eKCiofwv\" data-time=\"1748411508034\">でも逆に言えば、自爪が整っていれば、それだけで手元の印象は見違えるほど洗練される。\u003C\u002Fp>\u003Cp data-uid=\"j620LnpL\" data-time=\"1748411939150\">爪の形を整えて、甘皮をケアし、ベースコートだけを軽くひと塗り。それだけでも、手元はぐっと上品に、どこか凛とした空気をまといます。\u003C\u002Fp>\u003Cp data-uid=\"1O9JFiYp\" data-time=\"1750837039537\">\u003C\u002Fp>\u003Ch1 data-uid=\"Yxjv4EIG\" data-time=\"1748411521340\" id=\"index_Yxjv4EIG\">\u003Cstrong>飾るよりも、仕立てる。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"S5a6zhgG\" data-time=\"1750837101130\">「ネイル＝ファッションの一部」「色やパーツで飾るもの」という傾向が強まる中で、爪が傷んでしまっている方を多く見かけるようになりました。でも本来、ネイルのおしゃれは\u003Cstrong>大人のたしなみ\u003C\u002Fstrong>のひとつ。アクセサリーではなく、\u003Cstrong>素の美しさ\u003C\u002Fstrong>を育てる習慣なのだと、私たちは信じています。\u003C\u002Fp>\u003Cp data-uid=\"0BanQn1e\" data-time=\"1750837091547\">爪・肌・髪——&nbsp; &nbsp;自分の体の一部を、日々のケアで美しく仕立てていく。それはきっと、一番贅沢で、誇るべき美しさなのではないでしょうか。\u003C\u002Fp>\u003Cp data-uid=\"CSb115BD\" data-time=\"1750837046530\">\u003C\u002Fp>\u003Ch1 data-uid=\"JVRGZktw\" data-time=\"1748411567917\" id=\"index_JVRGZktw\">\u003Cstrong>爪を整えることは、仕草を整えること。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"tRZ2HvFn\" data-time=\"1750837056314\">自爪に自信があるだけで、コーヒーカップを持つ手、書類を渡す指先に、もう視線を気にすることはありません。手元が美しいと、動きにも自然と品が宿ります。奥ゆかしさや所作の美しさに対する美意識は、きっと日本人のDNAの中にあるもの。\u003C\u002Fp>\u003Cp data-uid=\"fmbOaTPm\" data-time=\"1748411901127\">指先のケアは、仕草のケアでもある。そんなふうに感じています。\u003C\u002Fp>\u003Cp data-uid=\"yba5VrAv\" data-time=\"1750837057218\">\u003C\u002Fp>\u003Ch1 data-uid=\"LfdFZWR5\" data-time=\"1748412928808\" id=\"index_LfdFZWR5\">\u003Cstrong>まずは、1週間に一度の “整える” 習慣から。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"u_OtrkaZ\" data-time=\"1750837061708\">週に1度、爪の長さを整える。甘皮を優しくケアし、うるおいを補う。それだけで、爪のコンディションは確実に変わっていきます。\u003C\u002Fp>\u003Cp data-uid=\"pHqA63M7\" data-time=\"1750837114941\">\u003C\u002Fp>\u003Cp data-uid=\"9XcUxXey\" data-time=\"1748409956968\">まずは、ケアから始めてみませんか。\u003C\u002Fp>\u003Cp data-uid=\"NF5Fpjh7\" data-time=\"1748411971617\">ネイルは、もっとケアでいい。そしてきっと、ケアだけでも美しい。\u003C\u002Fp>",{"project":29,"publishedAt":31,"createdAt":32,"order":33,"publishType":34,"schema":35,"uid":39,"updatedAt":40},{"id":30},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-05-28T06:01:03.000Z"],["Date","2025-05-28T05:25:17.000Z"],-1,"change",{"id":36,"key":37,"postType":38},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","ypIvIsFD",["Date","2025-06-25T07:38:35.000Z"],[42,43,44],"S2EU8djY:hm0DQq4I","ScKXlWON:rJ4FL36x","sB0E_NRW:E_jW5YMS","SN8WKscTdGKEvIr7WnHz",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":47,"body":48,"_meta":49,"_filter":56,"id":60},{"id":10,"title":11},"\u003Cp data-uid=\"WGlmZ_HS\" data-time=\"1753234581716\">ロングルアージュに、\u003Cstrong>スキンケアシリーズ\u003C\u002Fstrong>があることをご存知でしょうか。\u003C\u002Fp>\u003Cp data-uid=\"0z5VARyq\" data-time=\"1753234784666\">爪を美しく育てるために、私たちはずっと\u003Cstrong>「保湿の大切さ」\u003C\u002Fstrong>をお伝えしてきました。どんなに丁寧なケアや美しいカラーを施しても、土台である爪が乾燥していては、美しさは長くは続きません。\u003C\u002Fp>\u003Cp data-uid=\"DuA1r8EA\" data-time=\"1753234316137\">それは、お肌も同じこと。\u003C\u002Fp>\u003Cp data-uid=\"H8Md8MYE\" data-time=\"1753234790063\">どんな美容成分よりもまず先に、\u003Cstrong>”うるおい”\u003C\u002Fstrong>を与えること。私たちは、そう考えています。\u003C\u002Fp>\u003Cp data-uid=\"f6qzrJYV\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"H7ZLarB1\" data-time=\"1753234793133\">ロングルアージュのスキンケアが生まれたきっかけは、十数年前。ネイルの施術前に使える、肌にやさしい化粧水を探していたことが始まりでした。\u003C\u002Fp>\u003Cp data-uid=\"WjNk7_Qf\" data-time=\"1753234866427\">敏感肌でアルコールが使えないお客様や、手を何度も洗うスタッフの手肌を守りたい。\u003C\u002Fp>\u003Cp data-uid=\"6OlrA7E6\" data-time=\"1753234316137\">その想いから出会ったのが、イオン化された水をベースに開発された保湿化粧水でした。\u003C\u002Fp>\u003Cp data-uid=\"reKVe5tf\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"cCzVYvZz\" data-time=\"1753234558568\">以来、この化粧水は、私たちにとって、爪と肌の\u003Cstrong>”うるおいの原点”\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"2er5wf2T\" data-time=\"1753234800803\">目立つ成分や香りで飾るのではなく、余計なものをそぎ落とし、必要な水分だけをまっすぐに届ける。爪も肌も、その人本来の美しさを引き出すには、\u003Cstrong>シンプルで上質な保湿\u003C\u002Fstrong>が欠かせないのです。\u003C\u002Fp>\u003Cp data-uid=\"caBH_vYZ\" data-time=\"1753234804189\">お客様の爪がみずみずしさを取り戻し、ふとした瞬間に光をまとった指先へと変わっていく。その小さな変化を、私たちは何度も目にしてきました。\u003C\u002Fp>\u003Cp data-uid=\"9ILvlcfU\" data-time=\"1753234316137\">その感動を、今度はお肌にも。\u003C\u002Fp>\u003Cp data-uid=\"g67qBUCi\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ysBnSRO5\" data-time=\"1753234808227\">誰もが安心して使えるものを。赤ちゃんも、ご年配の方も、敏感肌の方にも。\u003C\u002Fp>\u003Cp data-uid=\"xn7BxnUM\" data-time=\"1753234727877\">\u003Cstrong>爪を知り尽くしたネイルサロンが、本気でつくったスキンケア\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":50,"publishedAt":51,"createdAt":52,"order":33,"publishType":34,"schema":53,"uid":54,"updatedAt":55},{"id":30},["Date","2025-07-23T01:41:44.000Z"],["Date","2025-07-23T01:29:12.000Z"],{"id":36,"key":37,"postType":38},"RoToLWf6",["Date","2025-08-12T02:20:32.000Z"],[57,58,59],"ScKXlWON:E_jW5YMS","S2EU8djY:iQIXcYlc","sB0E_NRW:KE1ulQ6e","JMjR0bEKEMZAGOl10C2Z","\u003Cp data-uid=\"_E1aeedg\" data-time=\"1750831195588\">毎日目にする”爪”ですが、その構造や役割については意外と知られていません。\u003C\u002Fp>\u003Cp data-uid=\"58cK4zTq\" data-time=\"1750836462753\">健康で美しい指先を保つために、まずは「知ること」から始めてみませんか。\u003C\u002Fp>\u003Cp data-uid=\"65tSNrO1\" data-time=\"1750832856665\">今回は、爪のしくみとケアの重要性についてご紹介します。\u003C\u002Fp>\u003Cp data-uid=\"NOcKhvjt\" data-time=\"1750831169338\">\u003C\u002Fp>\u003Ch1 data-uid=\"H0FG2g0R\" data-time=\"1750831162798\" id=\"index_H0FG2g0R\">\u003Cstrong>指先を守る、大切な役割\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"agy_rwaT\" data-time=\"1750831406615\">爪の主な成分は、たんぱく質の一種\u003Cstrong>「ケラチン」\u003C\u002Fstrong>。水分や脂質、カルシウムなどをわずかに含み、髪の毛と同様に皮膚が角質化してできたものです。この角質部分には細胞の活動がないため、一度傷んでしまうと自ら回復することはありません。だからこそ、日々のケアがとても重要です。\u003C\u002Fp>\u003Cp data-uid=\"DnFQ039Z\" data-time=\"1750831332938\">爪の大きな役割は、\u003Cstrong>指先の保護\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"8EPf5mOw\" data-time=\"1750832871996\">物をつかむ・ボタンを押す・文字を書くなど、日常のあらゆる動作において、爪は指先の繊細な動きを支えています。\u003C\u002Fp>\u003Cp data-uid=\"CnpNrbEI\" data-time=\"1750831395736\">\u003C\u002Fp>\u003Ch1 data-uid=\"0eX3jCto\" data-time=\"1750831381723\" id=\"index_0eX3jCto\">\u003Cstrong>爪の構造をのぞいてみましょう\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"gh0HaOAV\" data-time=\"1750831456598\">爪は、私たちが目にする部分だけでなく、皮膚の下にある複雑な構造によって成り立っています。&nbsp;\u003C\u002Fp>\u003Cfigure data-uid=\"ySRRmdz6\" data-time=\"1750832008029\" data-thread=\"\" style=\"text-align: \">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1875x1429_v-frms_webp_04485877-fd0d-48e6-a9c1-5154cf91ccda.png\" alt=\"\" width=\"418\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"iuNzcyQ0\" data-time=\"1750832241494\">\u003Cstrong>爪根（そうこん）／ネイルルート（a）\u003C\u002Fstrong>\u003Cbr>生まれたての爪の一部。皮膚の下にあり、外からは見えません。\u003C\u002Fp>\u003Cp data-uid=\"7vqRuFQR\" data-time=\"1750832248732\">\u003Cstrong>爪母（そうぼ）／ネイルマトリックス（b）\u003C\u002Fstrong>\u003Cbr>爪をつくり出す“製造工場”。ここで生まれた細胞が角質化し、爪となって伸びていきます。\u003C\u002Fp>\u003Cp data-uid=\"gCyM26A1\" data-time=\"1750832253065\">\u003Cstrong>爪半月（そうはんげつ）／ルヌラ（c）\u003C\u002Fstrong>\u003Cbr>爪の根元に見える白い半月状の部分。健康状態により見え方が変わることもあります。\u003C\u002Fp>\u003Cp data-uid=\"bwxqvuyH\" data-time=\"1750832255431\">\u003Cstrong>甘皮（あまかわ）／キューティクル（d）\u003C\u002Fstrong>\u003Cbr>爪と皮膚の間をふさぎ、異物や細菌の侵入を防ぐガード役。健康な状態では、爪の成長に合わせてしなやかに動きます。\u003C\u002Fp>\u003Cp data-uid=\"qLkv0_aU\" data-time=\"1750832258330\">\u003Cstrong>爪下皮（そうかひ）／ハイポニキウム（e）\u003C\u002Fstrong>\u003Cbr>爪先の裏側にある皮膚部分。爪と指とをつなぎ、支え、保護します。\u003C\u002Fp>\u003Cp data-uid=\"IL7sV68S\" data-time=\"1750832260707\">\u003Cstrong>爪甲（そうこう）／ネイルプレート（f）\u003C\u002Fstrong>\u003Cbr>私たちが日常的に「爪」と呼ぶ部分。爪母でつくられた角質が、少しずつ押し出されて形成されます。\u003C\u002Fp>\u003Cp data-uid=\"5jauiwAn\" data-time=\"1750832186824\">このように、爪は\u003Cstrong>根元から先端までが連動して機能する、繊細で緻密な構造\u003C\u002Fstrong>を持っているのです。\u003C\u002Fp>\u003Cp data-uid=\"9Orgko3k\" data-time=\"1750830897989\">&nbsp;\u003C\u002Fp>\u003Ch1 data-uid=\"st0vyUWM\" data-time=\"1750832989390\" id=\"index_st0vyUWM\">\u003Cstrong>甘皮ケアが、美しい爪を育てる\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"b0VSXlZA\" data-time=\"1750832303662\">なかでも、\u003Cstrong>甘皮（キューティクル）\u003C\u002Fstrong>は爪を保護する大切な存在です。\u003C\u002Fp>\u003Cp data-uid=\"Pr4yN9cQ\" data-time=\"1750832353401\">しかし、甘皮が必要以上に爪に張りついた状態が続くと、爪の成長を妨げたり、伸びる過程で甘皮が引っ張られて裂け、ささくれの原因になったりすることもあります。\u003C\u002Fp>\u003Cp data-uid=\"iRDK_Ayx\" data-time=\"1750832499376\">ロングルアージュでは、この\u003Cstrong>甘皮ケア\u003C\u002Fstrong>をとても大切に考えています。\u003C\u002Fp>\u003Cp data-uid=\"diqtmgtZ\" data-time=\"1750832814367\">週に一度、ぬるま湯などで甘皮をやわらかくしてから、やさしく押し上げて爪から離してあげましょう。こうすることで、根元まで保湿や美容成分が届きやすくなり、健康な爪が育ちやすくなります。また、ベースコートやネイルカラーを塗る際には、甘皮部分をふさがないよう、\u003Cstrong>根元1mmを空けて塗る\u003C\u002Fstrong>もおすすめです。\u003C\u002Fp>\u003Cp data-uid=\"6j4iCgY7\" data-time=\"1750832523375\">見た目の美しさだけでなく、爪の呼吸を妨げない細やかな配慮が、長く健やかな指先を保つ秘訣です。\u003C\u002Fp>\u003Cp data-uid=\"txF3q1Qv\" data-time=\"1750830897989\">&nbsp;\u003C\u002Fp>\u003Ch1 data-uid=\"JVRs2cJG\" data-time=\"1750832542921\" id=\"index_JVRs2cJG\">\u003Cstrong>爪はどう伸びる？ 成長のしくみ\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"PnyBNiZs\" data-time=\"1750832563021\">爪は、爪母（マトリックス）でつくられた新しい細胞が角質化し、押し出されることで伸びていきます。\u003C\u002Fp>\u003Cp data-uid=\"9MZgKOBI\" data-time=\"1750832635665\">成人の手の爪は、\u003Cstrong>1ヶ月で約3mm\u003C\u002Fstrong>伸び、すべてが生え変わるまでには\u003Cstrong>約5〜6ヶ月\u003C\u002Fstrong>かかります。一方、足の爪はその半分から3分の1程度のスピードで伸び、生え変わりには\u003Cstrong>約1年〜1年半\u003C\u002Fstrong>かかるとされています。\u003C\u002Fp>\u003Cp data-uid=\"feRsFvQN\" data-time=\"1750832681315\">成長はゆっくりですが、\u003Cstrong>日々のケアの積み重ねが、半年後・1年後の指先を変える\u003C\u002Fstrong>のです。\u003C\u002Fp>\u003Cp data-uid=\"eGgrSn7A\" data-time=\"1750832833706\">\u003C\u002Fp>\u003Cp data-uid=\"MnyZe_CX\" data-time=\"1750832839867\">ロングルアージュでは、見た目の美しさだけでなく、\u003Cstrong>爪そのものの質を育てるケア\u003C\u002Fstrong>を大切にしています。毎日の丁寧な習慣が、長く続く美しさへとつながっていきます。\u003C\u002Fp>\u003Cp data-uid=\"4HLPzM8M\" data-time=\"1750832760976\">ぜひ、ご自身の爪と少し向き合うひとときを、日々の中に取り入れてみてください。\u003C\u002Fp>",{"project":63,"publishedAt":64,"createdAt":65,"order":33,"publishType":34,"schema":66,"uid":67,"updatedAt":68},{"id":30},["Date","2025-06-25T07:35:08.000Z"],["Date","2025-06-25T05:52:21.000Z"],{"id":36,"key":37,"postType":38},"E_jW5YMS",["Date","2025-08-12T01:57:53.000Z"],[70,71,72],"S2EU8djY:eixet5FE","ScKXlWON:ypIvIsFD","sB0E_NRW:RoToLWf6","gVaM7hAYbXl73Trt7B3s",{"slug":75,"cover":76,"title":77,"OkocjktT":78,"S2EU8djY":79,"ScKXlWON":80,"sB0E_NRW":89,"body":107,"_meta":108,"_filter":115,"id":118},"column_10","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_57a5525f-5ed0-47db-b649-49c909370b79.png","誰でも手に入れられる”黄金比の爪” ","誰でも手に入れられる”黄金比の爪”\u003Cbr>",{"id":17,"title":18},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":81,"body":48,"_meta":82,"_filter":88,"id":60},{"id":10,"title":11},{"project":83,"publishedAt":84,"createdAt":85,"order":33,"publishType":34,"schema":86,"uid":54,"updatedAt":87},{"id":30},["Date","2025-07-23T01:41:44.000Z"],["Date","2025-07-23T01:29:12.000Z"],{"id":36,"key":37,"postType":38},["Date","2025-08-12T02:20:32.000Z"],[57,58,59],{"slug":90,"cover":91,"title":92,"OkocjktT":93,"S2EU8djY":94,"body":95,"_meta":96,"_filter":103,"id":106},"column11","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_431bf801-2026-4a74-b2ba-2adeefcbe3d7.png","フレンチネイルという、究極のエレガンス ","フレンチネイルという、究極のエレガンス\u003Cbr>",{"id":17,"title":18},"\u003Cp data-uid=\"TzO1_z99\" data-time=\"1758507567717\">爪のおしゃれの究極といえば、やはり「フレンチネイル」。\u003C\u002Fp>\u003Cp data-uid=\"1N1gu8uW\" data-time=\"1758507575630\">透明感のある淡いピンクをベースに、先端へ弧を描くように白をのせる。シンプルでありながら、洗練を極めたスタイルです。\u003C\u002Fp>\u003Cp data-uid=\"Hf2F22Ej\" data-time=\"1758507567718\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"hGm1TwCq\" data-time=\"1758507676081\">フレンチネイルは王道のデザインでありながら、その美しさを引き立てるためには、爪のカーブや長さのバランスが重要です。\u003C\u002Fp>\u003Cp data-uid=\"N0UFHuj6\" data-time=\"1758507676081\">理想的なバランスをもつ爪に施すと、その魅力は格別。まさに、”黄金比”に近い形を持つ爪だけに許された、特別なデザインといえるでしょう。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"gVH1JvlR\" data-time=\"1758507580457\">けれど、その黄金比に近づくのは、決して特別な人だけではありません。日々のお手入れで少しずつ整えていくことで、誰もがその美しさに近づくことができます。&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"C70ROQTU\" data-time=\"1758507581675\">\u003C\u002Fp>\u003Cp data-uid=\"NeE71i4W\" data-time=\"1758507732537\">完成したフレンチネイルは、服を選ばず、シーンを選ばず、指先に清らかな気品を添えてくれます。\u003C\u002Fp>\u003Cp data-uid=\"cEvtnBzy\" data-time=\"1758507732537\">そして何より、ふと視線を落としたときに目に映る美しい自分の爪が、心を弾ませ、毎日を少し特別にしてくれるはずです。\u003C\u002Fp>\u003Cp data-uid=\"H4GLXJa7\" data-time=\"1758507567718\">\u003Cstrong>&nbsp;\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"lLMbCRBT\" data-time=\"1758507764685\">それは、自爪を大切に育ててきた人へのご褒美であり、これから育てていく人にとっての希望の象徴。\u003C\u002Fp>\u003Cp data-uid=\"p2ULiQa7\" data-time=\"1758507764685\">フレンチネイルは、指先だけでなく心までも晴れやかにする、永遠のエレガンスなのです。\u003C\u002Fp>",{"project":97,"publishedAt":98,"createdAt":99,"order":33,"publishType":34,"schema":100,"uid":101,"updatedAt":102},{"id":30},["Date","2025-09-22T02:26:16.000Z"],["Date","2025-09-22T02:18:17.000Z"],{"id":36,"key":37,"postType":38},"tZpN0s0o",["Date","2025-10-09T08:07:19.000Z"],[70,104,105],"ScKXlWON:KE1ulQ6e","sB0E_NRW:P9iiKp18","VxEFHOQHTF9Nj2yEBK8I","\u003Cp data-uid=\"a293VHbE\" data-time=\"1754964096670\">これまで数えきれないほどの指先を見てきた経験から、「美しい」と感じる爪には、確かな共通点があると感じてきました。\u003C\u002Fp>\u003Cp data-uid=\"_VDYtYQ6\" data-time=\"1754964096670\">けれど、その理由を言葉で説明するのは、意外と難しいものでした。\u003C\u002Fp>\u003Cp data-uid=\"6BKwDMbL\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"QAqkrohU\" data-time=\"1754964313411\">「もしかすると、何か法則のようなものがあるのではないか。」そう思い、ふと頭に浮かんだのが\u003Cstrong>「黄金比」\u003C\u002Fstrong>でした。\u003C\u002Fp>\u003Cp data-uid=\"x2Z5nAFV\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"kpl_tqKp\" data-time=\"1754964378266\">名刺やクレジットカード、パリの凱旋門やギリシャのパルテノン神殿、エジプトのピラミッドなど、さまざまな絵画や建築にも用いられる、\u003Cstrong>黄金比 1：1.6\u003C\u002Fstrong>という比率。古代から「美しい」と称えられてきた建造物の多くに、この比率が隠れています。\u003C\u002Fp>\u003Cp data-uid=\"8Y3x26U8\" data-time=\"1754964291742\">そして、実はこの黄金比が、\u003Cstrong>爪の美しさ\u003C\u002Fstrong>にも通じていたのです。\u003C\u002Fp>\u003Cp data-uid=\"IYipAC_B\" data-time=\"1754964129327\">\u003C\u002Fp>\u003Cp data-uid=\"TpTksEqu\" data-time=\"1754964461806\">長年サロンに通ってくださっているお客さまの中で、誰もが見惚れるほど美しい爪をお持ちの方々の指先を計測してみると、\u003Cstrong>爪の高さ（カーブ）と爪の幅\u003C\u002Fstrong>が、まさに\u003Cstrong>1：1.6\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"oJaKWgQ1\" data-time=\"1754963947362\">その中には、まるで黄金長方形が描かれているかのようでした。\u003C\u002Fp>\u003Cfigure data-uid=\"kZXWxUop\" data-time=\"1754964038732\" data-thread=\"\" style=\"text-align: \">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1200x800_v-fms_webp_b27b8685-4c8c-492d-a6a2-277955986822.png\" alt=\"\" width=\"370.98748779296875\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"vPZy2LGw\" data-time=\"1754964053217\">この\u003Cstrong>“爪の黄金比”\u003C\u002Fstrong>は、特別な人だけが持つものではありません。\u003C\u002Fp>\u003Cp data-uid=\"erNH27BV\" data-time=\"1754963947362\">日々の丁寧なお手入れによって、どなたの指先にもゆっくりと、確実に育まれていくものです。\u003C\u002Fp>\u003Cp data-uid=\"DmN7Jtt1\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ktbl36gb\" data-time=\"1754964493972\">爪の形は変えることができます。美しさは、日々の積み重ねの先に現れます。\u003C\u002Fp>\u003Cp data-uid=\"v3GbCQS3\" data-time=\"1754964504220\">そして今日のお手入れが、明日の指先の印象を変えていくのです。\u003C\u002Fp>",{"project":109,"publishedAt":110,"createdAt":111,"order":33,"publishType":34,"schema":112,"uid":113,"updatedAt":114},{"id":30},["Date","2025-08-12T02:20:23.000Z"],["Date","2025-08-12T01:58:20.000Z"],{"id":36,"key":37,"postType":38},"KE1ulQ6e",["Date","2025-09-22T02:26:25.000Z"],[70,116,117],"ScKXlWON:RoToLWf6","sB0E_NRW:tZpN0s0o","DX6Kmix35KCc1oD6MVfK",{"project":120,"publishedAt":121,"createdAt":122,"order":33,"publishType":34,"schema":123,"uid":54,"updatedAt":124},{"id":30},["Date","2025-07-23T01:41:44.000Z"],["Date","2025-07-23T01:29:12.000Z"],{"id":36,"key":37,"postType":38},["Date","2025-08-12T02:20:32.000Z"],[57,58,59],["Reactive",127],{},["Set"],["ShallowReactive",130],{"dynamicDatacolumn\u002Fposts\u002Fcolumn_09":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn_09",["Reactive",134],{"cmsContentStore":135,"projectStore":139,"productStore":160,"pageHeadStore":703,"cmsStore":707,"useSnackBarStore":715},{"listContentsMap":136,"contentMap":137},["Map"],["Map",138,4],"SLmv5Xy5\u002Fcolumn_09",{"siteHost":140,"customProxyDomain":141,"project":142},"longleage.co.jp","",{"id":143,"name":11,"customDomain":141,"iconImage":141,"coverImage":144,"displayBadge":145,"integrations":146,"snapshot_path":158,"snapshot_id":159,"recaptchaSiteKey":-1,"conversionEvents":-1},"xPORdZvpar","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F0f5840fe-8094-40fc-9ebe-de2bc0684702",false,[147,150,152,155],{"integration_name":148,"code":149},"custom-code","true",{"integration_name":151,"code":141},"google-analytics",{"integration_name":153,"code":154},"google-tag-manager","GTM-N9Q3BWHZ",{"integration_name":156,"code":157},"search-console","NsumBMx5xUst03kk1dvnTIb55odGQA_RpkV5BWfMX2g","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-publish\u002
