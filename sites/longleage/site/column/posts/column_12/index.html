u002Fs-1600x1600_v-fms_webp_57a5525f-5ed0-47db-b649-49c909370b79.png","誰でも手に入れられる”黄金比の爪” ","誰でも手に入れられる”黄金比の爪”\u003Cbr>",{"id":17,"title":18},"\u003Cp data-uid=\"a293VHbE\" data-time=\"1754964096670\">これまで数えきれないほどの指先を見てきた経験から、「美しい」と感じる爪には、確かな共通点があると感じてきました。\u003C\u002Fp>\u003Cp data-uid=\"_VDYtYQ6\" data-time=\"1754964096670\">けれど、その理由を言葉で説明するのは、意外と難しいものでした。\u003C\u002Fp>\u003Cp data-uid=\"6BKwDMbL\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"QAqkrohU\" data-time=\"1754964313411\">「もしかすると、何か法則のようなものがあるのではないか。」そう思い、ふと頭に浮かんだのが\u003Cstrong>「黄金比」\u003C\u002Fstrong>でした。\u003C\u002Fp>\u003Cp data-uid=\"x2Z5nAFV\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"kpl_tqKp\" data-time=\"1754964378266\">名刺やクレジットカード、パリの凱旋門やギリシャのパルテノン神殿、エジプトのピラミッドなど、さまざまな絵画や建築にも用いられる、\u003Cstrong>黄金比 1：1.6\u003C\u002Fstrong>という比率。古代から「美しい」と称えられてきた建造物の多くに、この比率が隠れています。\u003C\u002Fp>\u003Cp data-uid=\"8Y3x26U8\" data-time=\"1754964291742\">そして、実はこの黄金比が、\u003Cstrong>爪の美しさ\u003C\u002Fstrong>にも通じていたのです。\u003C\u002Fp>\u003Cp data-uid=\"IYipAC_B\" data-time=\"1754964129327\">\u003C\u002Fp>\u003Cp data-uid=\"TpTksEqu\" data-time=\"1754964461806\">長年サロンに通ってくださっているお客さまの中で、誰もが見惚れるほど美しい爪をお持ちの方々の指先を計測してみると、\u003Cstrong>爪の高さ（カーブ）と爪の幅\u003C\u002Fstrong>が、まさに\u003Cstrong>1：1.6\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"oJaKWgQ1\" data-time=\"1754963947362\">その中には、まるで黄金長方形が描かれているかのようでした。\u003C\u002Fp>\u003Cfigure data-uid=\"kZXWxUop\" data-time=\"1754964038732\" data-thread=\"\" style=\"text-align: \">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1200x800_v-fms_webp_b27b8685-4c8c-492d-a6a2-277955986822.png\" alt=\"\" width=\"370.98748779296875\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"vPZy2LGw\" data-time=\"1754964053217\">この\u003Cstrong>“爪の黄金比”\u003C\u002Fstrong>は、特別な人だけが持つものではありません。\u003C\u002Fp>\u003Cp data-uid=\"erNH27BV\" data-time=\"1754963947362\">日々の丁寧なお手入れによって、どなたの指先にもゆっくりと、確実に育まれていくものです。\u003C\u002Fp>\u003Cp data-uid=\"DmN7Jtt1\" data-time=\"1754963947362\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ktbl36gb\" data-time=\"1754964493972\">爪の形は変えることができます。美しさは、日々の積み重ねの先に現れます。\u003C\u002Fp>\u003Cp data-uid=\"v3GbCQS3\" data-time=\"1754964504220\">そして今日のお手入れが、明日の指先の印象を変えていくのです。\u003C\u002Fp>",{"project":27,"publishedAt":29,"createdAt":30,"order":31,"publishType":32,"schema":33,"uid":37,"updatedAt":38},{"id":28},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-08-12T02:20:23.000Z"],["Date","2025-08-12T01:58:20.000Z"],-1,"change",{"id":34,"key":35,"postType":36},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","KE1ulQ6e",["Date","2025-09-22T02:26:25.000Z"],[40,41,42],"S2EU8djY:eixet5FE","ScKXlWON:RoToLWf6","sB0E_NRW:tZpN0s0o","DX6Kmix35KCc1oD6MVfK",{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":45,"body":46,"_meta":47,"_filter":54,"id":58},{"id":9,"title":10},"\u003Cp data-uid=\"kk_FzwEN\" data-time=\"1759996803870\">マニキュアを塗ったあとの「乾かす時間」。\u003C\u002Fp>\u003Cp data-uid=\"w89bcjWa\" data-time=\"1759997098440\">多くの人が、手が使えないその時間を“もったいない” “面倒”と感じるかもしれません。\u003C\u002Fp>\u003Cp data-uid=\"iM3Bhjuq\" data-time=\"1759997108556\">けれどロングルアージュは、\u003Cstrong>その時間こそが、自分をより美しく整えるひととき\u003C\u002Fstrong>だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"1gZTwC5d\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"5WgWT345\" data-time=\"1759997117848\">\u003Cstrong>30分ほど、何も手を使わずに静かに過ごす。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"9DVkDrIO\" data-time=\"1759996803870\">それは、忙しい毎日の中ではむしろ贅沢なこと。\u003C\u002Fp>\u003Cp data-uid=\"ijBPZmDj\" data-time=\"1759997125731\">自分の呼吸や姿勢、指先の所作に意識を向けてみると、その時間が\u003Cstrong>「内面を整える時間」へと変わっていきます。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"y4cUP2GH\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"3tSXfYIz\" data-time=\"1759997154256\">乾くのを待つあいだに、心が静まり、所作が丁寧になり、やがて\u003Cstrong>“ゆっくり動くこと”の美しさ\u003C\u002Fstrong>に気づくでしょう。\u003C\u002Fp>\u003Cp data-uid=\"Lfmuank_\" data-time=\"1759996932021\">マニキュアが乾いたあとも、その感覚は残り、手の動き一つひとつに、品と落ち着きが宿ります。\u003C\u002Fp>\u003Cp data-uid=\"9gp8ZVNl\" data-time=\"1759996803870\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wjfhB60N\" data-time=\"1759997168968\">\u003Cstrong>誰にも見られていない時間にこそ、真の美しさは育まれる。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"Kg39og1G\" data-time=\"1759997191939\">そんな小さな積み重ねが、ロングルアージュが大切にする\u003Cstrong>「長く続く美しさ」につながっていくのです。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"o1QZCaq_\" data-time=\"1759996803871\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"mH0Hm4rC\" data-time=\"1759996803871\">便利さよりも、美しさの本質を選ぶということ。\u003C\u002Fp>\u003Cp data-uid=\"yCdHfDnt\" data-time=\"1759997204966\">その選択こそが、\u003Cstrong>ロングルアージュの美学\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"boKUb1iX\" data-time=\"1759996803871\">\u003Cbr>\u003C\u002Fp>",{"project":48,"publishedAt":49,"createdAt":50,"order":31,"publishType":32,"schema":51,"uid":52,"updatedAt":53},{"id":28},["Date","2025-10-09T08:07:09.000Z"],["Date","2025-10-09T07:59:03.000Z"],{"id":34,"key":35,"postType":36},"P9iiKp18",["Date","2025-11-17T02:01:46.000Z"],[55,56,57],"S2EU8djY:hm0DQq4I","ScKXlWON:tZpN0s0o","sB0E_NRW:qL9TUepS","8ONvON4rPBAG7dU1khVo","\u003Cp data-uid=\"TzO1_z99\" data-time=\"1758507567717\">爪のおしゃれの究極といえば、やはり「フレンチネイル」。\u003C\u002Fp>\u003Cp data-uid=\"1N1gu8uW\" data-time=\"1758507575630\">透明感のある淡いピンクをベースに、先端へ弧を描くように白をのせる。シンプルでありながら、洗練を極めたスタイルです。\u003C\u002Fp>\u003Cp data-uid=\"Hf2F22Ej\" data-time=\"1758507567718\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"hGm1TwCq\" data-time=\"1758507676081\">フレンチネイルは王道のデザインでありながら、その美しさを引き立てるためには、爪のカーブや長さのバランスが重要です。\u003C\u002Fp>\u003Cp data-uid=\"N0UFHuj6\" data-time=\"1758507676081\">理想的なバランスをもつ爪に施すと、その魅力は格別。まさに、”黄金比”に近い形を持つ爪だけに許された、特別なデザインといえるでしょう。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"gVH1JvlR\" data-time=\"1758507580457\">けれど、その黄金比に近づくのは、決して特別な人だけではありません。日々のお手入れで少しずつ整えていくことで、誰もがその美しさに近づくことができます。&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"C70ROQTU\" data-time=\"1758507581675\">\u003C\u002Fp>\u003Cp data-uid=\"NeE71i4W\" data-time=\"1758507732537\">完成したフレンチネイルは、服を選ばず、シーンを選ばず、指先に清らかな気品を添えてくれます。\u003C\u002Fp>\u003Cp data-uid=\"cEvtnBzy\" data-time=\"1758507732537\">そして何より、ふと視線を落としたときに目に映る美しい自分の爪が、心を弾ませ、毎日を少し特別にしてくれるはずです。\u003C\u002Fp>\u003Cp data-uid=\"H4GLXJa7\" data-time=\"1758507567718\">\u003Cstrong>&nbsp;\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"lLMbCRBT\" data-time=\"1758507764685\">それは、自爪を大切に育ててきた人へのご褒美であり、これから育てていく人にとっての希望の象徴。\u003C\u002Fp>\u003Cp data-uid=\"p2ULiQa7\" data-time=\"1758507764685\">フレンチネイルは、指先だけでなく心までも晴れやかにする、永遠のエレガンスなのです。\u003C\u002Fp>",{"project":61,"publishedAt":62,"createdAt":63,"order":31,"publishType":32,"schema":64,"uid":65,"updatedAt":66},{"id":28},["Date","2025-09-22T02:26:16.000Z"],["Date","2025-09-22T02:18:17.000Z"],{"id":34,"key":35,"postType":36},"tZpN0s0o",["Date","2025-10-09T08:07:19.000Z"],[40,68,69],"ScKXlWON:KE1ulQ6e","sB0E_NRW:P9iiKp18","VxEFHOQHTF9Nj2yEBK8I",{"slug":72,"cover":73,"title":74,"OkocjktT":75,"S2EU8djY":76,"ScKXlWON":79,"sB0E_NRW":88,"body":105,"_meta":106,"_filter":113,"id":117},"column13","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_d1385d83-0352-4d6f-b98a-4a13e9b3f3e2.png","ロングルアージュで流れる、私だけのひととき","ロングルアージュで流れる、私だけのひととき\u003Cbr>",{"id":77,"title":78},"iQIXcYlc","ロングルアージュ",{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":80,"body":46,"_meta":81,"_filter":87,"id":58},{"id":9,"title":10},{"project":82,"publishedAt":83,"createdAt":84,"order":31,"publishType":32,"schema":85,"uid":52,"updatedAt":86},{"id":28},["Date","2025-10-09T08:07:09.000Z"],["Date","2025-10-09T07:59:03.000Z"],{"id":34,"key":35,"postType":36},["Date","2025-11-17T02:01:46.000Z"],[55,56,57],{"slug":89,"cover":90,"title":91,"OkocjktT":91,"S2EU8djY":92,"body":93,"_meta":94,"_filter":101,"id":104},"column14","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_4be7455d-c3a1-4d2f-a025-a2afb7074321.png","“ラウンドスクエア”という、爪を育てるための形",{"id":17,"title":18},"\u003Cp data-uid=\"i4uyTKE0\" data-time=\"1764665383555\">多くの方が「爪の形は生まれつき」と思いがちですが、実は日々の整え方によって、そのかたちはゆるやかに変わっていきます。\u003C\u002Fp>\u003Cp data-uid=\"tHFKRS5T\" data-time=\"1764665439977\">\u003C\u002Fp>\u003Cp data-uid=\"HxgsiySj\" data-time=\"1764665383555\">ロングルアージュが長年大切にしているのが、独自の“ラウンドスクエア”という形です。\u003C\u002Fp>\u003Cp data-uid=\"J1Oa9DvW\" data-time=\"1764665383555\">\u003Cstrong>ラウンドスクエアは、側面をまっすぐに整え、先端の角だけをやわらかく落としたフォルム。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"jmZ8syWw\" data-time=\"1764665383555\">指先から1～2mmという適切な長さでこの形を保つことで、ストレスポイントに負荷がかかりにくくなり、折れにくく、ほどよい巻きを帯びた“しなやかで美しいライン”が育まれます。\u003C\u002Fp>\u003Cp data-uid=\"3D4aCOhO\" data-time=\"1764665447742\">\u003C\u002Fp>\u003Cp data-uid=\"BuQfeYsk\" data-time=\"1764665383555\">丸すぎても、四角すぎても、爪は弱くなりがち。\u003C\u002Fp>\u003Cp data-uid=\"oTFeNjdL\" data-time=\"1764665383555\">そのどちらにも寄らない絶妙なバランスこそが、ラウンドスクエアの魅力です。\u003C\u002Fp>\u003Cp data-uid=\"WjZiSq2f\" data-time=\"1764665383555\">爪のサイドをしっかり支え、先端にほど良い丸みを持たせることで、健康的な爪を育てる理想的な形が生まれます。\u003C\u002Fp>\u003Cfigure data-uid=\"vK_uWxPc\" data-time=\"1764665552841\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1500x1000_v-fms_webp_2f7ebffa-4125-4874-8fd2-01d05e00e18e.png\" alt=\"\" width=\"345.98748779296875\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"HuAS1sUN\" data-time=\"1764665552841\">\u003C\u002Fp>\u003Cp data-uid=\"IGKPTHZF\" data-time=\"1764665383555\">継続して整えていくと、サイドの支えが安定し、爪はブリッジのように美しい弧を描きはじめます。\u003C\u002Fp>\u003Cp data-uid=\"YJ8ZEPKS\" data-time=\"1764665383555\">カーブのある爪は立体感が生まれ、見た目がぐっと洗練されるだけでなく、ラウンドスクエアとの相乗効果で、手全体をすっきりと細く魅せる視覚効果も期待できます。\u003C\u002Fp>\u003Cp data-uid=\"zCIJzokg\" data-time=\"1764665383555\">平らで丸い爪はどうしても幼く、やや幅広に見えがち。\u003C\u002Fp>\u003Cp data-uid=\"G2P3IGBs\" data-time=\"1764665383555\">カーブが生まれることで、衝撃によるダメージが伝わりにくくなるため、爪そのものの強度も高まります。\u003C\u002Fp>\u003Cp data-uid=\"ga1HnBAR\" data-time=\"1764665500270\">つまり、ラウンドスクエアは\u003Cstrong>「強くて美しく育つ爪」\u003C\u002Fstrong>をつくるための最良の形なのです。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"yxh8VvF4\" data-time=\"1764665476961\">\u003C\u002Fp>\u003Cp data-uid=\"rNq3D7QA\" data-time=\"1764665383555\">日々のネイルケアによって、爪は必ず変わります。\u003C\u002Fp>\u003Cp data-uid=\"mfGvU7Mr\" data-time=\"1764665383555\">「生まれつきだから…」と諦めていた形も、丁寧なケアを重ねることで、もっと美しく、もっと扱いやすく。\u003C\u002Fp>\u003Cp data-uid=\"vHdOAFHD\" data-time=\"1764665383556\">ロングルアージュのネイルケアは、その変化を支え、未来の指先を育てていきます。\u003C\u002Fp>",{"project":95,"publishedAt":96,"createdAt":97,"order":31,"publishType":32,"schema":98,"uid":99,"updatedAt":100},{"id":28},["Date","2025-12-02T08:52:42.000Z"],["Date","2025-12-02T08:49:19.000Z"],{"id":34,"key":35,"postType":36},"AugkL2u5",["Date","2025-12-25T07:28:12.000Z"],[40,102,103],"ScKXlWON:qL9TUepS","sB0E_NRW:1PC4AdM5","NAZVeGImOE1VrKQnfjyP","\u003Cp data-uid=\"pSontbV0\" data-time=\"1763344757987\">ロングルアージュのサロンには、一人ひとりに違う「過ごし方」があります。\u003C\u002Fp>\u003Cp data-uid=\"f8DK74FL\" data-time=\"1763344757987\">扉を開くと、それぞれの日常から少し離れた、自分だけの時間が静かに流れはじめます。\u003C\u002Fp>\u003Cp data-uid=\"WFMaGPCe\" data-time=\"1763344757987\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"x5VyD463\" data-time=\"1763344757987\">あるお客さまは、デジタルデトックスのひとときとして、マニキュアリストとのおしゃべりを存分に楽しんでくださいます。日々のあれこれを語り合うその時間は、まるで小さなコミュニティのよう。\u003C\u002Fp>\u003Cp data-uid=\"x750ZsDX\" data-time=\"1763344767956\">一方で、イヤホンから流れる好きな音楽に身をゆだね、静けさの中で心を整えながら施術を受ける方もいらっしゃいます。指先が整うにつれ、気持ちもすっと軽くなるようです。\u003C\u002Fp>\u003Cp data-uid=\"oEVPFLes\" data-time=\"1763344757987\">マニキュアとペディキュアに肩のマッサージを加え、深い呼吸とともにリラクゼーションに浸る方。\u003C\u002Fp>\u003Cp data-uid=\"wS4ioxlC\" data-time=\"1763344757987\">フットバスで足を温めながら、ハードカバーの本を片手にゆっくりと読書を楽しまれる方。\u003C\u002Fp>\u003Cp data-uid=\"GJCw0az_\" data-time=\"1763344757987\">お友達とご一緒に来店され、久しぶりの再会を満喫される方もいらっしゃいます。\u003C\u002Fp>\u003Cp data-uid=\"OaHrjZWb\" data-time=\"1763344757988\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"aQ5jt3CV\" data-time=\"1763344822799\">手や足を預けていただくという”無防備”な時間と空間。\u003C\u002Fp>\u003Cp data-uid=\"E4Ek8dv2\" data-time=\"1763344824901\">そこには、その方の生き方やお人柄がふと表れる瞬間があります。\u003C\u002Fp>\u003Cp data-uid=\"2rD_DsJV\" data-time=\"1763344824901\">\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"8Usf1jf7\" data-time=\"1763344838199\">自分のためだけに使う、ささやかだけれど豊かな時間。\u003C\u002Fp>\u003Cp data-uid=\"W8_9Eq0O\" data-time=\"1763344850208\">ここは爪を整える場所でありながら、日常の喧噪を忘れられる小さな隠れ家でもあります。\u003C\u002Fp>\u003Cp data-uid=\"c7XqOiec\" data-time=\"1763344850631\">\u003C\u002Fp>\u003Cp data-uid=\"QaXi4xE0\" data-time=\"1763344845651\">ロングルアージュは、誰にもとらわれず、肩の力を抜き、自然体の自分と向き合える場所。\u003C\u002Fp>\u003Cp data-uid=\"NyY9HZ4L\" data-time=\"1763344845651\">そんなやさしい時間が、いつでも皆さまをお待ちしています。\u003C\u002Fp>\u003Cp data-uid=\"mwR5IAuf\" data-time=\"1763344800485\">\u003C\u002Fp>\u003Cp data-uid=\"Gony00mN\" data-time=\"1763344757988\">そして、お帰りの際、ふっと口元に柔らかな笑みが広がる瞬間があります。\u003C\u002Fp>\u003Cp data-uid=\"kKPAQpGi\" data-time=\"1763344891600\">その表情に触れられることこそ、私たちマニキュアリストにとって何よりの喜びです。\u003C\u002Fp>",{"project":107,"publishedAt":108,"createdAt":109,"order":31,"publishType":32,"schema":110,"uid":111,"updatedAt":112},{"id":28},["Date","2025-11-17T02:01:37.000Z"],["Date","2025-11-17T01:58:30.000Z"],{"id":34,"key":35,"postType":36},"qL9TUepS",["Date","2025-12-02T08:53:40.000Z"],[114,115,116],"S2EU8djY:iQIXcYlc","ScKXlWON:P9iiKp18","sB0E_NRW:AugkL2u5","P5SINRoyUUsIhBaztNQ7",{"project":119,"publishedAt":120,"createdAt":121,"order":31,"publishType":32,"schema":122,"uid":52,"updatedAt":123},{"id":28},["Date","2025-10-09T08:07:09.000Z"],["Date","2025-10-09T07:59:03.000Z"],{"id":34,"key":35,"postType":36},["Date","2025-11-17T02:01:46.000Z"],[55,56,57],["Reactive",126],{},["Set"],["ShallowReactive",129],{"dynamicDatacolumn\u002Fposts\u002Fcolumn_12":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn_12",["Reactive",133],{"cmsContentStore":134,"projectStore":138,"productStore":159,"pageHeadStore":702,"cmsStore":706,"useSnackBarStore":714},{"listContentsMap":135,"contentMap":136},["Map"],["Map",137,4],"S
