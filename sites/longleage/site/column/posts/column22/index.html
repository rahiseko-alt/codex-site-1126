002Fs-1600x1600_v-fms_webp_9c28e2b4-752c-400d-811e-bda10605e562.png","Vol.3 ネイルサロンだからこそ生まれた、スキンケア ","Vol.3 ネイルサロンだからこそ生まれた、スキンケア",{"id":9,"title":10},"\u003Cp data-uid=\"R0BV1pA9\" data-time=\"1779263072330\">化粧水は、顔のためだけのものではありません。\u003C\u002Fp>\u003Cp data-uid=\"waRtiGLg\" data-time=\"1779263877536\">手指、腕、ボディ。ネイルサロンは、誰よりも「肌」に触れる場所です。\u003C\u002Fp>\u003Cp data-uid=\"KFxPo4EE\" data-time=\"1779263244808\">施術中、私たちは常に乾燥した手肌や、敏感に揺らぎやすい肌と向き合ってきました。\u003C\u002Fp>\u003Cp data-uid=\"9G7N_tNX\" data-time=\"1779263891857\">\u003C\u002Fp>\u003Cp data-uid=\"yG_Il_KJ\" data-time=\"1779263938952\">だからこそ求めたのは、さらりと水のように\u003Cstrong>軽やかで、べたつかない\u003C\u002Fstrong>こと。\u003C\u002Fp>\u003Cp data-uid=\"JiunAwrv\" data-time=\"1779263933522\">施術の邪魔にならず、\u003Cstrong>毎日心地よく\u003C\u002Fstrong>使えること。\u003C\u002Fp>\u003Cp data-uid=\"lVaHIryE\" data-time=\"1779263930943\">そして、華やかさよりも\u003Cstrong>安心して使い続けられる\u003C\u002Fstrong>ことでした。\u003C\u002Fp>\u003Cp data-uid=\"vUc_2S6f\" data-time=\"1779263310250\">\u003C\u002Fp>\u003Cp data-uid=\"WeqNvgtL\" data-time=\"1779263340307\">肌に必要なものだけを、まっすぐ届ける。\u003C\u002Fp>\u003Cp data-uid=\"XqUa6Ex1\" data-time=\"1779263964975\">その考えをを突き詰めた結果、ロングルアージュのスキンケアは、極めて\u003Cstrong>シンプルな処方\u003C\u002Fstrong>に行き着きました。\u003C\u002Fp>\u003Cp data-uid=\"qAtzDyTU\" data-time=\"1779263951882\">このスキンケアは、「ネイルサロンが化粧水を作った」のではなく、\u003Cstrong>ネイルケアを真剣に考え続けた結果、自然と必要になったもの\u003C\u002Fstrong>だったのです。\u003C\u002Fp>",{"project":24,"publishedAt":26,"createdAt":27,"order":28,"publishType":29,"schema":30,"uid":34,"updatedAt":35},{"id":25},"xhNigFsLJyPJZwwHDZ5N",["Date","2026-06-26T01:00:00.000Z"],["Date","2026-05-20T07:43:20.000Z"],-1,"change",{"id":31,"key":32,"postType":33},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","iLFHIDmy",["Date","2026-07-15T06:48:30.000Z"],[37,38,39],"S2EU8djY:skaeleJ7","ScKXlWON:_b6L6F13","sB0E_NRW:WiGiFnC8","MvbD7a5n0NCDfVcnqehW",{"slug":5,"cover":6,"title":7,"OkocjktT":7,"S2EU8djY":42,"body":43,"_meta":44,"_filter":52,"id":54},{"id":9,"title":10},"\u003Cp data-uid=\"r4vc4hJY\" data-time=\"1786593655363\">ネイルケアも、スキンケアも、一度で劇的に変わるものではありません。\u003C\u002Fp>\u003Cp data-uid=\"o6OHqs6w\" data-time=\"1786593659553\">\u003C\u002Fp>\u003Cp data-uid=\"mm_SYYfS\" data-time=\"1786594590273\">ネイルケアの理想的なお手入れの周期は、1週間から10日。けれど、そのペースですべての方がサロンに通えるわけではないことも、私たちはよく知っています。\u003C\u002Fp>\u003Cp data-uid=\"7lxS6Eq2\" data-time=\"1786593669058\">\u003C\u002Fp>\u003Cp data-uid=\"b2aYzwDJ\" data-time=\"1786594873584\">だからこそ、\u003Cstrong>次にお会いするまでの時間を、どう過ごしていただくか。\u003C\u002Fstrong>ご自宅で、何を使っていただくべきか。\u003C\u002Fp>\u003Cp data-uid=\"6yk_8WNI\" data-time=\"1786672002624\">\u003C\u002Fp>\u003Cp data-uid=\"QnazRaOp\" data-time=\"1786672005181\">日々、多くのお客様の手と爪、肌に触れてきた中で、その問いは自然と積み重なっていきました\u003Cstrong>。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"DlW18FYk\" data-time=\"1786671670526\">\u003C\u002Fp>\u003Cp data-uid=\"dvKChwGO\" data-time=\"1786671672666\">もともとロングルアージュは、\u003Cstrong>”技術集団”\u003C\u002Fstrong>であることに誇りを持ってきました。\u003C\u002Fp>\u003Cp data-uid=\"UhFIOoA_\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"lYt2R7W4\" data-time=\"1786671672664\">爪の状態を見極め、数あるアイテムの中からその方に合うものを選び、確かな技術で健やかな自爪へと導いていく。\u003C\u002Fp>\u003Cp data-uid=\"PcIC40pO\" data-time=\"1786671672664\">だからこそ、自社商品を持たなくてもいいと考えていた時期もあります。\u003C\u002Fp>\u003Cp data-uid=\"ecgdsvK1\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"7nve8EDC\" data-time=\"1786672062222\">けれどお客様から聞こえてきたのは、「何を使えばいいかわからない」「これで本当に合っているのか不安」という声でした。\u003C\u002Fp>\u003Cp data-uid=\"HVlgbO3k\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"HeBAx869\" data-time=\"1786672088740\">サロンで整えたその先も、健やかで美しい状態を育てていくために。\u003C\u002Fp>\u003Cp data-uid=\"cCOLOG_2\" data-time=\"1786671672664\">プロとして、責任をもって\u003Cstrong>「これを使ってください」\u003C\u002Fstrong>と言えるものは何か。\u003C\u002Fp>\u003Cp data-uid=\"tSICXmeu\" data-time=\"1786672103352\">\u003C\u002Fp>\u003Cp data-uid=\"lbL1p0UM\" data-time=\"1786671672664\">そう考えたとき、やはり、私たち自身が作るべきだと思うようになったのです。\u003C\u002Fp>",{"project":45,"publishedAt":46,"createdAt":47,"order":28,"publishType":48,"schema":49,"uid":50,"updatedAt":51},{"id":25},["Date","2026-08-14T02:06:06.000Z"],["Date","2026-08-13T03:56:52.000Z"],"draft",{"id":31,"key":32,"postType":33},"g3_cDfG5",["Date","2026-08-14T01:52:40.000Z"],[37,53],"ScKXlWON:WiGiFnC8","mMqgeGa3Ek0jFbLvnA8e","\u003Cp data-uid=\"eHGkeZqi\" data-time=\"1784096603662\">薄い爪、割れやすい爪。乾燥、ささくれ。\u003C\u002Fp>\u003Cp data-uid=\"mWovjmRp\" data-time=\"1780040280943\">多くの方が、手元や肌に何かしらの悩みを抱えています。\u003C\u002Fp>\u003Cp data-uid=\"3PY0blt2\" data-time=\"1784096618106\">けれどロングルアージュが目指しているのは、悩みを隠すことでも、飾り立てることでもありません。\u003C\u002Fp>\u003Cp data-uid=\"1K53fbo5\" data-time=\"1780039978437\">\u003C\u002Fp>\u003Cp data-uid=\"XOUeGGbP\" data-time=\"1780040188111\">私たちが大切にしているのは、「\u003Cstrong>爪は、あくまで脇役。主役は、その人自身である。」\u003C\u002Fstrong>という考え方です。\u003C\u002Fp>\u003Cp data-uid=\"rkLAfbOS\" data-time=\"1780039960118\">\u003C\u002Fp>\u003Cp data-uid=\"pK8Cf7bs\" data-time=\"1780040206161\">だからこそ、目立たせることよりも、清潔感やその人らしい自然な美しさを大切にしてきました。それはネイルケアだけでなく、スキンケアにも共通する価値観です。\u003C\u002Fp>\u003Cp data-uid=\"uIqMy5EW\" data-time=\"1784096699080\">強い変化を与えることよりも、肌や爪が本来持つ力を妨げず、健やかな状態を支えること。\u003C\u002Fp>\u003Cp data-uid=\"XgoyURxG\" data-time=\"1780040072564\">\u003C\u002Fp>\u003Cp data-uid=\"2DVefVnY\" data-time=\"1784096677535\">爪も、肌も。\u003C\u002Fp>\u003Cp data-uid=\"qV7NrsX3\" data-time=\"1784096686588\">何かを足した状態ではなく、\u003Cstrong>整っていることそのものが美しい。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"CH2Q3eyh\" data-time=\"1780040113691\">私たちは、そう考えています。\u003C\u002Fp>",{"project":57,"publishedAt":58,"createdAt":59,"order":28,"publishType":29,"schema":60,"uid":61,"updatedAt":62},{"id":25},["Date","2026-07-16T15:00:00.000Z"],["Date","2026-05-29T07:30:35.000Z"],{"id":31,"key":32,"postType":33},"WiGiFnC8",["Date","2026-08-14T02:07:10.000Z"],[37,64,65],"ScKXlWON:iLFHIDmy","sB0E_NRW:g3_cDfG5","1InBGfJmA6KU0YExDAqh",{"project":68,"publishedAt":69,"createdAt":70,"order":28,"publishType":48,"schema":71,"uid":50,"updatedAt":72},{"id":25},["Dat
