02F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1360x1360_c1b4922c-e817-4350-8533-1d2b994bcaa1.webp","美しい爪とは ーロングルアージュの美学ー","美しい爪とは\u003Cbr>ーロングルアージュの美学ー",{"id":24,"title":25},"hm0DQq4I","美学","\u003Ch1 data-uid=\"nGwcoQd0\" data-time=\"1740663994587\" id=\"index_nGwcoQd0\">ロングルアージュの考える「美しい爪」。 \u003Cbr>それは長さやデザインではなく、自爪そのものが健康な状態にあることです。\u003C\u002Fh1>\u003Cp data-uid=\"mtJM8sSd\" data-time=\"1740656563460\">最適な周期、ロングルアージュスタイルで爪の長さを整え、甘皮や爪表面のお手入れをする。そのうえで毎日、爪の根元に栄養補給と保湿のためのものを塗る。\u003C\u002Fp>\u003Cp data-uid=\"dJdxDog1\" data-time=\"1740238578066\">この、正しいネイルケアを続けることによって、「爪の質」が上がり、健康で美しい爪に生まれ変わります。\u003C\u002Fp>\u003Cp data-uid=\"gCsF6HYb\" data-time=\"1740238356650\">私たちは飾ることよりも、土台の自爪をまず健康な状態に導くこと。\u003Cbr>自分本来の美しさを引き出すことを大切にしています。\u003C\u002Fp>\u003Cp data-uid=\"mCuCMpqR\" data-time=\"1740658006359\">指先に意識を向ければ、おのずと仕草にも磨きがかかります。 \u003Cbr>指先ひとつにその人の「品格」が宿るように思っています。\u003C\u002Fp>",{"project":28,"publishedAt":30,"createdAt":31,"order":32,"publishType":33,"schema":34,"uid":38,"updatedAt":39},{"id":29},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-03-04T15:05:00.000Z"],["Date","2025-02-16T06:13:49.000Z"],2,"change",{"id":35,"key":36,"postType":37},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","WyIwpQHW",["Date","2025-03-04T15:18:25.000Z"],[41,42],"S2EU8djY:hm0DQq4I","sB0E_NRW:albNgbIj","HfjnYXwqvlxJZkjIVbiF",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":45,"body":46,"_meta":47,"_filter":55,"id":59},{"id":10,"title":11},"\u003Ch2 data-uid=\"mSy4OZTo\" data-time=\"1740663451220\" id=\"index_mSy4OZTo\">ネイルケアといっても爪の整え方には様々なスタイルがあります。\u003C\u002Fh2>\u003Cp data-uid=\"ynUedhwW\" data-time=\"1740663563134\">爪の形は\u003Cstrong>「ラウンドスクエア」\u003C\u002Fstrong>というロングルアージュだけの形をお客様に提案し続けてきました。 これは角の取れた長方形のような形で、この形状に爪を整え続けることで、いつしか爪がアーチを描き、 立体的で美しい状態になっていきます。\u003C\u002Fp>\u003Ch2 data-uid=\"bbNVhx6g\" data-time=\"1740663688344\" id=\"index_bbNVhx6g\">そして、健康で美しい爪に育てるうえで欠かせないもの、それは\u003Cstrong>「キューティクル（甘皮）ケア」\u003C\u002Fstrong>です。\u003C\u002Fh2>\u003Cp data-uid=\"cYGwynij\" data-time=\"1740237372923\">週に一度のペースで甘皮を押し上げて、爪から離してあげることを大切にしています。 ささくれが防げるだけでなく、爪をつくる爪母へ栄養成分や保湿成分が浸透しやすくなります。\u003C\u002Fp>\u003Ch3 data-uid=\"hrtEBEJH\" data-time=\"1740665179049\" id=\"index_hrtEBEJH\">ラウンドスクエアに整え続けることでプロポーションの良い強くてしなやかな自爪を手に入れ、 甘皮のお手入れをすることで爪の質が上がり、「健康で美しい爪」が完成します。\u003C\u002Fh3>",{"project":48,"publishedAt":49,"createdAt":50,"order":51,"publishType":33,"schema":52,"uid":53,"updatedAt":54},{"id":29},["Date","2025-03-04T15:15:00.000Z"],["Date","2025-02-22T15:15:05.000Z"],1,{"id":35,"key":36,"postType":37},"OhHjKylG",["Date","2025-03-31T09:15:31.000Z"],[56,57,58],"S2EU8djY:eixet5FE","ScKXlWON:albNgbIj","sB0E_NRW:_IMDqL0M","dEzn3fJO9csWGNpNOrDp","\u003Ch2 data-uid=\"4K89i2Rj\" data-time=\"1740664728817\" id=\"index_4K89i2Rj\">爪は1日に幾度となく自分の視野に入るものです。\u003C\u002Fh2>\u003Cp data-uid=\"4Rl870js\" data-time=\"1739964508403\">このとき、爪がきちんと手入れされていれば、自分自身の心も満たされた気分になります。しかし、ささくれができていたり、乾燥が目立つ状態であれば、どこか気持ちも後ろ向きになりがちなもの。\u003C\u002Fp>\u003Ch2 data-uid=\"AcDRWeiX\" data-time=\"1740663860392\" id=\"index_AcDRWeiX\">見た目だけでなく、心の状態までも左右する。爪にはそんな力があります。\u003C\u002Fh2>\u003Cp data-uid=\"S2RzufzO\" data-time=\"1740663867336\">ロングルアージュが提案する美しい爪は、 指を長く見せ、折れにくくする形「ラウンドスクエア」と 甘皮を整え、爪の育成を促す「キューティクルケア」によって作ることができます。\u003C\u002Fp>\u003Cp data-uid=\"4PvSkdmZ\" data-time=\"1739965375652\">時間をかけて丁寧に手入れすることで、誰でも爪の形やカーブは美しく変えられ、きれいな手元を作ることができます。&nbsp;\u003C\u002Fp>",{"project":62,"publishedAt":63,"createdAt":64,"order":65,"publishType":33,"schema":66,"uid":67,"updatedAt":68},{"id":29},["Date","2025-03-04T15:10:00.000Z"],["Date","2025-01-25T13:09:06.000Z"],-1,{"id":35,"key":36,"postType":37},"albNgbIj",["Date","2025-03-04T15:19:02.000Z"],[56,70,71],"sB0E_NRW:OhHjKylG","ScKXlWON:WyIwpQHW","9kkVNH61zc1duNTVHrvT",{"slug":74,"cover":75,"title":76,"OkocjktT":77,"S2EU8djY":78,"ScKXlWON":79,"sB0E_NRW":88,"body":105,"_meta":106,"_filter":113,"id":116},"column_04","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1602_v-fms_webp_7a76ff85-68f6-448a-beb4-00ab9ff4dd02.jpg","指先の所作と美意識 ー 美しい爪がもたらすもの","指先の所作と美意識 \u003Cbr>ー 美しい爪がもたらすもの",{"id":24,"title":25},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":80,"body":46,"_meta":81,"_filter":87,"id":59},{"id":10,"title":11},{"project":82,"publishedAt":83,"createdAt":84,"order":51,"publishType":33,"schema":85,"uid":53,"updatedAt":86},{"id":29},["Date","2025-03-04T15:15:00.000Z"],["Date","2025-02-22T15:15:05.000Z"],{"id":35,"key":36,"postType":37},["Date","2025-03-31T09:15:31.000Z"],[56,57,58],{"slug":89,"cover":90,"title":91,"OkocjktT":91,"S2EU8djY":92,"body":93,"_meta":94,"_filter":101,"id":104},"column_05","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-5343x5343_v-frms_webp_7cdd1dcd-6cdd-4aea-9255-7278b4e1e1d2.jpg","マニキュアリスト 東條汀留",{"id":24,"title":25},"\u003Cdiv data-type=\"table_of_contents\" data-uid=\"o7xWmAu3\" data-time=\"1745377029396\">\u003C\u002Fdiv>\u003Chr data-uid=\"zVYI3gzs\" data-time=\"1745377095310\">\u003Ch1 data-uid=\"7ODuuc6H\" data-time=\"1745392961026\" id=\"index_7ODuuc6H\">\u003Cstrong>第一章　爪を手入れするということは、自分を慈しむということ\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"pgAHKJJW\" data-time=\"1745377116963\">ネイルケアの歴史は、遥か紀元前3,000年の古代エジプトにまで遡ります。王族たちは、ヘナという植物の花の汁で爪を染め、装いの一部として指先を彩っていたといわれています。\u003C\u002Fp>\u003Cp data-uid=\"dIS16N9n\" data-time=\"1745376999562\">日本でも江戸時代、草花の抽出液で作られた「爪紅（つまべに）」が用いられ、特に上流階級の女性たちのあいだで、繊細な美の表現として親しまれていたようです。\u003C\u002Fp>\u003Cp data-uid=\"c5NAiNx9\" data-time=\"1745377128194\">こうした指先の手入れは、長い時を経て、時代や文化を超えて今に続いています。\u003C\u002Fp>\u003Cp data-uid=\"4RxtVVJt\" data-time=\"1745376999562\">ただの贅沢や装飾にとどまらず、爪に触れ、整えるという行為そのものに、どこか人の心を惹きつける「なにか」があるのかもしれません。\u003C\u002Fp>\u003Cp data-uid=\"1UOalsoM\" data-time=\"1745377132010\">\u003C\u002Fp>\u003Cp data-uid=\"0aDgRzsc\" data-time=\"1745392616433\">東條汀留がネイルの世界に足を踏み入れたのは、会社員として働いていた頃のこと。\u003C\u002Fp>\u003Cp data-uid=\"MiHO2k7O\" data-time=\"1745392616433\">自身がメイクをするようになり、ヘアメイクの仕事に憧れを抱くようになります。そんな折、通っていた美容室のオーナーから声をかけられたのが、転機となりました。\u003C\u002Fp>\u003Cp data-uid=\"esz9kj1C\" data-time=\"1745392623188\">まだ「マニキュアリスト」という職業が一般的ではなかった時代。\u003C\u002Fp>\u003Cp data-uid=\"pFbG_6Qh\" data-time=\"1745392623188\">最初は「ネイルカラーくらい誰でも塗れる」と軽く考えていた東條でしたが、やがてその奥深さに引き込まれていきます。まっすぐにカラーを塗ることの難しさ、美しさを引き出す繊細なケアの手技に魅了され、探求心を原動力に日々練習を重ねました。\u003C\u002Fp>\u003Cp data-uid=\"32AqHU9f\" data-time=\"1745392627722\">\u003C\u002Fp>\u003Cp data-uid=\"DKFYyvro\" data-time=\"1745377281460\">その後、師であるアン山崎氏が六本木の美容室内にサロンを構えると、東條もマニキュアリストとして勤務を開始。顧客の多くは富裕層のマダムや芸能人が中心でしたが、東條は独自のスタイルを追求し、ネイルケアの本質と向き合っていきます。\u003C\u002Fp>\u003Cp data-uid=\"QBOtxAWU\" data-time=\"1745392648277\">甘皮は切らずに、必要のないルーズスキンだけを丁寧に取り除き、自然なカーブが生まれるように爪の形を整える——\u003Cstrong>「ラウンドスクエア」\u003C\u002Fstrong>と呼ばれる独自のフォルムにこだわりました。\u003C\u002Fp>\u003Cp data-uid=\"LRE16evj\" data-time=\"1745392660441\">適切なケアと定期的なお手入れの積み重ねが、健康で美しい爪を育てると確信していたからです。これが、\u003Cstrong>“ロングルアージュ スタイル”\u003C\u002Fstrong>のネイルケアの原点です。\u003C\u002Fp>\u003Cp data-uid=\"PVXdlypC\" data-time=\"1745376999562\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"B1oLxd6M\" data-time=\"1745376999562\">ある日、テレビで目にしたドキュメンタリー番組。乳がんの手術を終えたばかりの女性が「今一番したいことは何か」と問われ、「爪のお手入れをして、ネイルカラーを塗りたい」と答えていました。\u003C\u002Fp>\u003Cp data-uid=\"wzuAZl8x\" data-time=\"1745377276699\">その姿に、東條は深く心を動かされます。髪が「女の命」と言われるように、爪もまた、女性にとって大切な存在なのだと。爪を手入れするという行為は、自分を慈しみ、尊ぶこと。その想いは、ロングルアージュの原点として今も息づいています。\u003C\u002Fp>\u003Cp data-uid=\"QDWvEBXR\" data-time=\"1745377254414\">\u003C\u002Fp>\u003Ch1 data-uid=\"z5jLEtZX\" data-time=\"1745392965093\" id=\"index_z5jLEtZX\">\u003Cstrong>第二章　爪は十人十色\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"RnW4wU27\" data-time=\"1745392691111\">東條には、これまでのキャリアの中で忘れられないお客様が三人います。いずれも先天的な要因や強いストレスによって、深刻な爪のトラブルを抱えていらっしゃいました。\u003C\u002Fp>\u003Cp data-uid=\"n5Xs9hDN\" data-time=\"1745376999562\">その出会いが、東條に「この仕事は必要とされている」と確信させ、マニキュアリストとして生きていく覚悟を決めさせたのです。\u003C\u002Fp>\u003Cp data-uid=\"HpkCj_Xn\" data-time=\"1745376999562\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"qsE_Cynv\" data-time=\"1745376999562\">それは、まだ駆け出しの頃のことでした。\u003C\u002Fp>\u003Cp data-uid=\"HwKKGvT3\" data-time=\"1745376999562\">ある日、一本の電話がサロンにかかってきます。発信者は男性。「深爪をしすぎて、爪がほとんどなくなってしまったのですが、治りますか」との問いでした。\u003C\u002Fp>\u003Cp data-uid=\"9tJMtVeN\" data-time=\"1745377291184\">実際にお会いしてみると、潔癖症の傾向があるそのお客様は、白い部分が少しでも見えるとすぐに爪を切ってしまい、爪の長さはわずか1ミリほどに。皮膚が硬く盛り上がり、爪の代わりのような状態になっていたため、自爪が伸びにくくなっていたのです。\u003C\u002Fp>\u003Cp data-uid=\"1q_XcHRc\" data-time=\"1745392746238\">爪には、指先を保護し、力を込める支点となる大切な役割があります。爪があるからこそ物をつかみやすく、力の加減ができ、細やかな作業も可能になるのです。東條は健康な爪を取り戻してもらうべく、付け爪での補強を続けながら、丁寧にネイルケアを施していきました。\u003C\u002Fp>\u003Cp data-uid=\"0XL1SNYe\" data-time=\"1745377297134\">爪をつくる“爪母（そうぼ）”が傷ついていなければ、適切なケアによって再び健康な爪は育ちます。そのためには、甘皮周辺のケアが欠かせません。東條は根気よく施術を重ね、1年が経つ頃には、見違えるような自爪が生えてきました。\u003C\u002Fp>\u003Cp data-uid=\"xqn1rV9q\" data-time=\"1745377348084\">\u003C\u002Fp>\u003Cp data-uid=\"_oU2v_hu\" data-time=\"1745377303997\">二人目のお客様は、爪がすべて黒ずみ、短く小さくなってしまっている女性でした。\u003C\u002Fp>\u003Cp data-uid=\"Py1PMnTP\" data-time=\"1745376999563\">「どこへ行っても視線が爪に集まるのが恥ずかしくて、外食をしたことがないんです」\u003C\u002Fp>\u003Cp data-uid=\"zx8K8RDr\" data-time=\"1745377418689\">彼女のその言葉に、東條は心を動かされました。付け爪で丁寧に整え、鮮やかな赤いネイルカラーを施すと、彼女は晴れやかな表情で帰っていかれました。\u003C\u002Fp>\u003Cp data-uid=\"cNRJ7vum\" data-time=\"1745377435950\">けれど、翌朝になって、付け爪がすべて外れていたという連絡が入ります。原因は、就寝中に無意識で爪を噛んでしまう癖。深いストレスが積み重なり、爪の黒ずみへとつながっていたのです。\u003C\u002Fp>\u003Cp data-uid=\"_xrMYzgN\" data-time=\"1745377396533\">\u003C\u002Fp>\u003Cp data-uid=\"wKabQd69\" data-time=\"1745376999563\">&nbsp;三人目のお客様は、先天性の皮膚疾患によって、ほとんどすべての指に爪がない状態でした。\u003C\u002Fp>\u003Cp data-uid=\"14Fg6hcf\" data-time=\"1745377461515\">医師を目指して勉学に励むなか、インターンで患者さんと接することになるため、「どうにか爪を整えてほしい」と相談を受けたのです。病気の特性から、皮膚に直接触れることができず、施術は非常に繊細で困難なものでしたが、丁寧なケアを重ね、次第に自然な美しさを取り戻していきました。\u003C\u002Fp>\u003Cp data-uid=\"2ry0kRUu\" data-time=\"1745376999563\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"8KSoEERf\" data-time=\"1745377468789\">この三人に共通するのは、\u003Cstrong>「ネイルケアを継続すること」\u003C\u002Fstrong>によって好結果を生むことができたということです。\u003C\u002Fp>\u003Cp data-uid=\"FPQVOOkJ\" data-time=\"1745392783683\">ネイルサロンは、美しい爪を持つ人のための場所。そう思っている方は、少なくありません。けれど東條は、むしろ悩みや不安を抱えた方にこそ訪れてほしいと考えています。\u003C\u002Fp>\u003Cp data-uid=\"dBpsRCeR\" data-time=\"1745376999563\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wVxBlEKz\" data-time=\"1745393012061\">東條にとって、ネイルケアとは単なる“美容”ではありません。\u003C\u002Fp>\u003Cp data-uid=\"N7JeSTI0\" data-time=\"1745393012061\">健康な爪を育てること。そしてその人らしい美しさを引き出すこと。それが、マニキュアリストとしての使命だと信じています。\u003C\u002Fp>\u003Cp data-uid=\"qTUiKelM\" data-time=\"1745393008229\">爪のことで悩んでいる方に寄り添い、日常の中で見過ごされがちな“指先”に目を向けるきっかけを届けたい。東條の想いは、今も変わらず、ロングルアージュサロンでのすべての施術に込められています。\u003Cbr>\u003C\u002Fp>\u003Ch1 data-uid=\"CHYPE5iV\" data-time=\"1745392970498\" id=\"index_CHYPE5iV\">\u003Cstrong>第三章：静かな贅沢、美しい習慣\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"HEDWtyRu\" data-time=\"1745393018084\">野に咲く花を見て「美しい」と感じるのは、その人の“感性”によるもの。美容の世界でも、感性は重要視されます。「美しければ、それでいい」という結果重視の考え方もあります。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"THm5_kM_\" data-time=\"1745376999563\">けれど、東條はそうは思いませんでした。\u003C\u002Fp>\u003Cp data-uid=\"NpqKYuy5\" data-time=\"1745393025029\">大切にしているのは、\u003Cstrong>感性だけに頼らない、「美爪の法則」\u003C\u002Fstrong>。それは理論に基づいた技術によって叶えられるものです。\u003C\u002Fp>\u003Cp data-uid=\"6qnNQBWS\" data-time=\"1745377660421\">\u003C\u002Fp>\u003Cp data-uid=\"SP0UwWnZ\" data-time=\"1745376999563\">ロングルアージュのサロンでは、その法則を丁寧に実践し、すべての爪に向き合っています。\u003C\u002Fp>\u003Cp data-uid=\"868UOoEh\" data-time=\"1745377701507\">ネイルケアは、今の美しさだけでなく、これからの健やかさを育むもの。その確かな積み重ねこそが、真の美しさを生み出すのだと信じています。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"QO96Uc5d\" data-time=\"1745376999563\">朝、顔を洗ってスキンケアをするように。\u003C\u002Fp>\u003Cp data-uid=\"klVu7002\" data-time=\"1745376999563\">髪を整えて、歯を磨くように。\u003C\u002Fp>\u003Cp data-uid=\"Hpj3wu2T\" data-time=\"1745377728227\">爪先に意識を向けることも、自分自身を慈しむ小さな習慣のひとつです。それは誰かの目を意識したものではなく、自分のために行う静かな行為。\u003C\u002Fp>\u003Cp data-uid=\"l2tfqd0p\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"2B_2bt8M\" data-time=\"1745376999564\">ほんの少しの手間を惜しまず、時間をかけて育てる爪には、その人ならではの品格と静かな輝きが宿ります。\u003C\u002Fp>\u003Cp data-uid=\"TXmOjzcF\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"dol4MIMt\" data-time=\"1745376999564\">爪は、年齢や生活環境によって少しずつ変化していくもの。だからこそ、焦らずに、丁寧に、じっくりと付き合っていくことが大切です。たとえ目立たなくても、日々のケアの積み重ねは、確実に爪に表れてきます。\u003C\u002Fp>\u003Cp data-uid=\"8myVwjqV\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"fv4aNfl3\" data-time=\"1745376999564\">ロングルアージュのネイルケアは、単なる装飾ではありません。\u003C\u002Fp>\u003Cp data-uid=\"Ck91xlEE\" data-time=\"1745376999564\">それは、健やかな美しさを育むための、静かで上質な習慣です。\u003C\u002Fp>\u003Cp data-uid=\"WlxLRRQ7\" data-time=\"1745376999564\">この習慣が、心の余裕や静かな自信へとつながっていく——私たちはそう信じています。\u003C\u002Fp>\u003Cp data-uid=\"M6MRywLv\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"rBP1_DJO\" data-time=\"1745376999564\">今日も、そしてこれからも。\u003C\u002Fp>\u003Cp data-uid=\"faXpAx60\" data-time=\"1745376999564\">指先に触れるたびに、自分を慈しむ気持ちがそっと芽生えるように。\u003C\u002Fp>\u003Cp data-uid=\"37nTeWVP\" data-time=\"1745376999564\">ロングルアージュは、その一瞬一瞬を大切にネイルケアを届けていきます。&nbsp;\u003C\u002Fp>",{"project":95,"publishedAt":96,"createdAt":97,"order":65,"publishType":33,"schema":98,"uid":99,"updatedAt":100},{"id":29},["Date","2025-04-23T07:24:27.000Z"],["Date","2025-04-23T02:54:46.000Z"],{"id":35,"key":36,"postType":37},"dJMAgZ0Y",["Date","2025-05-28T06:02:23.000Z"],[41,102,103],"ScKXlWON:_IMDqL0M","sB0E_NRW:rJ4FL36x","URwhfikJEXFpG6tqRI2s","\u003Cp data-uid=\"5I_NLhDb\" data-time=\"1743412410143\">美しい爪を育てることは、単に手元を整えることにとどまりません。それは「指先の動きまでも美しくする」 という、大きな影響をもたらします。\u003C\u002Fp>\u003Cp data-uid=\"uE_P_lZg\" data-time=\"1743412435126\">&nbsp;たとえば、名刺を差し出すとき、グラスを持つとき、スマートフォンを操作するとき\u003C\u002Fp>\u003Cp data-uid=\"eMnxALKG\" data-time=\"1743411839586\">——日常の何気ない仕草も、指先の動きが洗練されることで、その人の印象はぐっと上品に映ります。\u003C\u002Fp>\u003Cp data-uid=\"yA_x6EzG\" data-time=\"1743411809125\">&nbsp;私たちは\u003Cstrong>「指先ひとつに品格が宿る」\u003C\u002Fstrong>と考えています。\u003C\u002Fp>\u003Cp data-uid=\"nxTweO53\" data-time=\"1743411473423\">爪が整っていると、自然と指先の動きにも意識が向かい、所作に気を配るようになります。それは、単なる身だしなみを超えた「美意識のあり方」そのもの。\u003C\u002Fp>\u003Cp data-uid=\"JikNTErm\" data-time=\"1743412228349\">&nbsp;\u003Cstrong>&nbsp;ロングルアージュのネイルケアが目指すのは、爪そのものを美しく健康に育てること。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"leae7dxf\" data-time=\"1743411473423\">それと同時に、指先に意識を向けることで、しなやかで洗練された動作が生まれ、仕草も変わり、立ち居振る舞いまでも美しくなる＿そんな本質的な美しさを引き出すことにつながります。\u003C\u002Fp>\u003Cp data-uid=\"Op5yJZle\" data-time=\"1743411855864\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"c50_UvfX\" data-time=\"1743411855864\">\u003Cstrong>爪を整えることは、自分自身を整えること。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"W96kSxSH\" data-time=\"1743411473424\">日常の所作を優雅に、美しく変える第一歩を指先からはじめてみませんか。\u003C\u002Fp>",{"project":107,"publishedAt":108,"createdAt":109,"order":65,"publishType":33,"schema":110,"uid":111,"updatedAt":112},{"id":29},["Date","2025-04-01T00:00:00.000Z"],["Date","2025-03-31T08:57:38.000Z"],{"id":35,"key":36,"postType":37},"_IMDqL0M",["Date","2025-05-28T06:02:07.000Z"],[41,114,115],"ScKXlWON:OhHjKylG","sB0E_NRW:dJMAgZ0Y","6NRjJybfe3C2qj9oMJSi",{"project":118,"publishedAt":119,"createdAt":120,"order":51,"publishType":33,"schema":121,"uid":53,"updatedAt":122},{"id":29},["Date","2025-03-04T15:15:00.000Z"],["Date","2025-02-22T15:15:05.000Z"],{"id":35,"key":36,"postType":37},["Date","2025-03-31T09:15:31.000Z"],[56,57,58],["Reactive",125],{},["Set"],["ShallowReactive",128],{"dynamicDatacolumn\u002Fposts\u002Fcolumn_03":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn_03",["Reactive",132],{"cmsContentStore":133,"projectStore":137,"productStore":159,"pageHeadStore":702,"cmsStore":706,"useSnackBarStore":714},{"listContentsMap":134,"contentMap":135},["Map"],["Map",136,4],"SLmv5Xy5\u002Fcolumn_03",{"siteHost":138,"customProxyDomain":139,"project":140},"longleage.co.jp","",{"id":141,"name":142,"customDomain":139,"iconImage":139,"coverImage":143,"displayBadge":144,"integrations":145,"snapshot_path":157,"snapshot_id":158,"recaptchaSiteKey":-1,"conversionEvents":-1},"xPORdZvpar","ロングルアージュ","https:\u002F\u002Fstorage.g
