asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_9f494d39-862b-424b-a088-d01781b50e0b.png","なぜ、私たちは商品を作るのか　Vol.1 ネイルケアとスキンケア、その原点","なぜ、私たちは商品を作るのか\u003Cbr>Vol.1 ネイルケアとスキンケア、その原点",{"id":10,"title":11},"\u003Cp data-uid=\"Z4HLZbSA\" data-time=\"1778832462660\">ネイルケアは、おしゃれのためだけのものだと思われがちです。\u003C\u002Fp>\u003Cp data-uid=\"UvSlrIds\" data-time=\"1778832462660\">けれどロングルアージュが考えるネイルケアは、もっと日常に近いもの。\u003C\u002Fp>\u003Cp data-uid=\"vNDk1GRI\" data-time=\"1778832493762\">身だしなみの一部でありながら、ふとした瞬間に、自分に少しの自信や余裕を与えてくれるものだと考えています。\u003C\u002Fp>\u003Cp data-uid=\"5ml7evQL\" data-time=\"1778832496915\">\u003C\u002Fp>\u003Cp data-uid=\"9tzZ75DE\" data-time=\"1778832496142\">私たちは、ネイルケアをしていない爪に、色を塗ることはありません。\u003C\u002Fp>\u003Cp data-uid=\"5NRAu0Pc\" data-time=\"1778832514784\">どんな色もどんなデザインも、土台が整っていてこそ、美しく、心地よく楽しめる。\u003C\u002Fp>\u003Cp data-uid=\"_ut9eNZ5\" data-time=\"1778831233104\">それが、長く爪と向き合ってきた私たちの結論です。\u003C\u002Fp>\u003Cp data-uid=\"aQj3B3q0\" data-time=\"1778832524896\">\u003C\u002Fp>\u003Cp data-uid=\"3S7YVkoN\" data-time=\"1778832535002\">そしてこの\u003Cstrong>「土台を整える」\u003C\u002Fstrong>という考え方は、ネイルケアだけでなく、スキンケアにも共通するものでした。\u003C\u002Fp>",{"project":25,"publishedAt":27,"createdAt":28,"order":29,"publishType":30,"schema":31,"uid":35,"updatedAt":36},{"id":26},"xhNigFsLJyPJZwwHDZ5N",["Date","2026-05-15T08:10:48.000Z"],["Date","2026-05-15T07:47:13.000Z"],-1,"change",{"id":32,"key":33,"postType":34},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","zdyVNTZ3",["Date","2026-05-29T07:21:28.000Z"],[38,39,40],"S2EU8djY:skaeleJ7","ScKXlWON:LinvCeG7","sB0E_NRW:_b6L6F13","b1RxrxFdcOILKT1887i1",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":43,"body":44,"_meta":45,"_filter":52,"id":55},{"id":10,"title":11},"\u003Cp data-uid=\"R0BV1pA9\" data-time=\"1779263072330\">化粧水は、顔のためだけのものではありません。\u003C\u002Fp>\u003Cp data-uid=\"waRtiGLg\" data-time=\"1779263877536\">手指、腕、ボディ。ネイルサロンは、誰よりも「肌」に触れる場所です。\u003C\u002Fp>\u003Cp data-uid=\"KFxPo4EE\" data-time=\"1779263244808\">施術中、私たちは常に乾燥した手肌や、敏感に揺らぎやすい肌と向き合ってきました。\u003C\u002Fp>\u003Cp data-uid=\"9G7N_tNX\" data-time=\"1779263891857\">\u003C\u002Fp>\u003Cp data-uid=\"yG_Il_KJ\" data-time=\"1779263938952\">だからこそ求めたのは、さらりと水のように\u003Cstrong>軽やかで、べたつかない\u003C\u002Fstrong>こと。\u003C\u002Fp>\u003Cp data-uid=\"JiunAwrv\" data-time=\"1779263933522\">施術の邪魔にならず、\u003Cstrong>毎日心地よく\u003C\u002Fstrong>使えること。\u003C\u002Fp>\u003Cp data-uid=\"lVaHIryE\" data-time=\"1779263930943\">そして、華やかさよりも\u003Cstrong>安心して使い続けられる\u003C\u002Fstrong>ことでした。\u003C\u002Fp>\u003Cp data-uid=\"vUc_2S6f\" data-time=\"1779263310250\">\u003C\u002Fp>\u003Cp data-uid=\"WeqNvgtL\" data-time=\"1779263340307\">肌に必要なものだけを、まっすぐ届ける。\u003C\u002Fp>\u003Cp data-uid=\"XqUa6Ex1\" data-time=\"1779263964975\">その考えをを突き詰めた結果、ロングルアージュのスキンケアは、極めて\u003Cstrong>シンプルな処方\u003C\u002Fstrong>に行き着きました。\u003C\u002Fp>\u003Cp data-uid=\"qAtzDyTU\" data-time=\"1779263951882\">このスキンケアは、「ネイルサロンが化粧水を作った」のではなく、\u003Cstrong>ネイルケアを真剣に考え続けた結果、自然と必要になったもの\u003C\u002Fstrong>だったのです。\u003C\u002Fp>",{"project":46,"publishedAt":47,"createdAt":48,"order":29,"publishType":30,"schema":49,"uid":50,"updatedAt":51},{"id":26},["Date","2026-06-26T01:00:00.000Z"],["Date","2026-05-20T07:43:20.000Z"],{"id":32,"key":33,"postType":34},"iLFHIDmy",["Date","2026-07-15T06:48:30.000Z"],[38,53,54],"ScKXlWON:_b6L6F13","sB0E_NRW:WiGiFnC8","MvbD7a5n0NCDfVcnqehW","\u003Cp data-uid=\"djnP4H8Y\" data-time=\"1779261901582\">ロングルアージュは、日々のサロンワークの中で、数えきれないほどのお客様の手に触れてきました。\u003C\u002Fp>\u003Cp data-uid=\"3dxgaIyP\" data-time=\"1779262023380\">ネイル施術に欠かせない工程のひとつが、\u003Cstrong>手指消毒\u003C\u002Fstrong>です。\u003C\u002Fp>\u003Cp data-uid=\"rHQz4S3p\" data-time=\"1779261912939\">\u003C\u002Fp>\u003Cp data-uid=\"4oKp46Jg\" data-time=\"1779262225995\">衛生を守るために必要不可欠なもの。けれど同時に、アルコールによる刺激や乾燥に悩まれるお客様、そして、日に何度も手指消毒を繰り返すスタッフの手荒れも、長年見過ごせない課題としてありました。\u003C\u002Fp>\u003Cp data-uid=\"Tp4sRZOD\" data-time=\"1779262246872\">「肌が弱い方にも、もっとやさしい方法はないだろうか」「清潔を保ちながら、うるおいを守ることはできないだろうか」\u003C\u002Fp>\u003Cp data-uid=\"mwCM8O9A\" data-time=\"1779262017476\">その問いから探し始めたのが、\u003Cstrong>“肌のための水\u003C\u002Fstrong>”でした。\u003C\u002Fp>\u003Cp data-uid=\"UUIbeCLR\" data-time=\"1779262014387\">\u003C\u002Fp>\u003Cp data-uid=\"SYzKrgAY\" data-time=\"1779262093987\">さらりとして、べたつかないこと。\u003C\u002Fp>\u003Cp data-uid=\"8qN0xN2e\" data-time=\"1779262119012\">施術の邪魔にならず、毎日心地よく使えること。\u003C\u002Fp>\u003Cp data-uid=\"HHYcrSDq\" data-time=\"1779262141726\">そして、乾燥しやすい手肌に、やさしく寄り添えること。\u003C\u002Fp>\u003Cp data-uid=\"iv_8gEZt\" data-time=\"1779262144754\">\u003C\u002Fp>\u003Cp data-uid=\"WLe689xm\" data-time=\"1779262285232\">ネイルケアを真剣に考え続ける中で、自然とたどり着いたのが、\u003Cstrong>スキンケア\u003C\u002Fstrong>という存在でした。\u003C\u002Fp>\u003Cp data-uid=\"IpzltWU8\" data-time=\"1779262290005\">こうして生まれたのが、プロトンイオン水をベースにした、\u003Cstrong>ロングルアージュの化粧水\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":58,"publishedAt":59,"createdAt":60,"order":29,"publishType":30,"schema":61,"uid":62,"updatedAt":63},{"id":26},["Date","2026-06-05T01:00:00.000Z"],["Date","2026-05-20T07:22:56.000Z"],{"id":32,"key":33,"postType":34},"_b6L6F13",["Date","2026-06-25T06:22:51.000Z"],[65,38,66],"ScKXlWON:zdyVNTZ3","sB0E_NRW:iLFHIDmy","4SVDfRuOn5v7G1rWvNza",{"slug":69,"cover":70,"title":71,"OkocjktT":71,"S2EU8djY":72,"ScKXlWON":73,"sB0E_NRW":82,"body":99,"_meta":100,"_filter":107,"id":110},"column21","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_eef9ef6d-e3b5-4386-bca8-ac6ed6d1bd25.png","Vol.4 爪も、肌も、「主役」はその人自身",{"id":10,"title":11},{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":74,"body":44,"_meta":75,"_filter":81,"id":55},{"id":10,"title":11},{"project":76,"publishedAt":77,"createdAt":78,"order":29,"publishType":30,"schema":79,"uid":50,"updatedAt":80},{"id":26},["Date","2026-06-26T01:00:00.000Z"],["Date","2026-05-20T07:43:20.000Z"],{"id":32,"key":33,"postType":34},["Date","2026-07-15T06:48:30.000Z"],[38,53,54],{"slug":83,"cover":84,"title":85,"OkocjktT":85,"S2EU8djY":86,"body":87,"_meta":88,"_filter":96,"id":98},"column22","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a558eb23-2723-47f0-a351-0ee0509dc809.png","vol.5 サロンの中で終わらせたくなかった、私たちのネイルケア",{"id":10,"title":11},"\u003Cp data-uid=\"r4vc4hJY\" data-time=\"1786593655363\">ネイルケアも、スキンケアも、一度で劇的に変わるものではありません。\u003C\u002Fp>\u003Cp data-uid=\"o6OHqs6w\" data-time=\"1786593659553\">\u003C\u002Fp>\u003Cp data-uid=\"mm_SYYfS\" data-time=\"1786594590273\">ネイルケアの理想的なお手入れの周期は、1週間から10日。けれど、そのペースですべての方がサロンに通えるわけではないことも、私たちはよく知っています。\u003C\u002Fp>\u003Cp data-uid=\"7lxS6Eq2\" data-time=\"1786593669058\">\u003C\u002Fp>\u003Cp data-uid=\"b2aYzwDJ\" data-time=\"1786594873584\">だからこそ、\u003Cstrong>次にお会いするまでの時間を、どう過ごしていただくか。\u003C\u002Fstrong>ご自宅で、何を使っていただくべきか。\u003C\u002Fp>\u003Cp data-uid=\"6yk_8WNI\" data-time=\"1786672002624\">\u003C\u002Fp>\u003Cp data-uid=\"QnazRaOp\" data-time=\"1786672005181\">日々、多くのお客様の手と爪、肌に触れてきた中で、その問いは自然と積み重なっていきました\u003Cstrong>。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"DlW18FYk\" data-time=\"1786671670526\">\u003C\u002Fp>\u003Cp data-uid=\"dvKChwGO\" data-time=\"1786671672666\">もともとロングルアージュは、\u003Cstrong>”技術集団”\u003C\u002Fstrong>であることに誇りを持ってきました。\u003C\u002Fp>\u003Cp data-uid=\"UhFIOoA_\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"lYt2R7W4\" data-time=\"1786671672664\">爪の状態を見極め、数あるアイテムの中からその方に合うものを選び、確かな技術で健やかな自爪へと導いていく。\u003C\u002Fp>\u003Cp data-uid=\"PcIC40pO\" data-time=\"1786671672664\">だからこそ、自社商品を持たなくてもいいと考えていた時期もあります。\u003C\u002Fp>\u003Cp data-uid=\"ecgdsvK1\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"7nve8EDC\" data-time=\"1786672062222\">けれどお客様から聞こえてきたのは、「何を使えばいいかわからない」「これで本当に合っているのか不安」という声でした。\u003C\u002Fp>\u003Cp data-uid=\"HVlgbO3k\" data-time=\"1786671672664\">\u003C\u002Fp>\u003Cp data-uid=\"HeBAx869\" data-time=\"1786672088740\">サロンで整えたその先も、健やかで美しい状態を育てていくために。\u003C\u002Fp>\u003Cp data-uid=\"cCOLOG_2\" data-time=\"1786671672664\">プロとして、責任をもって\u003Cstrong>「これを使ってください」\u003C\u002Fstrong>と言えるものは何か。\u003C\u002Fp>\u003Cp data-uid=\"tSICXmeu\" data-time=\"1786672103352\">\u003C\u002Fp>\u003Cp data-uid=\"lbL1p0UM\" data-time=\"1786671672664\">そう考えたとき、やはり、私たち自身が作るべきだと思うようになったのです。\u003C\u002Fp>",{"project":89,"publishedAt":90,"createdAt":91,"order":29,"publishType":92,"schema":93,"uid":94,"updatedAt":95},{"id":26},["Date","2026-08-14T02:06:06.000Z"],["Date","2026-08-13T03:56:52.000Z"],"draft",{"id":32,"key":33,"postType":34},"g3_cDfG5",["Date","2026-08-14T01:52:40.000Z"],[38,97],"ScKXlWON:WiGiFnC8","mMqgeGa3Ek0jFbLvnA8e","\u003Cp data-uid=\"eHGkeZqi\" data-time=\"1784096603662\">薄い爪、割れやすい爪。乾燥、ささくれ。\u003C\u002Fp>\u003Cp data-uid=\"mWovjmRp\" data-time=\"1780040280943\">多くの方が、手元や肌に何かしらの悩みを抱えています。\u003C\u002Fp>\u003Cp data-uid=\"3PY0blt2\" data-time=\"1784096618106\">けれどロングルアージュが目指しているのは、悩みを隠すことでも、飾り立てることでもありません。\u003C\u002Fp>\u003Cp data-uid=\"1K53fbo5\" data-time=\"1780039978437\">\u003C\u002Fp>\u003Cp data-uid=\"XOUeGGbP\" data-time=\"1780040188111\">私たちが大切にしているのは、「\u003Cstrong>爪は、あくまで脇役。主役は、その人自身である。」\u003C\u002Fstrong>という考え方です。\u003C\u002Fp>\u003Cp data-uid=\"rkLAfbOS\" data-time=\"1780039960118\">\u003C\u002Fp>\u003Cp data-uid=\"pK8Cf7bs\" data-time=\"1780040206161\">だからこそ、目立たせることよりも、清潔感やその人らしい自然な美しさを大切にしてきました。それはネイルケアだけでなく、スキンケアにも共通する価値観です。\u003C\u002Fp>\u003Cp data-uid=\"uIqMy5EW\" data-time=\"1784096699080\">強い変化を与えることよりも、肌や爪が本来持つ力を妨げず、健やかな状態を支えること。\u003C\u002Fp>\u003Cp data-uid=\"XgoyURxG\" data-time=\"1780040072564\">\u003C\u002Fp>\u003Cp data-uid=\"2DVefVnY\" data-time=\"1784096677535\">爪も、肌も。\u003C\u002Fp>\u003Cp data-uid=\"qV7NrsX3\" data-time=\"1784096686588\">何かを足した状態ではなく、\u003Cstrong>整っていることそのものが美しい。\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp data-uid=\"CH2Q3eyh\" data-time=\"1780040113691\">私たちは、そう考えています。\u003C\u002Fp>",{"project":101,"publishedAt":102,"createdAt":103,"order":29,"publishType":30,"schema":104,"uid":105,"updatedAt":106},{"id":26},["Date","2026-07-16T15:00:00.000Z"],["Date","2026-05-29T07:30:35.000Z"],{"i
