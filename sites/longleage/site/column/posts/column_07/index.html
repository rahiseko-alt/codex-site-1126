02Fprojects\u002FxPORdZvpar\u002Fs-5343x5343_v-frms_webp_7cdd1dcd-6cdd-4aea-9255-7278b4e1e1d2.jpg","マニキュアリスト 東條汀留",{"id":10,"title":11},"\u003Cdiv data-type=\"table_of_contents\" data-uid=\"o7xWmAu3\" data-time=\"1745377029396\">\u003C\u002Fdiv>\u003Chr data-uid=\"zVYI3gzs\" data-time=\"1745377095310\">\u003Ch1 data-uid=\"7ODuuc6H\" data-time=\"1745392961026\" id=\"index_7ODuuc6H\">\u003Cstrong>第一章　爪を手入れするということは、自分を慈しむということ\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"pgAHKJJW\" data-time=\"1745377116963\">ネイルケアの歴史は、遥か紀元前3,000年の古代エジプトにまで遡ります。王族たちは、ヘナという植物の花の汁で爪を染め、装いの一部として指先を彩っていたといわれています。\u003C\u002Fp>\u003Cp data-uid=\"dIS16N9n\" data-time=\"1745376999562\">日本でも江戸時代、草花の抽出液で作られた「爪紅（つまべに）」が用いられ、特に上流階級の女性たちのあいだで、繊細な美の表現として親しまれていたようです。\u003C\u002Fp>\u003Cp data-uid=\"c5NAiNx9\" data-time=\"1745377128194\">こうした指先の手入れは、長い時を経て、時代や文化を超えて今に続いています。\u003C\u002Fp>\u003Cp data-uid=\"4RxtVVJt\" data-time=\"1745376999562\">ただの贅沢や装飾にとどまらず、爪に触れ、整えるという行為そのものに、どこか人の心を惹きつける「なにか」があるのかもしれません。\u003C\u002Fp>\u003Cp data-uid=\"1UOalsoM\" data-time=\"1745377132010\">\u003C\u002Fp>\u003Cp data-uid=\"0aDgRzsc\" data-time=\"1745392616433\">東條汀留がネイルの世界に足を踏み入れたのは、会社員として働いていた頃のこと。\u003C\u002Fp>\u003Cp data-uid=\"MiHO2k7O\" data-time=\"1745392616433\">自身がメイクをするようになり、ヘアメイクの仕事に憧れを抱くようになります。そんな折、通っていた美容室のオーナーから声をかけられたのが、転機となりました。\u003C\u002Fp>\u003Cp data-uid=\"esz9kj1C\" data-time=\"1745392623188\">まだ「マニキュアリスト」という職業が一般的ではなかった時代。\u003C\u002Fp>\u003Cp data-uid=\"pFbG_6Qh\" data-time=\"1745392623188\">最初は「ネイルカラーくらい誰でも塗れる」と軽く考えていた東條でしたが、やがてその奥深さに引き込まれていきます。まっすぐにカラーを塗ることの難しさ、美しさを引き出す繊細なケアの手技に魅了され、探求心を原動力に日々練習を重ねました。\u003C\u002Fp>\u003Cp data-uid=\"32AqHU9f\" data-time=\"1745392627722\">\u003C\u002Fp>\u003Cp data-uid=\"DKFYyvro\" data-time=\"1745377281460\">その後、師であるアン山崎氏が六本木の美容室内にサロンを構えると、東條もマニキュアリストとして勤務を開始。顧客の多くは富裕層のマダムや芸能人が中心でしたが、東條は独自のスタイルを追求し、ネイルケアの本質と向き合っていきます。\u003C\u002Fp>\u003Cp data-uid=\"QBOtxAWU\" data-time=\"1745392648277\">甘皮は切らずに、必要のないルーズスキンだけを丁寧に取り除き、自然なカーブが生まれるように爪の形を整える——\u003Cstrong>「ラウンドスクエア」\u003C\u002Fstrong>と呼ばれる独自のフォルムにこだわりました。\u003C\u002Fp>\u003Cp data-uid=\"LRE16evj\" data-time=\"1745392660441\">適切なケアと定期的なお手入れの積み重ねが、健康で美しい爪を育てると確信していたからです。これが、\u003Cstrong>“ロングルアージュ スタイル”\u003C\u002Fstrong>のネイルケアの原点です。\u003C\u002Fp>\u003Cp data-uid=\"PVXdlypC\" data-time=\"1745376999562\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"B1oLxd6M\" data-time=\"1745376999562\">ある日、テレビで目にしたドキュメンタリー番組。乳がんの手術を終えたばかりの女性が「今一番したいことは何か」と問われ、「爪のお手入れをして、ネイルカラーを塗りたい」と答えていました。\u003C\u002Fp>\u003Cp data-uid=\"wzuAZl8x\" data-time=\"1745377276699\">その姿に、東條は深く心を動かされます。髪が「女の命」と言われるように、爪もまた、女性にとって大切な存在なのだと。爪を手入れするという行為は、自分を慈しみ、尊ぶこと。その想いは、ロングルアージュの原点として今も息づいています。\u003C\u002Fp>\u003Cp data-uid=\"QDWvEBXR\" data-time=\"1745377254414\">\u003C\u002Fp>\u003Ch1 data-uid=\"z5jLEtZX\" data-time=\"1745392965093\" id=\"index_z5jLEtZX\">\u003Cstrong>第二章　爪は十人十色\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"RnW4wU27\" data-time=\"1745392691111\">東條には、これまでのキャリアの中で忘れられないお客様が三人います。いずれも先天的な要因や強いストレスによって、深刻な爪のトラブルを抱えていらっしゃいました。\u003C\u002Fp>\u003Cp data-uid=\"n5Xs9hDN\" data-time=\"1745376999562\">その出会いが、東條に「この仕事は必要とされている」と確信させ、マニキュアリストとして生きていく覚悟を決めさせたのです。\u003C\u002Fp>\u003Cp data-uid=\"HpkCj_Xn\" data-time=\"1745376999562\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"qsE_Cynv\" data-time=\"1745376999562\">それは、まだ駆け出しの頃のことでした。\u003C\u002Fp>\u003Cp data-uid=\"HwKKGvT3\" data-time=\"1745376999562\">ある日、一本の電話がサロンにかかってきます。発信者は男性。「深爪をしすぎて、爪がほとんどなくなってしまったのですが、治りますか」との問いでした。\u003C\u002Fp>\u003Cp data-uid=\"9tJMtVeN\" data-time=\"1745377291184\">実際にお会いしてみると、潔癖症の傾向があるそのお客様は、白い部分が少しでも見えるとすぐに爪を切ってしまい、爪の長さはわずか1ミリほどに。皮膚が硬く盛り上がり、爪の代わりのような状態になっていたため、自爪が伸びにくくなっていたのです。\u003C\u002Fp>\u003Cp data-uid=\"1q_XcHRc\" data-time=\"1745392746238\">爪には、指先を保護し、力を込める支点となる大切な役割があります。爪があるからこそ物をつかみやすく、力の加減ができ、細やかな作業も可能になるのです。東條は健康な爪を取り戻してもらうべく、付け爪での補強を続けながら、丁寧にネイルケアを施していきました。\u003C\u002Fp>\u003Cp data-uid=\"0XL1SNYe\" data-time=\"1745377297134\">爪をつくる“爪母（そうぼ）”が傷ついていなければ、適切なケアによって再び健康な爪は育ちます。そのためには、甘皮周辺のケアが欠かせません。東條は根気よく施術を重ね、1年が経つ頃には、見違えるような自爪が生えてきました。\u003C\u002Fp>\u003Cp data-uid=\"xqn1rV9q\" data-time=\"1745377348084\">\u003C\u002Fp>\u003Cp data-uid=\"_oU2v_hu\" data-time=\"1745377303997\">二人目のお客様は、爪がすべて黒ずみ、短く小さくなってしまっている女性でした。\u003C\u002Fp>\u003Cp data-uid=\"Py1PMnTP\" data-time=\"1745376999563\">「どこへ行っても視線が爪に集まるのが恥ずかしくて、外食をしたことがないんです」\u003C\u002Fp>\u003Cp data-uid=\"zx8K8RDr\" data-time=\"1745377418689\">彼女のその言葉に、東條は心を動かされました。付け爪で丁寧に整え、鮮やかな赤いネイルカラーを施すと、彼女は晴れやかな表情で帰っていかれました。\u003C\u002Fp>\u003Cp data-uid=\"cNRJ7vum\" data-time=\"1745377435950\">けれど、翌朝になって、付け爪がすべて外れていたという連絡が入ります。原因は、就寝中に無意識で爪を噛んでしまう癖。深いストレスが積み重なり、爪の黒ずみへとつながっていたのです。\u003C\u002Fp>\u003Cp data-uid=\"_xrMYzgN\" data-time=\"1745377396533\">\u003C\u002Fp>\u003Cp data-uid=\"wKabQd69\" data-time=\"1745376999563\">&nbsp;三人目のお客様は、先天性の皮膚疾患によって、ほとんどすべての指に爪がない状態でした。\u003C\u002Fp>\u003Cp data-uid=\"14Fg6hcf\" data-time=\"1745377461515\">医師を目指して勉学に励むなか、インターンで患者さんと接することになるため、「どうにか爪を整えてほしい」と相談を受けたのです。病気の特性から、皮膚に直接触れることができず、施術は非常に繊細で困難なものでしたが、丁寧なケアを重ね、次第に自然な美しさを取り戻していきました。\u003C\u002Fp>\u003Cp data-uid=\"2ry0kRUu\" data-time=\"1745376999563\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"8KSoEERf\" data-time=\"1745377468789\">この三人に共通するのは、\u003Cstrong>「ネイルケアを継続すること」\u003C\u002Fstrong>によって好結果を生むことができたということです。\u003C\u002Fp>\u003Cp data-uid=\"FPQVOOkJ\" data-time=\"1745392783683\">ネイルサロンは、美しい爪を持つ人のための場所。そう思っている方は、少なくありません。けれど東條は、むしろ悩みや不安を抱えた方にこそ訪れてほしいと考えています。\u003C\u002Fp>\u003Cp data-uid=\"dBpsRCeR\" data-time=\"1745376999563\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"wVxBlEKz\" data-time=\"1745393012061\">東條にとって、ネイルケアとは単なる“美容”ではありません。\u003C\u002Fp>\u003Cp data-uid=\"N7JeSTI0\" data-time=\"1745393012061\">健康な爪を育てること。そしてその人らしい美しさを引き出すこと。それが、マニキュアリストとしての使命だと信じています。\u003C\u002Fp>\u003Cp data-uid=\"qTUiKelM\" data-time=\"1745393008229\">爪のことで悩んでいる方に寄り添い、日常の中で見過ごされがちな“指先”に目を向けるきっかけを届けたい。東條の想いは、今も変わらず、ロングルアージュサロンでのすべての施術に込められています。\u003Cbr>\u003C\u002Fp>\u003Ch1 data-uid=\"CHYPE5iV\" data-time=\"1745392970498\" id=\"index_CHYPE5iV\">\u003Cstrong>第三章：静かな贅沢、美しい習慣\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"HEDWtyRu\" data-time=\"1745393018084\">野に咲く花を見て「美しい」と感じるのは、その人の“感性”によるもの。美容の世界でも、感性は重要視されます。「美しければ、それでいい」という結果重視の考え方もあります。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"THm5_kM_\" data-time=\"1745376999563\">けれど、東條はそうは思いませんでした。\u003C\u002Fp>\u003Cp data-uid=\"NpqKYuy5\" data-time=\"1745393025029\">大切にしているのは、\u003Cstrong>感性だけに頼らない、「美爪の法則」\u003C\u002Fstrong>。それは理論に基づいた技術によって叶えられるものです。\u003C\u002Fp>\u003Cp data-uid=\"6qnNQBWS\" data-time=\"1745377660421\">\u003C\u002Fp>\u003Cp data-uid=\"SP0UwWnZ\" data-time=\"1745376999563\">ロングルアージュのサロンでは、その法則を丁寧に実践し、すべての爪に向き合っています。\u003C\u002Fp>\u003Cp data-uid=\"868UOoEh\" data-time=\"1745377701507\">ネイルケアは、今の美しさだけでなく、これからの健やかさを育むもの。その確かな積み重ねこそが、真の美しさを生み出すのだと信じています。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"QO96Uc5d\" data-time=\"1745376999563\">朝、顔を洗ってスキンケアをするように。\u003C\u002Fp>\u003Cp data-uid=\"klVu7002\" data-time=\"1745376999563\">髪を整えて、歯を磨くように。\u003C\u002Fp>\u003Cp data-uid=\"Hpj3wu2T\" data-time=\"1745377728227\">爪先に意識を向けることも、自分自身を慈しむ小さな習慣のひとつです。それは誰かの目を意識したものではなく、自分のために行う静かな行為。\u003C\u002Fp>\u003Cp data-uid=\"l2tfqd0p\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"2B_2bt8M\" data-time=\"1745376999564\">ほんの少しの手間を惜しまず、時間をかけて育てる爪には、その人ならではの品格と静かな輝きが宿ります。\u003C\u002Fp>\u003Cp data-uid=\"TXmOjzcF\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"dol4MIMt\" data-time=\"1745376999564\">爪は、年齢や生活環境によって少しずつ変化していくもの。だからこそ、焦らずに、丁寧に、じっくりと付き合っていくことが大切です。たとえ目立たなくても、日々のケアの積み重ねは、確実に爪に表れてきます。\u003C\u002Fp>\u003Cp data-uid=\"8myVwjqV\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"fv4aNfl3\" data-time=\"1745376999564\">ロングルアージュのネイルケアは、単なる装飾ではありません。\u003C\u002Fp>\u003Cp data-uid=\"Ck91xlEE\" data-time=\"1745376999564\">それは、健やかな美しさを育むための、静かで上質な習慣です。\u003C\u002Fp>\u003Cp data-uid=\"WlxLRRQ7\" data-time=\"1745376999564\">この習慣が、心の余裕や静かな自信へとつながっていく——私たちはそう信じています。\u003C\u002Fp>\u003Cp data-uid=\"M6MRywLv\" data-time=\"1745376999564\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"rBP1_DJO\" data-time=\"1745376999564\">今日も、そしてこれからも。\u003C\u002Fp>\u003Cp data-uid=\"faXpAx60\" data-time=\"1745376999564\">指先に触れるたびに、自分を慈しむ気持ちがそっと芽生えるように。\u003C\u002Fp>\u003Cp data-uid=\"37nTeWVP\" data-time=\"1745376999564\">ロングルアージュは、その一瞬一瞬を大切にネイルケアを届けていきます。&nbsp;\u003C\u002Fp>",{"project":27,"publishedAt":29,"createdAt":30,"order":31,"publishType":32,"schema":33,"uid":37,"updatedAt":38},{"id":28},"xhNigFsLJyPJZwwHDZ5N",["Date","2025-04-23T07:24:27.000Z"],["Date","2025-04-23T02:54:46.000Z"],-1,"change",{"id":34,"key":35,"postType":36},"2n1ZV7dLF872grtbJITr","SLmv5Xy5","post","dJMAgZ0Y",["Date","2025-05-28T06:02:23.000Z"],[40,41,42],"S2EU8djY:hm0DQq4I","ScKXlWON:_IMDqL0M","sB0E_NRW:rJ4FL36x","URwhfikJEXFpG6tqRI2s",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":45,"body":46,"_meta":47,"_filter":54,"id":57},{"id":10,"title":11},"\u003Cp data-uid=\"yMtUJXjS\" data-time=\"1750837026196\">ネイル＝カラーやデザイン。そう思っている方は、まだまだ多いかもしれません。でも、ロングルアージュが何より大切にしているのは、「\u003Cstrong>爪そのもの」\u003C\u002Fstrong>を美しく育てること。\u003C\u002Fp>\u003Cp data-uid=\"DddnsyNx\" data-time=\"1748412937655\">私たちは、爪は髪や肌と同じように&nbsp;\u003Cstrong>自分自身の一部\u003C\u002Fstrong>として、もっと丁寧に、もっと日常的にケアされるべき存在だと考えています。\u003C\u002Fp>\u003Cp data-uid=\"UlVv5llf\" data-time=\"1750837031180\">\u003C\u002Fp>\u003Ch1 data-uid=\"1YeuPFkJ\" data-time=\"1748412937655\" id=\"index_1YeuPFkJ\">\u003Cstrong>「健康な自爪」という土台があるからこそ、色も輝く。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"S1mVKymn\" data-time=\"1748411849130\">&nbsp;爪が乾燥していたり、薄く割れやすくなっていたり。そんな状態では、どんなに美しいカラーを重ねても持ちが悪く、せっかくのおしゃれも台無しに。\u003C\u002Fp>\u003Cp data-uid=\"eKCiofwv\" data-time=\"1748411508034\">でも逆に言えば、自爪が整っていれば、それだけで手元の印象は見違えるほど洗練される。\u003C\u002Fp>\u003Cp data-uid=\"j620LnpL\" data-time=\"1748411939150\">爪の形を整えて、甘皮をケアし、ベースコートだけを軽くひと塗り。それだけでも、手元はぐっと上品に、どこか凛とした空気をまといます。\u003C\u002Fp>\u003Cp data-uid=\"1O9JFiYp\" data-time=\"1750837039537\">\u003C\u002Fp>\u003Ch1 data-uid=\"Yxjv4EIG\" data-time=\"1748411521340\" id=\"index_Yxjv4EIG\">\u003Cstrong>飾るよりも、仕立てる。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"S5a6zhgG\" data-time=\"1750837101130\">「ネイル＝ファッションの一部」「色やパーツで飾るもの」という傾向が強まる中で、爪が傷んでしまっている方を多く見かけるようになりました。でも本来、ネイルのおしゃれは\u003Cstrong>大人のたしなみ\u003C\u002Fstrong>のひとつ。アクセサリーではなく、\u003Cstrong>素の美しさ\u003C\u002Fstrong>を育てる習慣なのだと、私たちは信じています。\u003C\u002Fp>\u003Cp data-uid=\"0BanQn1e\" data-time=\"1750837091547\">爪・肌・髪——&nbsp; &nbsp;自分の体の一部を、日々のケアで美しく仕立てていく。それはきっと、一番贅沢で、誇るべき美しさなのではないでしょうか。\u003C\u002Fp>\u003Cp data-uid=\"CSb115BD\" data-time=\"1750837046530\">\u003C\u002Fp>\u003Ch1 data-uid=\"JVRGZktw\" data-time=\"1748411567917\" id=\"index_JVRGZktw\">\u003Cstrong>爪を整えることは、仕草を整えること。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"tRZ2HvFn\" data-time=\"1750837056314\">自爪に自信があるだけで、コーヒーカップを持つ手、書類を渡す指先に、もう視線を気にすることはありません。手元が美しいと、動きにも自然と品が宿ります。奥ゆかしさや所作の美しさに対する美意識は、きっと日本人のDNAの中にあるもの。\u003C\u002Fp>\u003Cp data-uid=\"fmbOaTPm\" data-time=\"1748411901127\">指先のケアは、仕草のケアでもある。そんなふうに感じています。\u003C\u002Fp>\u003Cp data-uid=\"yba5VrAv\" data-time=\"1750837057218\">\u003C\u002Fp>\u003Ch1 data-uid=\"LfdFZWR5\" data-time=\"1748412928808\" id=\"index_LfdFZWR5\">\u003Cstrong>まずは、1週間に一度の “整える” 習慣から。\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"u_OtrkaZ\" data-time=\"1750837061708\">週に1度、爪の長さを整える。甘皮を優しくケアし、うるおいを補う。それだけで、爪のコンディションは確実に変わっていきます。\u003C\u002Fp>\u003Cp data-uid=\"pHqA63M7\" data-time=\"1750837114941\">\u003C\u002Fp>\u003Cp data-uid=\"9XcUxXey\" data-time=\"1748409956968\">まずは、ケアから始めてみませんか。\u003C\u002Fp>\u003Cp data-uid=\"NF5Fpjh7\" data-time=\"1748411971617\">ネイルは、もっとケアでいい。そしてきっと、ケアだけでも美しい。\u003C\u002Fp>",{"project":48,"publishedAt":49,"createdAt":50,"order":31,"publishType":32,"schema":51,"uid":52,"updatedAt":53},{"id":28},["Date","2025-05-28T06:01:03.000Z"],["Date","2025-05-28T05:25:17.000Z"],{"id":34,"key":35,"postType":36},"ypIvIsFD",["Date","2025-06-25T07:38:35.000Z"],[40,55,56],"ScKXlWON:rJ4FL36x","sB0E_NRW:E_jW5YMS","SN8WKscTdGKEvIr7WnHz","\u003Cp data-uid=\"nq75KlbM\" data-time=\"1745394448142\">ロングルアージュはこれまでも、アートが持つ不思議なパワーに魅了されてきました。\u003C\u002Fp>\u003Cp data-uid=\"uyUBhg9Q\" data-time=\"1745394203645\">それは日常の中の非日常であったり、普段気づくことのない色使いや心地よさであったり、不安をもすっぽりと覆い隠す無限大の希望であったり。アートにはそんな五感全体をリラクゼーションさせ、あなたの心を癒すパワーがあります。\u003C\u002Fp>\u003Cp data-uid=\"0OVhp9RA\" data-time=\"1745394500383\">ネイルケアのひとときを、\u003Cstrong>より豊かに、より心地よく。\u003C\u002Fstrong>ご来店の際は、ぜひアートとの静かな対話もお楽しみください。\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"uUDwMCEW\" data-time=\"1745394476968\">\u003C\u002Fp>\u003Cp data-uid=\"xpKooIJC\" data-time=\"1745394516928\">この展示は、ヴィンテージ家具や工芸品、アート作品を扱う信頼のショップ〈Luca Scandinavia（ルカスカンジナビア）〉様のご協力のもと、季節や空間の表情に合わせて定期的に入れ替えを行っています。\u003C\u002Fp>\u003Cp data-uid=\"Tuow3wLk\" data-time=\"1745394192348\">ルカスカンジナビアは、コペンハーゲンを拠点に、デンマークをはじめとする北欧各地から厳選したアイテムを取り扱う専門店。長年のご縁もあり、ロングルアージュの美意識や空気感に寄り添ったセレクションを届けてくださっています。\u003C\u002Fp>\u003Cp data-uid=\"gXZ0Hh7T\" data-time=\"1745394519531\">◆\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.luca-inc.com\u002F\" data-has-link=\"true\" rel=\"noopener nofollow\">\u003Cstrong>〈Luca Scandinavia（ルカスカンジナビア）〉\u003C\u002Fstrong>\u003C\u002Fa>\u003C\u002Fp>",{"project":60,"publishedAt":61,"createdAt":62,"order":31,"publishType":32,"schema":63,"uid":64,"updatedAt":65},{"id":28},["Date","2025-04-23T07:49:00.000Z"],["Date","2025-04-23T07:42:45.000Z"],{"id":34,"key":35,"postType":36},"rJ4FL36x",["Date","2025-05-28T06:02:41.000Z"],[67,68,69],"S2EU8djY:iQIXcYlc","ScKXlWON:dJMAgZ0Y","sB0E_NRW:ypIvIsFD","sCvPdSa0j5ck9N912kMR",{"slug":72,"cover":73,"title":74,"OkocjktT":74,"S2EU8djY":75,"ScKXlWON":78,"sB0E_NRW":87,"body":105,"_meta":106,"_filter":113,"id":117},"column_08","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_0b99a133-a76d-4425-bc85-056c710bd669.jpg","爪のしくみ、知っていますか",{"id":76,"title":77},"eixet5FE","爪のこと",{"slug":5,"cover":6,"title":7,"OkocjktT":8,"S2EU8djY":79,"body":46,"_meta":80,"_filter":86,"id":57},{"id":10,"title":11},{"project":81,"publishedAt":82,"createdAt":83,"order":31,"publishType":32,"schema":84,"uid":52,"updatedAt":85},{"id":28},["Date","2025-05-28T06:01:03.000Z"],["Date","2025-05-28T05:25:17.000Z"],{"id":34,"key":35,"postType":36},["Date","2025-06-25T07:38:35.000Z"],[40,55,56],{"slug":88,"cover":89,"title":90,"OkocjktT":91,"S2EU8djY":92,"body":93,"_meta":94,"_filter":101,"id":104},"column_09","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1600x1600_v-fms_webp_a791b174-8ab2-40fc-8be3-2dc1a60f60f6.png","指先から素肌まで、”整える”ということ ","指先から素肌まで、”整える”ということ",{"id":18,"title":19},"\u003Cp data-uid=\"WGlmZ_HS\" data-time=\"1753234581716\">ロングルアージュに、\u003Cstrong>スキンケアシリーズ\u003C\u002Fstrong>があることをご存知でしょうか。\u003C\u002Fp>\u003Cp data-uid=\"0z5VARyq\" data-time=\"1753234784666\">爪を美しく育てるために、私たちはずっと\u003Cstrong>「保湿の大切さ」\u003C\u002Fstrong>をお伝えしてきました。どんなに丁寧なケアや美しいカラーを施しても、土台である爪が乾燥していては、美しさは長くは続きません。\u003C\u002Fp>\u003Cp data-uid=\"DuA1r8EA\" data-time=\"1753234316137\">それは、お肌も同じこと。\u003C\u002Fp>\u003Cp data-uid=\"H8Md8MYE\" data-time=\"1753234790063\">どんな美容成分よりもまず先に、\u003Cstrong>”うるおい”\u003C\u002Fstrong>を与えること。私たちは、そう考えています。\u003C\u002Fp>\u003Cp data-uid=\"f6qzrJYV\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"H7ZLarB1\" data-time=\"1753234793133\">ロングルアージュのスキンケアが生まれたきっかけは、十数年前。ネイルの施術前に使える、肌にやさしい化粧水を探していたことが始まりでした。\u003C\u002Fp>\u003Cp data-uid=\"WjNk7_Qf\" data-time=\"1753234866427\">敏感肌でアルコールが使えないお客様や、手を何度も洗うスタッフの手肌を守りたい。\u003C\u002Fp>\u003Cp data-uid=\"6OlrA7E6\" data-time=\"1753234316137\">その想いから出会ったのが、イオン化された水をベースに開発された保湿化粧水でした。\u003C\u002Fp>\u003Cp data-uid=\"reKVe5tf\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"cCzVYvZz\" data-time=\"1753234558568\">以来、この化粧水は、私たちにとって、爪と肌の\u003Cstrong>”うるおいの原点”\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"2er5wf2T\" data-time=\"1753234800803\">目立つ成分や香りで飾るのではなく、余計なものをそぎ落とし、必要な水分だけをまっすぐに届ける。爪も肌も、その人本来の美しさを引き出すには、\u003Cstrong>シンプルで上質な保湿\u003C\u002Fstrong>が欠かせないのです。\u003C\u002Fp>\u003Cp data-uid=\"caBH_vYZ\" data-time=\"1753234804189\">お客様の爪がみずみずしさを取り戻し、ふとした瞬間に光をまとった指先へと変わっていく。その小さな変化を、私たちは何度も目にしてきました。\u003C\u002Fp>\u003Cp data-uid=\"9ILvlcfU\" data-time=\"1753234316137\">その感動を、今度はお肌にも。\u003C\u002Fp>\u003Cp data-uid=\"g67qBUCi\" data-time=\"1753234316137\">&nbsp;\u003C\u002Fp>\u003Cp data-uid=\"ysBnSRO5\" data-time=\"1753234808227\">誰もが安心して使えるものを。赤ちゃんも、ご年配の方も、敏感肌の方にも。\u003C\u002Fp>\u003Cp data-uid=\"xn7BxnUM\" data-time=\"1753234727877\">\u003Cstrong>爪を知り尽くしたネイルサロンが、本気でつくったスキンケア\u003C\u002Fstrong>です。\u003C\u002Fp>",{"project":95,"publishedAt":96,"createdAt":97,"order":31,"publishType":32,"schema":98,"uid":99,"updatedAt":100},{"id":28},["Date","2025-07-23T01:41:44.000Z"],["Date","2025-07-23T01:29:12.000Z"],{"id":34,"key":35,"postType":36},"RoToLWf6",["Date","2025-08-12T02:20:32.000Z"],[102,67,103],"ScKXlWON:E_jW5YMS","sB0E_NRW:KE1ulQ6e","JMjR0bEKEMZAGOl10C2Z","\u003Cp data-uid=\"_E1aeedg\" data-time=\"1750831195588\">毎日目にする”爪”ですが、その構造や役割については意外と知られていません。\u003C\u002Fp>\u003Cp data-uid=\"58cK4zTq\" data-time=\"1750836462753\">健康で美しい指先を保つために、まずは「知ること」から始めてみませんか。\u003C\u002Fp>\u003Cp data-uid=\"65tSNrO1\" data-time=\"1750832856665\">今回は、爪のしくみとケアの重要性についてご紹介します。\u003C\u002Fp>\u003Cp data-uid=\"NOcKhvjt\" data-time=\"1750831169338\">\u003C\u002Fp>\u003Ch1 data-uid=\"H0FG2g0R\" data-time=\"1750831162798\" id=\"index_H0FG2g0R\">\u003Cstrong>指先を守る、大切な役割\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"agy_rwaT\" data-time=\"1750831406615\">爪の主な成分は、たんぱく質の一種\u003Cstrong>「ケラチン」\u003C\u002Fstrong>。水分や脂質、カルシウムなどをわずかに含み、髪の毛と同様に皮膚が角質化してできたものです。この角質部分には細胞の活動がないため、一度傷んでしまうと自ら回復することはありません。だからこそ、日々のケアがとても重要です。\u003C\u002Fp>\u003Cp data-uid=\"DnFQ039Z\" data-time=\"1750831332938\">爪の大きな役割は、\u003Cstrong>指先の保護\u003C\u002Fstrong>。\u003C\u002Fp>\u003Cp data-uid=\"8EPf5mOw\" data-time=\"1750832871996\">物をつかむ・ボタンを押す・文字を書くなど、日常のあらゆる動作において、爪は指先の繊細な動きを支えています。\u003C\u002Fp>\u003Cp data-uid=\"CnpNrbEI\" data-time=\"1750831395736\">\u003C\u002Fp>\u003Ch1 data-uid=\"0eX3jCto\" data-time=\"1750831381723\" id=\"index_0eX3jCto\">\u003Cstrong>爪の構造をのぞいてみましょう\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"gh0HaOAV\" data-time=\"1750831456598\">爪は、私たちが目にする部分だけでなく、皮膚の下にある複雑な構造によって成り立っています。&nbsp;\u003C\u002Fp>\u003Cfigure data-uid=\"ySRRmdz6\" data-time=\"1750832008029\" data-thread=\"\" style=\"text-align: \">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-cms-assets\u002Fprojects\u002FxPORdZvpar\u002Fs-1875x1429_v-frms_webp_04485877-fd0d-48e6-a9c1-5154cf91ccda.png\" alt=\"\" width=\"418\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"iuNzcyQ0\" data-time=\"1750832241494\">\u003Cstrong>爪根（そうこん）／ネイルルート（a）\u003C\u002Fstrong>\u003Cbr>生まれたての爪の一部。皮膚の下にあり、外からは見えません。\u003C\u002Fp>\u003Cp data-uid=\"7vqRuFQR\" data-time=\"1750832248732\">\u003Cstrong>爪母（そうぼ）／ネイルマトリックス（b）\u003C\u002Fstrong>\u003Cbr>爪をつくり出す“製造工場”。ここで生まれた細胞が角質化し、爪となって伸びていきます。\u003C\u002Fp>\u003Cp data-uid=\"gCyM26A1\" data-time=\"1750832253065\">\u003Cstrong>爪半月（そうはんげつ）／ルヌラ（c）\u003C\u002Fstrong>\u003Cbr>爪の根元に見える白い半月状の部分。健康状態により見え方が変わることもあります。\u003C\u002Fp>\u003Cp data-uid=\"bwxqvuyH\" data-time=\"1750832255431\">\u003Cstrong>甘皮（あまかわ）／キューティクル（d）\u003C\u002Fstrong>\u003Cbr>爪と皮膚の間をふさぎ、異物や細菌の侵入を防ぐガード役。健康な状態では、爪の成長に合わせてしなやかに動きます。\u003C\u002Fp>\u003Cp data-uid=\"qLkv0_aU\" data-time=\"1750832258330\">\u003Cstrong>爪下皮（そうかひ）／ハイポニキウム（e）\u003C\u002Fstrong>\u003Cbr>爪先の裏側にある皮膚部分。爪と指とをつなぎ、支え、保護します。\u003C\u002Fp>\u003Cp data-uid=\"IL7sV68S\" data-time=\"1750832260707\">\u003Cstrong>爪甲（そうこう）／ネイルプレート（f）\u003C\u002Fstrong>\u003Cbr>私たちが日常的に「爪」と呼ぶ部分。爪母でつくられた角質が、少しずつ押し出されて形成されます。\u003C\u002Fp>\u003Cp data-uid=\"5jauiwAn\" data-time=\"1750832186824\">このように、爪は\u003Cstrong>根元から先端までが連動して機能する、繊細で緻密な構造\u003C\u002Fstrong>を持っているのです。\u003C\u002Fp>\u003Cp data-uid=\"9Orgko3k\" data-time=\"1750830897989\">&nbsp;\u003C\u002Fp>\u003Ch1 data-uid=\"st0vyUWM\" data-time=\"1750832989390\" id=\"index_st0vyUWM\">\u003Cstrong>甘皮ケアが、美しい爪を育てる\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"b0VSXlZA\" data-time=\"1750832303662\">なかでも、\u003Cstrong>甘皮（キューティクル）\u003C\u002Fstrong>は爪を保護する大切な存在です。\u003C\u002Fp>\u003Cp data-uid=\"Pr4yN9cQ\" data-time=\"1750832353401\">しかし、甘皮が必要以上に爪に張りついた状態が続くと、爪の成長を妨げたり、伸びる過程で甘皮が引っ張られて裂け、ささくれの原因になったりすることもあります。\u003C\u002Fp>\u003Cp data-uid=\"iRDK_Ayx\" data-time=\"1750832499376\">ロングルアージュでは、この\u003Cstrong>甘皮ケア\u003C\u002Fstrong>をとても大切に考えています。\u003C\u002Fp>\u003Cp data-uid=\"diqtmgtZ\" data-time=\"1750832814367\">週に一度、ぬるま湯などで甘皮をやわらかくしてから、やさしく押し上げて爪から離してあげましょう。こうすることで、根元まで保湿や美容成分が届きやすくなり、健康な爪が育ちやすくなります。また、ベースコートやネイルカラーを塗る際には、甘皮部分をふさがないよう、\u003Cstrong>根元1mmを空けて塗る\u003C\u002Fstrong>もおすすめです。\u003C\u002Fp>\u003Cp data-uid=\"6j4iCgY7\" data-time=\"1750832523375\">見た目の美しさだけでなく、爪の呼吸を妨げない細やかな配慮が、長く健やかな指先を保つ秘訣です。\u003C\u002Fp>\u003Cp data-uid=\"txF3q1Qv\" data-time=\"1750830897989\">&nbsp;\u003C\u002Fp>\u003Ch1 data-uid=\"JVRs2cJG\" data-time=\"1750832542921\" id=\"index_JVRs2cJG\">\u003Cstrong>爪はどう伸びる？ 成長のしくみ\u003C\u002Fstrong>\u003C\u002Fh1>\u003Cp data-uid=\"PnyBNiZs\" data-time=\"1750832563021\">爪は、爪母（マトリックス）でつくられた新しい細胞が角質化し、押し出されることで伸びていきます。\u003C\u002Fp>\u003Cp data-uid=\"9MZgKOBI\" data-time=\"1750832635665\">成人の手の爪は、\u003Cstrong>1ヶ月で約3mm\u003C\u002Fstrong>伸び、すべてが生え変わるまでには\u003Cstrong>約5〜6ヶ月\u003C\u002Fstrong>かかります。一方、足の爪はその半分から3分の1程度のスピードで伸び、生え変わりには\u003Cstrong>約1年〜1年半\u003C\u002Fstrong>かかるとされています。\u003C\u002Fp>\u003Cp data-uid=\"feRsFvQN\" data-time=\"1750832681315\">成長はゆっくりですが、\u003Cstrong>日々のケアの積み重ねが、半年後・1年後の指先を変える\u003C\u002Fstrong>のです。\u003C\u002Fp>\u003Cp data-uid=\"eGgrSn7A\" data-time=\"1750832833706\">\u003C\u002Fp>\u003Cp data-uid=\"MnyZe_CX\" data-time=\"1750832839867\">ロングルアージュでは、見た目の美しさだけでなく、\u003Cstrong>爪そのものの質を育てるケア\u003C\u002Fstrong>を大切にしています。毎日の丁寧な習慣が、長く続く美しさへとつながっていきます。\u003C\u002Fp>\u003Cp data-uid=\"4HLPzM8M\" data-time=\"1750832760976\">ぜひ、ご自身の爪と少し向き合うひとときを、日々の中に取り入れてみてください。\u003C\u002Fp>",{"project":107,"publishedAt":108,"createdAt":109,"order":31,"publishType":32,"schema":110,"uid":111,"updatedAt":112},{"id":28},["Date","2025-06-25T07:35:08.000Z"],["Date","2025-06-25T05:52:21.000Z"],{"id":34,"key":35,"postType":36},"E_jW5YMS",["Date","2025-08-12T01:57:53.000Z"],[114,115,116],"S2EU8djY:eixet5FE","ScKXlWON:ypIvIsFD","sB0E_NRW:RoToLWf6","gVaM7hAYbXl73Trt7B3s",{"project":119,"publishedAt":120,"createdAt":121,"order":31,"publishType":32,"schema":122,"uid":52,"updatedAt":123},{"id":28},["Date","2025-05-28T06:01:03.000Z"],["Date","2025-05-28T05:25:17.000Z"],{"id":34,"key":35,"postType":36},["Date","2025-06-25T07:38:35.000Z"],[40,55,56],["Reactive",126],{},["Set"],["ShallowReactive",129],{"dynamicDatacolumn\u002Fposts\u002Fcolumn_07":-1},true,"\u002Fcolumn\u002Fposts\u002Fcolumn_07",["Reactive",133],{"cmsContentStore":134,"projectStore":138,"productStore":159,"pageHeadStore":702,"cmsStore":706,"useSnackBarStore":714},{"listContentsMap":135,"contentMap":136},["Map"],["Map",137,4],"SLmv5Xy5\u002Fcolumn_07",{"siteHost":139,"customProxyDomain":140,"project":141},"longleage.co.jp","",{"id":142,"name":19,"customDomain":140,"iconImage":140,"coverImage":143,"displayBadge":144,"integrations":145,"snapshot_path":157,"snapshot_id":158,"recaptchaSiteKey":-1,"conversionEvents":-1},"xPORdZvpar","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F0f5840fe-8094-40fc-9ebe-de2bc0684702",false,[146,149,151,154],{"integration_name":147,"code":148},"custom-code","true",{"integration_name":150,"code":140},"google-analytics",{"integration_name":152,"code":153},"google-tag-manager","GTM-N9Q3BWHZ",{"integration_name":155,"code":156},"search-console","NsumBMx5xUst03kk1dvnTIb55odGQA_RpkV5BWfMX2g","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-publish\u002Fprojects\u002FxPORdZvpar\u002F3qb3zNXNaJ\u002F","3qb3zNXNaJ",{"product":160,"isLoaded":130,"selectedModalIds":698,"redirectPage":699,"isInitializedRSS":144,"pageViewMap":700,"symbolViewMap":701},{"breakPoints":161,"colors":171,"fonts":172,"head":216,"info":233,"pages":244,"re
